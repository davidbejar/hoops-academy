    MatchEvent:
      description: A match event, polymorphic on `type`.
      oneOf:
        - $ref: '#/components/schemas/PeriodStartEvent'
        - $ref: '#/components/schemas/PeriodEndEvent'
        - $ref: '#/components/schemas/SubInEvent'
        - $ref: '#/components/schemas/SubOutEvent'
        - $ref: '#/components/schemas/ShotEvent'
        - $ref: '#/components/schemas/AssistEvent'
        - $ref: '#/components/schemas/ReboundEvent'
        - $ref: '#/components/schemas/TurnoverEvent'
        - $ref: '#/components/schemas/StealEvent'
        - $ref: '#/components/schemas/BlockEvent'
        - $ref: '#/components/schemas/FoulEvent'
        - $ref: '#/components/schemas/OpponentScoreEvent'
        - $ref: '#/components/schemas/TimeoutEvent'
        - $ref: '#/components/schemas/VoidEvent'
        - $ref: '#/components/schemas/NoteEvent'
      discriminator:
        propertyName: type
        mapping:
          PERIOD_START: '#/components/schemas/PeriodStartEvent'
          PERIOD_END: '#/components/schemas/PeriodEndEvent'
          SUB_IN: '#/components/schemas/SubInEvent'
          SUB_OUT: '#/components/schemas/SubOutEvent'
          SHOT: '#/components/schemas/ShotEvent'
          ASSIST: '#/components/schemas/AssistEvent'
          REBOUND: '#/components/schemas/ReboundEvent'
          TURNOVER: '#/components/schemas/TurnoverEvent'
          STEAL: '#/components/schemas/StealEvent'
          BLOCK: '#/components/schemas/BlockEvent'
          FOUL: '#/components/schemas/FoulEvent'
          OPPONENT_SCORE: '#/components/schemas/OpponentScoreEvent'
          TIMEOUT: '#/components/schemas/TimeoutEvent'
          VOID: '#/components/schemas/VoidEvent'
          NOTE: '#/components/schemas/NoteEvent'

    MatchEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/MatchEvent'}
    MatchEventResultStatus:
      type: string
      enum: [ACCEPTED, DUPLICATE, REJECTED]
    MatchEventRejectionReason:
      type: string
      description: |
        SCHEMA_INVALID — event does not match its type's schema; NOT_AUTHORIZED — caller may not enter this event
        (e.g. PARENT for a non-linked player, VOID of someone else's event); MATCH_CANCELLED — match is CANCELLED;
        CLIENT_SEQ_CONFLICT — (deviceId, clientSeq) already used by a different event id; EVENT_ID_REUSED — the event id
        is already stored for another match (ids are global); MATCH_NOT_STARTED — reserved for a future policy that
        refuses events of SCHEDULED matches (v1 accepts them so offline devices never lose events, ADR-0014; clients
        must already handle it).
      enum: [SCHEMA_INVALID, NOT_AUTHORIZED, MATCH_CANCELLED, CLIENT_SEQ_CONFLICT, EVENT_ID_REUSED, MATCH_NOT_STARTED]
    MatchEventResult:
      type: object
      required: [eventId, status]
      properties:
        eventId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/MatchEventResultStatus'}
        serverSeq:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Set for ACCEPTED and DUPLICATE.
        reason:
          allOf: [{$ref: '#/components/schemas/MatchEventRejectionReason'}]
          nullable: true
          description: Set for REJECTED.
        message:
          type: string
          nullable: true
          description: Human-readable detail for REJECTED (e.g. the failing schema path).
    MatchEventBatchResult:
      type: object
      required: [results, lastServerSeq]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/MatchEventResult'}
        lastServerSeq: {type: integer, format: int64, minimum: 0}
    StoredMatchEvent:
      type: object
      description: A match event as stored by the server.
      required: [serverSeq, event, recordedBy, receivedAt]
      properties:
        serverSeq: {type: integer, format: int64, minimum: 1}
        event: {$ref: '#/components/schemas/MatchEvent'}
        recordedBy: {$ref: './common.yaml#/components/schemas/PersonRef'}
        receivedAt: {type: string, format: date-time}
        voidedByEventId:
          type: string
          format: uuid
          nullable: true
          description: Set when a later VOID event targets this event.
    MatchEventFeed:
      type: object
      required: [events, lastServerSeq, hasMore]
      properties:
        events:
          type: array
          items: {$ref: '#/components/schemas/StoredMatchEvent'}
        lastServerSeq:
          type: integer
          format: int64
          minimum: 0
          description: Highest stored `serverSeq` of the match (cursor for the next call when hasMore = false).
        hasMore:
          type: boolean
          description: More events exist after the last returned one.

    # ---------------- statistics
    StatLine:
      type: object
      description: Counting statistics. fg1 = free throws, fg2 = two-point field goals, fg3 = three-pointers.
      required: [points, fg1Made, fg1Attempted, fg2Made, fg2Attempted, fg3Made, fg3Attempted, assists, offensiveRebounds, defensiveRebounds, turnovers, steals, blocks, personalFouls, technicalFouls, unsportsmanlikeFouls, secondsPlayed]
      properties:
        points: {type: integer, format: int32, minimum: 0}
        fg1Made: {type: integer, format: int32, minimum: 0}
        fg1Attempted: {type: integer, format: int32, minimum: 0}
        fg2Made: {type: integer, format: int32, minimum: 0}
        fg2Attempted: {type: integer, format: int32, minimum: 0}
        fg3Made: {type: integer, format: int32, minimum: 0}
        fg3Attempted: {type: integer, format: int32, minimum: 0}
        assists: {type: integer, format: int32, minimum: 0}
        offensiveRebounds: {type: integer, format: int32, minimum: 0}
        defensiveRebounds: {type: integer, format: int32, minimum: 0}
        turnovers: {type: integer, format: int32, minimum: 0}
        steals: {type: integer, format: int32, minimum: 0}
        blocks: {type: integer, format: int32, minimum: 0}
        personalFouls:
          type: integer
          format: int32
          minimum: 0
          description: All fouls committed (PERSONAL + TECHNICAL + UNSPORTSMANLIKE).
        technicalFouls:
          type: integer
          format: int32
          minimum: 0
          description: TECHNICAL fouls (also counted in personalFouls).
        unsportsmanlikeFouls:
          type: integer
          format: int32
          minimum: 0
          description: UNSPORTSMANLIKE fouls (also counted in personalFouls).
        secondsPlayed:
          type: integer
          format: int32
          minimum: 0
          description: Derived from starters and period / substitution events.
    ProjectionWarning:
      type: object
      description: Domain inconsistency found while projecting (events are never rejected for these).
      required: [code, eventId, message]
      properties:
        code:
          type: string
          description: |
            Open set (new codes may appear; clients must tolerate unknown values), e.g. SUB_IN_PLAYER_ON_COURT,
            SUB_OUT_PLAYER_NOT_ON_COURT, PLAYER_NOT_IN_ROSTER, VOID_TARGET_NOT_FOUND, EVENT_OUTSIDE_PERIOD.
          example: SUB_IN_PLAYER_ON_COURT
        eventId: {type: string, format: uuid}
        playerId: {type: string, format: uuid, nullable: true}
        message: {type: string}
    PlayerMatchStats:
      type: object
      required: [playerId, displayName, wasStarter, stats, warnings]
      properties:
        playerId: {type: string, format: uuid}
        displayName: {type: string}
        jerseyNumber:
          allOf: [{$ref: '#/components/schemas/JerseyNumber'}]
          nullable: true
        wasStarter: {type: boolean}
        stats: {$ref: '#/components/schemas/StatLine'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/ProjectionWarning'}
    PeriodScore:
      type: object
      required: [period, team, opponent]
      properties:
        period: {type: integer, format: int32, minimum: 1}
        team: {type: integer, format: int32, minimum: 0}
        opponent: {type: integer, format: int32, minimum: 0}
    BoxScore:
      type: object
      required: [matchId, status, score, periodScores, teamTotals, players, warnings, lastServerSeq]
      properties:
        matchId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/MatchStatus'}
        score: {$ref: '#/components/schemas/Score'}
        periodScores:
          type: array
          items: {$ref: '#/components/schemas/PeriodScore'}
        teamTotals: {$ref: '#/components/schemas/StatLine'}
        players:
          type: array
          description: Player lines visible to the caller.
          items: {$ref: '#/components/schemas/PlayerMatchStats'}
        warnings:
          type: array
          description: Match-level warnings (not attributable to a player).
          items: {$ref: '#/components/schemas/ProjectionWarning'}
        lastServerSeq:
          type: integer
          format: int64
          minimum: 0
          description: Projection is up to date with events up to this sequence number.
    StatAverages:
      type: object
      description: Per-game averages over games played.
      required: [points, assists, rebounds, steals, blocks, turnovers, personalFouls, minutesPlayed]
      properties:
        points: {type: number, format: double, minimum: 0}
        assists: {type: number, format: double, minimum: 0}
        rebounds: {type: number, format: double, minimum: 0}
        steals: {type: number, format: double, minimum: 0}
        blocks: {type: number, format: double, minimum: 0}
        turnovers: {type: number, format: double, minimum: 0}
        personalFouls: {type: number, format: double, minimum: 0}
        minutesPlayed: {type: number, format: double, minimum: 0}
    PlayerMatchLine:
      type: object
      required: [matchId, scheduledAt, opponentName, status, wasStarter, stats]
      properties:
        matchId: {type: string, format: uuid}
        scheduledAt: {type: string, format: date-time}
        opponentName: {type: string}
        status: {$ref: '#/components/schemas/MatchStatus'}
        wasStarter: {type: boolean}
        stats: {$ref: '#/components/schemas/StatLine'}
    PlayerSeasonStats:
      type: object
      required: [playerId, seasonId, gamesPlayed, gamesStarted, totals, averages, matches]
      properties:
        playerId: {type: string, format: uuid}
        seasonId: {type: string, format: uuid}
        gamesPlayed: {type: integer, format: int32, minimum: 0}
        gamesStarted: {type: integer, format: int32, minimum: 0}
        totals: {$ref: '#/components/schemas/StatLine'}
        averages: {$ref: '#/components/schemas/StatAverages'}
        matches:
          type: array
          items: {$ref: '#/components/schemas/PlayerMatchLine'}
  # Field groups that several schemas repeat (x-extends) instead of composing them with allOf, which
  # swagger-request-validator cannot check strictly. Not wire types: no client code is generated for them.
  x-mixins:
    MatchEventBase:
      type: object
      description: Fields common to every match event (each variant repeats them).
      required: [id, deviceId, clientSeq, type, period, clockSecondsRemaining, recordedAtClient]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7; the idempotency key.
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
          description: Stable id of the scoring device (installation).
        clientSeq:
          type: integer
          format: int64
          minimum: 1
          description: Per-device monotonically increasing sequence; unique per (match, deviceId).
        type: {$ref: '#/components/schemas/MatchEventType'}
        period:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: 1-based period; values above the match's periodCount are overtimes.
        clockSecondsRemaining:
          type: integer
          format: int32
          minimum: 0
          maximum: 3600
          description: Game clock at the event, seconds remaining in the period.
        recordedAtClient:
          type: string
          format: date-time
          description: Device wall clock (UTC) when the event was entered.
    PlayerAttribution:
      type: object
      required: [playerId]
      properties:
        playerId:
          type: string
          format: uuid
          description: Player the event is attributed to (must be on the match roster for the projection).
