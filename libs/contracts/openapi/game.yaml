openapi: 3.0.3
info:
  title: Hoops Academy — game-service API
  version: 2.0.1
  description: |
    Match operations and statistics (offline-first, event-sourced).

    Match events are append-only, client-identified facts (`id` = client-generated UUIDv7, unique per
    `(matchId, deviceId, clientSeq)`). The server validates **schema + authorization only**, never domain consistency:
    an impossible substitution becomes a projection *warning* that staff fix with a VOID event. Box scores and season
    statistics are projections re-computed on every accepted batch.

    `MatchEvent` mirrors `events/match-event.schema.json` (JSON Schema 2020-12); `MatchEventSchemaConsistencyTest`
    keeps both in sync.

    Authorization (docs/domain/authz-matrix.md): team staff (COACH / ASSISTANT_COACH) and ADMIN may run matches and
    enter any event; PARENT may enter player-attributed stat events for linked players and VOID their own events only;
    PLAYER is read-only (own statistics).
servers:
  - url: /
    description: Gateway root (tenant API under /api/game, internal API under /internal).
security:
  - bearerAuth: []
tags:
  - name: Matches
  - name: MatchRoster
  - name: MatchEvents
    description: Offline sync of append-only match events.
  - name: Statistics
    description: Projections (box score, season statistics).
  - name: Internal
    description: Service-to-service endpoints.

paths:
  /api/game/matches:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listMatches
      tags: [Matches]
      summary: List matches by team and/or season (scheduledAt descending)
      description: 'Authz: any member (PARENT/PLAYER see matches of their teams).'
      parameters:
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - $ref: './common.yaml#/components/parameters/SeasonIdQuery'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/MatchStatus'}
        - name: scheduledFrom
          in: query
          schema: {type: string, format: date-time}
        - name: scheduledTo
          in: query
          schema: {type: string, format: date-time}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of matches.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    post:
      operationId: createMatch
      tags: [Matches]
      summary: Schedule a match
      description: 'The season is taken from the team. Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMatchRequest'}
      responses:
        '201':
          description: Match created (SCHEDULED).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/matches/{matchId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/MatchId'
    get:
      operationId: getMatch
      tags: [Matches]
      summary: Get a match
      description: 'Authz: any member of the team''s audience.'
      responses:
        '200':
          description: The match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateMatch
      tags: [Matches]
      summary: Update a scheduled match
      description: '`periodCount`/`periodMinutes` can only change while SCHEDULED (409). Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMatchRequest'}
      responses:
        '200':
          description: Updated match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/matches/{matchId}/start:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/MatchId'
    post:
      operationId: startMatch
      tags: [Matches]
      summary: SCHEDULED → LIVE
      description: 'Requires a roster with at least one starter (422). Idempotent for an already LIVE match. Authz: ADMIN; team staff.'
      responses:
        '200':
          description: Live match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/matches/{matchId}/finish:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/MatchId'
    post:
      operationId: finishMatch
      tags: [Matches]
      summary: LIVE → FINISHED
      description: 'Events may still be synced afterwards (late offline devices, VOID corrections). Authz: ADMIN; team staff.'
      responses:
        '200':
          description: Finished match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/matches/{matchId}/cancel:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/MatchId'
    post:
      operationId: cancelMatch
      tags: [Matches]
      summary: SCHEDULED | LIVE → CANCELLED
      description: 'Further events are REJECTED with MATCH_CANCELLED. FINISHED matches cannot be cancelled (409). Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelMatchRequest'}
      responses:
        '200':
          description: Cancelled match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/matches/{matchId}/roster:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/MatchId'
    get:
      operationId: getMatchRoster
      tags: [MatchRoster]
      summary: Get the match roster
      description: 'Authz: any member of the team''s audience.'
      responses:
        '200':
          description: Match roster.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchRoster'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    put:
      operationId: replaceMatchRoster
      tags: [MatchRoster]
      summary: Replace the match roster
      description: |
        Players must be on the team's current roster (core `/internal/teams/{teamId}/roster`, 422 otherwise); display
        name and jersey are denormalised so offline sync never depends on core. Not allowed for FINISHED or CANCELLED
        matches (409). Authz: ADMIN; team staff.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceMatchRosterRequest'}
      responses:
        '200':
          description: Stored roster.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchRoster'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/matches/{matchId}/events:batch:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/MatchId'
    post:
      operationId: submitMatchEvents
      tags: [MatchEvents]
      summary: Sync a batch of match events (idempotent)
      description: |
        Locks the match, appends new events, re-projects statistics and answers one result per submitted event, in
        request order. ACCEPTED: stored now (gets a `serverSeq`); DUPLICATE: an event with this `id` was already stored
        (its original `serverSeq` is returned) — safe to drop from the device queue; REJECTED: not stored, see
        `reason` (schema or authorization) — retrying unchanged will fail again. A REJECTED event never fails the
        batch: the server validates each event individually against `events/match-event.schema.json`.
        Whole-request errors: 400 (not a batch, or more than 500 events), 404 (unknown match).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchEventBatch'}
      responses:
        '200':
          description: Per-event results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchEventBatchResult'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/matches/{matchId}/events:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/MatchId'
    get:
      operationId: listMatchEvents
      tags: [MatchEvents]
      summary: Events stored after a server sequence number (merge feed for other devices)
      description: 'Ordered by `serverSeq` ascending. Includes voided events (with `voidedByEventId`). Authz: any member who may view the match.'
      parameters:
        - name: after
          in: query
          description: Return events with `serverSeq` > `after` (0 = from the beginning).
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, format: int32, minimum: 1, maximum: 1000, default: 500}
      responses:
        '200':
          description: Events after the cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchEventFeed'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/matches/{matchId}/box-score:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/MatchId'
    get:
      operationId: getBoxScore
      tags: [Statistics]
      summary: Box score projection of a match
      description: 'Authz: ADMIN and team staff see all players; PARENT sees linked players'' lines; PLAYER sees own line (team totals always visible).'
      responses:
        '200':
          description: Box score.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoxScore'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/game/players/{playerId}/season-stats:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: playerId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPlayerSeasonStats
      tags: [Statistics]
      summary: A player's statistics over a season (FINISHED and LIVE matches)
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      parameters:
        - name: seasonId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Season statistics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerSeasonStats'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /internal/usage/{tenantId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    get:
      operationId: getGameUsage
      tags: [Internal]
      summary: game-service usage counters of a tenant
      description: 'Authz: role `service`.'
      x-internal: true
      responses:
        '200':
          description: Usage counters.
          content:
            application/json:
              schema: {$ref: './common.yaml#/components/schemas/UsageReport'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    MatchId:
      name: matchId
      in: path
      required: true
      schema: {type: string, format: uuid}

  schemas:
    # ---------------- matches
    MatchStatus:
      type: string
      enum: [SCHEDULED, LIVE, FINISHED, CANCELLED]
    HomeAway:
      type: string
      enum: [HOME, AWAY]
    JerseyNumber:
      type: string
      pattern: '^[0-9]{1,2}$'
      example: '7'
    Score:
      type: object
      required: [team, opponent]
      properties:
        team: {type: integer, format: int32, minimum: 0}
        opponent: {type: integer, format: int32, minimum: 0}
    Match:
      type: object
      required: [id, teamId, seasonId, opponentName, homeAway, scheduledAt, status, periodCount, periodMinutes, score, lastServerSeq]
      properties:
        id: {type: string, format: uuid}
        teamId: {type: string, format: uuid}
        seasonId: {type: string, format: uuid}
        opponentName: {type: string}
        homeAway: {$ref: '#/components/schemas/HomeAway'}
        scheduledAt: {type: string, format: date-time}
        venue: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/MatchStatus'}
        periodCount: {type: integer, format: int32, minimum: 1, maximum: 8}
        periodMinutes: {type: integer, format: int32, minimum: 1, maximum: 60}
        startedAt: {type: string, format: date-time, nullable: true}
        finishedAt: {type: string, format: date-time, nullable: true}
        cancelledAt: {type: string, format: date-time, nullable: true}
        cancelReason: {type: string, nullable: true}
        score: {$ref: '#/components/schemas/Score'}
        lastServerSeq:
          type: integer
          format: int64
          minimum: 0
          description: Highest `serverSeq` stored for the match (0 = no events).
    MatchPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Match'}
        page: {$ref: './common.yaml#/components/schemas/PageMeta'}
    CreateMatchRequest:
      type: object
      required: [teamId, opponentName, homeAway, scheduledAt]
      properties:
        teamId: {type: string, format: uuid}
        opponentName: {type: string, minLength: 1, maxLength: 120}
        homeAway: {$ref: '#/components/schemas/HomeAway'}
        scheduledAt: {type: string, format: date-time}
        venue: {type: string, maxLength: 200}
        periodCount: {type: integer, format: int32, minimum: 1, maximum: 8, default: 4}
        periodMinutes: {type: integer, format: int32, minimum: 1, maximum: 60, default: 10}
    UpdateMatchRequest:
      type: object
      minProperties: 1
      properties:
        opponentName: {type: string, minLength: 1, maxLength: 120}
        homeAway: {$ref: '#/components/schemas/HomeAway'}
        scheduledAt: {type: string, format: date-time}
        venue: {type: string, maxLength: 200, nullable: true}
        periodCount: {type: integer, format: int32, minimum: 1, maximum: 8}
        periodMinutes: {type: integer, format: int32, minimum: 1, maximum: 60}
    CancelMatchRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}

    # ---------------- roster
    MatchRoster:
      type: object
      required: [matchId, entries]
      properties:
        matchId: {type: string, format: uuid}
        entries:
          type: array
          items: {$ref: '#/components/schemas/MatchRosterEntry'}
    MatchRosterEntry:
      type: object
      required: [playerId, displayName, isStarter]
      properties:
        playerId: {type: string, format: uuid}
        displayName: {type: string}
        jerseyNumber:
          allOf: [{$ref: '#/components/schemas/JerseyNumber'}]
          nullable: true
        isStarter: {type: boolean}
    ReplaceMatchRosterRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/MatchRosterEntryInput'}
    MatchRosterEntryInput:
      type: object
      required: [playerId, isStarter]
      properties:
        playerId: {type: string, format: uuid}
        jerseyNumber:
          allOf: [{$ref: '#/components/schemas/JerseyNumber'}]
          description: Overrides the team jersey for this match.
        isStarter: {type: boolean}

    # ---------------- match events (mirror of events/match-event.schema.json)
    MatchEventType:
      type: string
      enum: [PERIOD_START, PERIOD_END, SUB_IN, SUB_OUT, SHOT, ASSIST, REBOUND, TURNOVER, STEAL, BLOCK, FOUL, OPPONENT_SCORE, TIMEOUT, VOID, NOTE]

    ShotPayload:
      type: object
      required: [points, made]
      properties:
        points:
          type: integer
          format: int32
          enum: [1, 2, 3]
          description: 1 = free throw, 2 = field goal, 3 = three-pointer.
        made: {type: boolean}
    ReboundPayload:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [OFFENSIVE, DEFENSIVE]
    FoulPayload:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [PERSONAL, TECHNICAL, UNSPORTSMANLIKE]
    OpponentScorePayload:
      type: object
      required: [points]
      properties:
        points:
          type: integer
          format: int32
          enum: [1, 2, 3]
    TimeoutPayload:
      type: object
      required: [side]
      properties:
        side:
          type: string
          enum: [OWN, OPPONENT]
    VoidPayload:
      type: object
      required: [targetEventId]
      properties:
        targetEventId:
          type: string
          format: uuid
          description: Event being voided (PARENT may only void own events).
    NotePayload:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 500}

    PeriodStartEvent:
      description: Start of a period (clock / period event; staff only).
      type: object
      x-extends: [MatchEventBase]
      required: [id, deviceId, clientSeq, type, period, clockSecondsRemaining, recordedAtClient]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7; the idempotency key.
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
          description: Stable id of the scoring device (installation).
        clientSeq:
          type: integer
          format: int64
          minimum: 1
          description: Per-device monotonically increasing sequence; unique per (match, deviceId).
        type:
          allOf: [{$ref: '#/components/schemas/MatchEventType'}]
          enum: [PERIOD_START]
        period:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: 1-based period; values above the match's periodCount are overtimes.
        clockSecondsRemaining:
          type: integer
          format: int32
          minimum: 0
          maximum: 3600
          description: Game clock at the event, seconds remaining in the period.
        recordedAtClient:
          type: string
          format: date-time
          description: Device wall clock (UTC) when the event was entered.
    PeriodEndEvent:
      description: End of a period (clock / period event; staff only).
      type: object
      x-extends: [MatchEventBase]
      required: [id, deviceId, clientSeq, type, period, clockSecondsRemaining, recordedAtClient]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7; the idempotency key.
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
          description: Stable id of the scoring device (installation).
        clientSeq:
          type: integer
          format: int64
          minimum: 1
          description: Per-device monotonically increasing sequence; unique per (match, deviceId).
        type:
          allOf: [{$ref: '#/components/schemas/MatchEventType'}]
          enum: [PERIOD_END]
        period:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: 1-based period; values above the match's periodCount are overtimes.
        clockSecondsRemaining:
          type: integer
          format: int32
          minimum: 0
          maximum: 3600
          description: Game clock at the event, seconds remaining in the period.
        recordedAtClient:
          type: string
          format: date-time
          description: Device wall clock (UTC) when the event was entered.
    SubInEvent:
      description: Player enters the court (staff only).
      type: object
      x-extends: [MatchEventBase, PlayerAttribution]
      required: [id, deviceId, clientSeq, type, period, clockSecondsRemaining, recordedAtClient, playerId]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7; the idempotency key.
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
          description: Stable id of the scoring device (installation).
        clientSeq:
          type: integer
          format: int64
          minimum: 1
          description: Per-device monotonically increasing sequence; unique per (match, deviceId).
        type:
          allOf: [{$ref: '#/components/schemas/MatchEventType'}]
          enum: [SUB_IN]
        period:
          type: integer
          format: int32
          minimum: 1
