  /api/core/seasons/{seasonId}/rollover:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/SeasonId'
    post:
      operationId: rolloverSeason
      tags: [Seasons]
      summary: Roll teams over into this (new) season
      description: |
        `{seasonId}` is the target season. Clones the teams of `fromSeasonId` (name, alias, category, gender policy,
        staff) and their open player assignments, evaluates eligibility with the target season's `referenceYear`,
        invalidates assignments that no longer hold (never deletes) and opens eligibility cases. Returns the orphan
