openapi: 3.0.3
info:
  title: Hoops Academy — core-service API
  version: 2.2.0
  description: |
    Tenancy, identity & membership, roster & eligibility, approvals and platform statistics.

    Path families (all served by core-service):
    - `/api/core/**` — tenant API; every operation except `/api/core/me` requires `X-Tenant-Id`.
    - `/platform/**` — platform super-admin API (realm role `super_admin`); never exposes tenant content, with one
      documented exception: the identity of a tenant's administrators (`/platform/tenants/{tenantId}/admins`, ADR-0023).
    - `/internal/**` — service-to-service API (client-credentials token with role `service`), blocked at the proxy,
      marked `x-internal` so it is not generated into the Flutter client.

    Authorization follows `docs/domain/authz-matrix.md`; the `Authz:` line of each operation summarises it.
servers:
  - url: /
    description: Gateway root (paths are absolute because one service serves three path families).
security:
  - bearerAuth: []
tags:
  - name: Platform
    description: Tenant lifecycle, the tenant's administrators and usage statistics (super_admin).
  - name: Me
    description: The calling user and their memberships.
  - name: Tenant
    description: Academy profile, settings and logo.
  - name: Members
    description: Persons with tenant roles.
  - name: GuardianLinks
    description: Parent/guardian ↔ player relations.
  - name: Seasons
  - name: AgeCategories
  - name: Teams
    description: Teams, team staff and team players (eligibility-checked assignment).
  - name: Players
  - name: ApprovalRequests
    description: Coach-initiated ADD_PLAYER / WITHDRAW_PLAYER requests awaiting an admin decision.
  - name: EligibilityCases
    description: Open issues raised when an assignment becomes invalid (e.g. after rollover).
  - name: Internal
    description: Service-to-service endpoints behind `RosterPort`.

paths:
  # ------------------------------------------------------------------ platform
  /platform/tenants:
    get:
      operationId: listTenants
      tags: [Platform]
      summary: List tenants
      description: 'Authz: super_admin.'
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TenantStatus'}
        - name: q
          in: query
          description: Case-insensitive match on name or slug.
          schema: {type: string, maxLength: 100}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of tenants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: createTenant
      tags: [Platform]
      summary: Onboard a tenant
      description: |
        Atomically creates the tenant, its default settings, the seeded age categories (U8 … U18, SENIOR) and the
        first ADMIN membership; the admin is provisioned in Keycloak with a required-action e-mail.
        Authz: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTenantRequest'}
      responses:
        '201':
          description: Tenant created.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '502': {$ref: './common.yaml#/components/responses/UpstreamIdentityProvider'}
  /platform/tenants/{tenantId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    get:
      operationId: getTenant
      tags: [Platform]
      summary: Get a tenant
      description: 'Authz: super_admin.'
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updateTenant
      tags: [Platform]
      summary: Update tenant master data
      description: 'Authz: super_admin. Absent fields are left unchanged.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTenantRequest'}
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /platform/tenants/{tenantId}/suspend:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    post:
      operationId: suspendTenant
      tags: [Platform]
      summary: Suspend a tenant
      description: 'Logins to the tenant are blocked until it is reactivated. Authz: super_admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantLifecycleRequest'}
      responses:
        '200':
          description: Suspended tenant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
  /platform/tenants/{tenantId}/reactivate:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    post:
      operationId: reactivateTenant
      tags: [Platform]
      summary: Reactivate a suspended tenant
      description: 'Only SUSPENDED tenants can be reactivated (409 otherwise). Authz: super_admin.'
      responses:
        '200':
          description: Active tenant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
  /platform/tenants/{tenantId}/withdraw:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    post:
      operationId: withdrawTenant
      tags: [Platform]
      summary: Withdraw a tenant
      description: |
        Terminal state: logins are blocked immediately, data is retained until `retainUntil`
        (purge job is v2). Authz: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantLifecycleRequest'}
      responses:
        '200':
          description: Withdrawn tenant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
  /platform/tenants/{tenantId}/admins:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    get:
      operationId: listTenantAdmins
      tags: [Platform]
      summary: List the administrators of a tenant
      description: |
        Active members holding the ADMIN role, ordered by family and given name. The only tenant content the platform
        reads (identity of the administrators, ADR-0023). 404 for an unknown tenant; 409 `TENANT_WITHDRAWN` for a
        withdrawn one (ACTIVE and SUSPENDED tenants are managed). Authz: super_admin.
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of administrators.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantAdminPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
    post:
      operationId: addTenantAdmin
      tags: [Platform]
      summary: Add an administrator to a tenant
      description: |
        When an active member of the tenant has this e-mail, they gain the ADMIN role (200; their names are kept; a
        member without a login is given one, with the account-setup e-mail). Otherwise a new member is invited with the
        ADMIN role through the onboarding saga — a new Keycloak user gets the account-setup e-mail, an existing login
        is linked (201). 409 `EMAIL_TAKEN` when a deactivated member has the e-mail, `LOGIN_ALREADY_MEMBER` when the
        login already belongs to another member of the tenant, `TENANT_WITHDRAWN`; 502 when Keycloak fails (nothing is
        kept). Authz: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddTenantAdminRequest'}
      responses:
        '200':
          description: An existing member is now an administrator.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantAdmin'}
        '201':
          description: A new member was invited as administrator.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantAdmin'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '502': {$ref: './common.yaml#/components/responses/UpstreamIdentityProvider'}
  /platform/tenants/{tenantId}/admins/{personId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/PersonId'
    patch:
      operationId: updateTenantAdmin
      tags: [Platform]
      summary: Edit an administrator's names or e-mail
      description: |
        Merge patch; absent fields are left unchanged. An e-mail change also moves the login (Keycloak username and
        e-mail, unverified, verification e-mail to the new address — the account-setup e-mail while the invitation is
        PENDING), also when the login is used in other academies (ADR-0023). 404 when the person is not an active
        administrator of the tenant; 409 `EMAIL_TAKEN` (another member or login uses the address), `TENANT_WITHDRAWN`;
        502 when Keycloak fails (nothing is changed). Authz: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTenantAdminRequest'}
      responses:
        '200':
          description: Updated administrator.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantAdmin'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '502': {$ref: './common.yaml#/components/responses/UpstreamIdentityProvider'}
    delete:
      operationId: removeTenantAdmin
      tags: [Platform]
      summary: Remove an administrator
      description: |
        Drops the ADMIN role; a person whose only role was ADMIN is deactivated in this tenant. The Keycloak login is
        never deleted or disabled (it may be used in other academies). 409 `LAST_ADMIN` for the tenant's last active
        administrator (the `detail` explains that another administrator must be added first); 404 when the person is
        not an active administrator; 409 `TENANT_WITHDRAWN`. Authz: super_admin.
      responses:
        '204':
          description: The person is no longer an administrator.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
  /platform/tenants/{tenantId}/admins/{personId}/resend-invitation:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/PersonId'
    post:
      operationId: resendTenantAdminInvitation
      tags: [Platform]
      summary: Resend the account-setup e-mail of an administrator
      description: |
        Only while the invitation is PENDING (409 `INVITATION_NOT_PENDING` otherwise); 404 when the person is not an
        active administrator; 409 `TENANT_WITHDRAWN`; 502 when Keycloak fails. Authz: super_admin.
      responses:
        '202':
          description: The account-setup e-mail was handed to Keycloak; the administrator (still PENDING).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantAdmin'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '502': {$ref: './common.yaml#/components/responses/UpstreamIdentityProvider'}
  /platform/tenants/{tenantId}/usage:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    get:
      operationId: getTenantUsage
      tags: [Platform]
      summary: Usage statistics of a tenant across all services
      description: |
        Aggregates `/internal/usage/{tenantId}` of core, game and athlete. A service that does not answer is listed in
        `unavailableServices` instead of failing the whole request. Authz: super_admin.
      responses:
        '200':
          description: Usage per service.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantUsage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  /platform/tenants/{tenantId}/usage/history:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    get:
      operationId: getTenantUsageHistory
      tags: [Platform]
      summary: Daily usage snapshots of a tenant (trend)
      description: |
        One snapshot per UTC day, written by the nightly snapshot job and by every `GET .../usage` (a snapshot with
        unavailable services never replaces a complete one of the same day). Ordered by `date` ascending. Defaults:
        `to` = today (UTC), `from` = `to` − 89 days; the range may span at most 366 days (400). Authz: super_admin.
      parameters:
        - name: from
          in: query
          required: false
          description: First UTC day (inclusive).
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          description: Last UTC day (inclusive).
          schema: {type: string, format: date}
      responses:
        '200':
          description: Snapshots in the range.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantUsageHistory'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  # ------------------------------------------------------------------ me
  /api/core/me:
    get:
      operationId: getMe
      tags: [Me]
      summary: The calling user, their memberships and per-tenant authorization summary
      description: 'Feeds the tenant switcher. No `X-Tenant-Id`. 404 when the token subject is not provisioned.'
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updateMe
      tags: [Me]
      summary: Update the caller's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMeRequest'}
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}

  # ------------------------------------------------------------------ tenant profile
  /api/core/tenant:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: getTenantProfile
      tags: [Tenant]
      summary: Get the academy profile
      description: 'Authz: any member.'
      responses:
        '200':
          description: Academy profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantProfile'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updateTenantProfile
      tags: [Tenant]
      summary: Update the academy profile
      description: 'Authz: ADMIN. Absent fields are left unchanged.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTenantProfileRequest'}
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantProfile'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/core/tenant/settings:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: getTenantSettings
      tags: [Tenant]
      summary: Get roster rules and defaults
      description: 'Authz: any member.'
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantSettings'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    put:
      operationId: replaceTenantSettings
      tags: [Tenant]
      summary: Replace roster rules and defaults
      description: |
        Changing `ageRule` or `maxPlayUpLevels` triggers a synchronous eligibility evaluation; resulting orphans are
        reported as eligibility cases. Authz: ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantSettings'}
      responses:
        '200':
          description: Stored settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantSettings'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/core/tenant/logo:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: getTenantLogo
      tags: [Tenant]
      summary: Download the academy logo
      description: 'Served with `ETag` and `Cache-Control`; send `If-None-Match` to get 304. Authz: any member.'
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Logo bytes.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            image/png:
              schema: {$ref: '#/components/schemas/LogoBinary'}
            image/jpeg:
              schema: {$ref: '#/components/schemas/LogoBinary'}
            image/webp:
              schema: {$ref: '#/components/schemas/LogoBinary'}
        '304':
          description: Logo unchanged (ETag matched).
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    put:
      operationId: putTenantLogo
      tags: [Tenant]
      summary: Upload or replace the academy logo
      description: |
        Raw image body, at most 512 KB (524 288 bytes). The `Content-Type` must be one of the listed image types; the
        server identifies the format from the magic bytes (PNG, JPEG or WebP — anything else, including SVG, is 415,
        ADR-0009) and stores/serves that detected type with `X-Content-Type-Options: nosniff`. Authz: ADMIN.
      requestBody:
        required: true
        content:
          image/png:
            schema: {$ref: '#/components/schemas/LogoBinary'}
          image/jpeg:
            schema: {$ref: '#/components/schemas/LogoBinary'}
          image/webp:
            schema: {$ref: '#/components/schemas/LogoBinary'}
      responses:
        '200':
          description: Stored logo metadata.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantLogo'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '413': {$ref: './common.yaml#/components/responses/PayloadTooLarge'}
        '415': {$ref: './common.yaml#/components/responses/UnsupportedMediaType'}
    delete:
      operationId: deleteTenantLogo
      tags: [Tenant]
      summary: Remove the academy logo
      description: 'Authz: ADMIN. 404 when no logo is stored.'
      responses:
        '204':
          description: Logo removed.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  # ------------------------------------------------------------------ members
  /api/core/members:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listMembers
      tags: [Members]
      summary: List members
      description: 'Authz: ADMIN.'
      parameters:
        - name: role
          in: query
          schema: {$ref: '#/components/schemas/TenantRole'}
        - name: active
          in: query
          schema: {type: boolean}
        - name: q
          in: query
          description: Case-insensitive match on name or e-mail.
          schema: {type: string, maxLength: 100}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of members.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: inviteMember
      tags: [Members]
      summary: Invite a member
      description: |
        Creates the person with the given roles and, when `email` is present, provisions a Keycloak user with a
        required-action e-mail. The PLAYER role requires `birthDate` and `gender` (422). Players created here are
        ACTIVE (admin path); coaches add players through `POST /api/core/players`. Authz: ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteMemberRequest'}
      responses:
        '201':
          description: Member created.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '502': {$ref: './common.yaml#/components/responses/UpstreamIdentityProvider'}
  /api/core/members/{personId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/PersonId'
    get:
      operationId: getMember
      tags: [Members]
      summary: Get a member
      description: 'Authz: ADMIN.'
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updateMember
      tags: [Members]
      summary: Update a member's personal data
      description: |
        Absent fields are left unchanged; `null` clears an optional field.
        Changing the `email` of a member with a login (`userId`) also moves the login (ADR-0023): the Keycloak
        username and e-mail become the new address (unverified) and a verification e-mail is sent to it (the
        account-setup e-mail while the invitation is PENDING). 409 `EMAIL_TAKEN` when another member of the tenant
        or another login uses the address; 409 `LOGIN_SHARED` when the login is also used by an active member of
        another academy (only the platform super admin may move it); 422 `LOGIN_REQUIRES_EMAIL` when the e-mail of a
        member with a login is cleared; 502 when Keycloak fails (nothing is changed). Authz: ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMemberRequest'}
      responses:
        '200':
          description: Updated member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '502': {$ref: './common.yaml#/components/responses/UpstreamIdentityProvider'}
  /api/core/members/{personId}/roles:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/PersonId'
    put:
      operationId: replaceMemberRoles
      tags: [Members]
      summary: Replace a member's role set
      description: |
        Roles are additive per person. Adding PLAYER requires birth date and gender (422); removing the last ADMIN of
        the tenant is rejected (409). Authz: ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceMemberRolesRequest'}
      responses:
        '200':
          description: Member with the new role set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/core/members/{personId}/deactivate:
    parameters:
