openapi: 3.0.3
info:
  title: Hoops Academy — athlete-service API
  version: 2.3.0
  description: |
    Training & attendance, athlete health & fitness.

    Authorization (docs/domain/authz-matrix.md): ADMIN and team staff (COACH / ASSISTANT_COACH) write training data,
    attendance, injuries, body measurements and test results; PARENT reads and may write injuries, body measurements,
    planned absences and plan completions for linked players; PLAYER reads own data and may write own planned absences
    and plan completions. Player names are not stored here: clients join ids with core-service rosters.

    Languages (2.2.0, decision 43): the texts of the global training-plan templates (plan name and description, item
    titles and descriptions) are returned in the language negotiated from `Accept-Language` (the first of `es`, `en`,
    `id` in the header's preference order; absent or unsupported = `en`). The service does not consult the person's
    stored locale (`common.yaml` Locale): the web client sends its UI language, which follows it, so the header wins.
    Tenant plans are not translated: their stored texts are returned whatever the header says, and a copy of a template
    keeps the texts it was copied with (in the copier's language).

    Session plans and exercise search (2.3.0, decisions 53 and 54, ADR-0041): a session references any plan the
    academy can read (one of its tenant plans or a global template) directly by id; no plan assignment is needed.
    `q` on `listTrainingPlans` also finds plans by the title of one of their items (in the negotiated language) and
    lists those items in `matchedItems`. Items of any readable plan are quick-added (copied) into a tenant plan
    (`copyItemsToPlan`) or into a session (`copyItemsToSession`): a session that has no plan of its own yet gets an
    ad-hoc plan (`sessionId` set, hidden from the plan lists) on the first quick-add; templates stay read-only.
servers:
  - url: /
    description: Gateway root (tenant API under /api/athlete, internal API under /internal).
security:
  - bearerAuth: []
tags:
  - name: TrainingSchedules
    description: Recurring weekly slots, materialised 8 weeks ahead into sessions.
  - name: TrainingSessions
  - name: Attendance
  - name: PlannedAbsences
  - name: TrainingPlans
    description: Plans and global templates (templates are copied on use).
  - name: PlanAssignments
  - name: PlanCompletions
  - name: Injuries
  - name: BodyMeasurements
  - name: PhysicalTests
    description: Test types, results (with expected norm band) and norms.
  - name: Internal

paths:
  # ------------------------------------------------------------------ schedules
  /api/athlete/training-schedules:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listTrainingSchedules
      tags: [TrainingSchedules]
      summary: List training schedules
      description: 'Authz: any member (PARENT/PLAYER: schedules of their teams).'
      parameters:
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - name: activeOn
          in: query
          description: Only schedules valid on this date.
          schema: {type: string, format: date}
      responses:
        '200':
          description: Schedules.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TrainingSchedule'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    post:
      operationId: createTrainingSchedule
      tags: [TrainingSchedules]
      summary: Create a recurring training slot
      description: 'Sessions are materialised 8 weeks ahead. Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainingScheduleInput'}
      responses:
        '201':
          description: Schedule created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSchedule'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/training-schedules/{scheduleId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: scheduleId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getTrainingSchedule
      tags: [TrainingSchedules]
      summary: Get a training schedule
      description: 'Authz: any member of the team''s audience.'
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSchedule'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateTrainingSchedule
      tags: [TrainingSchedules]
      summary: Update a training schedule
      description: 'Future PLANNED sessions without manual changes are re-materialised. Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTrainingScheduleRequest'}
      responses:
        '200':
          description: Updated schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSchedule'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteTrainingSchedule
      tags: [TrainingSchedules]
      summary: End a training schedule
      description: 'Removes future PLANNED sessions of the schedule; past sessions and attendance are kept. Authz: ADMIN; team staff.'
      responses:
        '204':
          description: Schedule ended.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  # ------------------------------------------------------------------ sessions
  /api/athlete/training-sessions:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listTrainingSessions
      tags: [TrainingSessions]
      summary: List training sessions by team and date range (calendar)
      description: 'Range is limited to 366 days (400). Authz: any member (PARENT/PLAYER: sessions of their teams).'
      parameters:
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - $ref: './common.yaml#/components/parameters/FromDate'
        - $ref: './common.yaml#/components/parameters/ToDate'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TrainingSessionStatus'}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of sessions ordered by start.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSessionPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    post:
      operationId: createTrainingSession
      tags: [TrainingSessions]
      summary: Create an ad-hoc training session
      description: 'Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTrainingSessionRequest'}
      responses:
        '201':
          description: Session created (PLANNED).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/training-sessions/{sessionId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getTrainingSession
      tags: [TrainingSessions]
      summary: Get a training session
      description: 'Authz: any member of the team''s audience.'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateTrainingSession
      tags: [TrainingSessions]
      summary: Update a session (time, place, plan, notes, mark DONE)
      description: 'CANCELLED sessions cannot be changed (409). Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTrainingSessionRequest'}
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/training-sessions/{sessionId}/cancel:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: cancelTrainingSession
      tags: [TrainingSessions]
      summary: Cancel a planned session
      description: 'Only PLANNED sessions can be cancelled (409). Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelTrainingSessionRequest'}
      responses:
        '200':
          description: Cancelled session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/training-sessions/{sessionId}/items:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: copyItemsToSession
      tags: [TrainingSessions]
      summary: Quick-add exercises of any readable plan or template to a session
      description: |
        Copies the given items (in the given order) to the end of the session's own plan and returns that plan.
        A session without a plan of its own (no plan, a template or a shared tenant plan) first gets an ad-hoc tenant
        plan (`sessionId` = this session) that starts with the items of its current plan, if any; the session then
        references it, so the template or shared plan is never changed (copy on write, ADR-0041). Template items are
        copied with their texts in the negotiated language. Unknown or foreign plans or items are 404; CANCELLED
        sessions cannot be changed (409). Authz: ADMIN; team staff.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopyPlanItemsRequest'}
      responses:
        '200':
          description: The session's own plan with the copied items at its end.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlan'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/training-sessions/{sessionId}/attendance:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionAttendance
      tags: [Attendance]
      summary: Attendance sheet of a session
      description: |
        One entry per player of the team's current roster, overlaid with planned absences (`expectedAbsent`). Entries
        without a recorded status have `status = null`. Authz: ADMIN; team staff; PARENT/PLAYER (linked / own entry).
      responses:
        '200':
          description: Attendance sheet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionAttendance'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    put:
      operationId: recordSessionAttendance
      tags: [Attendance]
      summary: Record attendance for a session (upsert per player)
      description: |
        Entries for players not listed are left unchanged. `minutesLate` is required for LATE and forbidden otherwise
        (422). Not allowed for CANCELLED sessions (409). Authz: ADMIN; team staff.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordAttendanceRequest'}
      responses:
        '200':
          description: Updated attendance sheet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionAttendance'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  # ------------------------------------------------------------------ planned absences
  /api/athlete/planned-absences:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listPlannedAbsences
      tags: [PlannedAbsences]
      summary: List planned absences overlapping a date range
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      parameters:
        - $ref: './common.yaml#/components/parameters/PlayerIdQuery'
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - $ref: './common.yaml#/components/parameters/FromDate'
        - $ref: './common.yaml#/components/parameters/ToDate'
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of planned absences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedAbsencePage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    post:
      operationId: createPlannedAbsence
      tags: [PlannedAbsences]
      summary: Announce a planned absence
      description: '`toDate` ≥ `fromDate` (422). Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlannedAbsenceInput'}
      responses:
        '201':
          description: Absence created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedAbsence'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/planned-absences/{absenceId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: absenceId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPlannedAbsence
      tags: [PlannedAbsences]
      summary: Get a planned absence
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      responses:
        '200':
          description: The absence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedAbsence'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updatePlannedAbsence
      tags: [PlannedAbsences]
      summary: Change a planned absence
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePlannedAbsenceRequest'}
      responses:
        '200':
          description: Updated absence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedAbsence'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deletePlannedAbsence
      tags: [PlannedAbsences]
      summary: Withdraw a planned absence
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      responses:
        '204':
          description: Absence removed.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  # ------------------------------------------------------------------ training plans
  /api/athlete/training-plans:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listTrainingPlans
      tags: [TrainingPlans]
      summary: List tenant plans, or global templates with `template=true`
      description: 'Ad-hoc session plans (`sessionId` set) are not listed. Authz: any member.'
      parameters:
        - name: template
          in: query
          description: true = global templates (read-only); false = the tenant's own plans.
          schema: {type: boolean, default: false}
        - name: q
          in: query
          description: |
            Case-insensitive part of the plan name or of the title of one of its items (a template's in the negotiated
            language). The items whose title matches are listed in `matchedItems` (2.3.0).
          schema: {type: string, maxLength: 100}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Page of plan summaries, ordered by (displayed) name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlanSummaryPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    post:
      operationId: createTrainingPlan
      tags: [TrainingPlans]
      summary: Create a tenant training plan
      description: 'Authz: ADMIN; COACH; ASSISTANT_COACH.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTrainingPlanRequest'}
      responses:
        '201':
          description: Plan created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlan'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/training-plans/{planId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/PlanId'
    get:
      operationId: getTrainingPlan
      tags: [TrainingPlans]
      summary: Get a plan or template with its items
      description: 'Authz: any member.'
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlan'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateTrainingPlan
      tags: [TrainingPlans]
      summary: Rename / describe a tenant plan
      description: 'Templates are read-only (403). Authz: ADMIN; COACH; ASSISTANT_COACH.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTrainingPlanRequest'}
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlan'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteTrainingPlan
      tags: [TrainingPlans]
      summary: Delete an unassigned tenant plan
      description: 'Plans with assignments cannot be deleted (409); templates are read-only (403). Authz: ADMIN; COACH; ASSISTANT_COACH.'
      responses:
        '204':
          description: Plan deleted.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
