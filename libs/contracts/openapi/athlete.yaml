openapi: 3.0.3
info:
  title: Hoops Academy — athlete-service API
  version: 1.0.0
  description: |
    Training & attendance, athlete health & fitness.

    Authorization (docs/domain/authz-matrix.md): ADMIN and team staff (COACH / ASSISTANT_COACH) write training data,
    attendance, injuries, body measurements and test results; PARENT reads and may write injuries, body measurements,
    planned absences and plan completions for linked players; PLAYER reads own data and may write own planned absences
    and plan completions. Player names are not stored here: clients join ids with core-service rosters.
servers:
  - url: /
    description: Gateway root (tenant API under /api/athlete, internal API under /internal).
security:
  - bearerAuth: []
tags:
  - name: TrainingSchedules
    description: Recurring weekly slots, materialised 8 weeks ahead into sessions.
  - name: TrainingSessions
  - name: Attendance
  - name: PlannedAbsences
  - name: TrainingPlans
    description: Plans and global templates (templates are copied on use).
  - name: PlanAssignments
  - name: PlanCompletions
  - name: Injuries
  - name: BodyMeasurements
  - name: PhysicalTests
    description: Test types, results (with expected norm band) and norms.
  - name: Internal

paths:
  # ------------------------------------------------------------------ schedules
  /api/athlete/training-schedules:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listTrainingSchedules
      tags: [TrainingSchedules]
      summary: List training schedules
      description: 'Authz: any member (PARENT/PLAYER: schedules of their teams).'
      parameters:
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - name: activeOn
          in: query
          description: Only schedules valid on this date.
          schema: {type: string, format: date}
      responses:
        '200':
          description: Schedules.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TrainingSchedule'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: createTrainingSchedule
      tags: [TrainingSchedules]
      summary: Create a recurring training slot
      description: 'Sessions are materialised 8 weeks ahead. Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainingScheduleInput'}
      responses:
        '201':
          description: Schedule created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSchedule'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/training-schedules/{scheduleId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: scheduleId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getTrainingSchedule
      tags: [TrainingSchedules]
      summary: Get a training schedule
      description: 'Authz: any member of the team''s audience.'
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSchedule'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updateTrainingSchedule
      tags: [TrainingSchedules]
      summary: Update a training schedule
      description: 'Future PLANNED sessions without manual changes are re-materialised. Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTrainingScheduleRequest'}
      responses:
        '200':
          description: Updated schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSchedule'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
    delete:
      operationId: deleteTrainingSchedule
      tags: [TrainingSchedules]
      summary: End a training schedule
      description: 'Removes future PLANNED sessions of the schedule; past sessions and attendance are kept. Authz: ADMIN; team staff.'
      responses:
        '204':
          description: Schedule ended.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  # ------------------------------------------------------------------ sessions
  /api/athlete/training-sessions:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listTrainingSessions
      tags: [TrainingSessions]
      summary: List training sessions by team and date range (calendar)
      description: 'Range is limited to 366 days (400). Authz: any member (PARENT/PLAYER: sessions of their teams).'
      parameters:
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - $ref: './common.yaml#/components/parameters/FromDate'
        - $ref: './common.yaml#/components/parameters/ToDate'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TrainingSessionStatus'}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of sessions ordered by start.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSessionPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: createTrainingSession
      tags: [TrainingSessions]
      summary: Create an ad-hoc training session
      description: 'Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTrainingSessionRequest'}
      responses:
        '201':
          description: Session created (PLANNED).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/training-sessions/{sessionId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getTrainingSession
      tags: [TrainingSessions]
      summary: Get a training session
      description: 'Authz: any member of the team''s audience.'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updateTrainingSession
      tags: [TrainingSessions]
      summary: Update a session (time, place, plan, notes, mark DONE)
      description: 'CANCELLED sessions cannot be changed (409). Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTrainingSessionRequest'}
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/training-sessions/{sessionId}/cancel:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: cancelTrainingSession
      tags: [TrainingSessions]
      summary: Cancel a planned session
      description: 'Only PLANNED sessions can be cancelled (409). Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelTrainingSessionRequest'}
      responses:
        '200':
          description: Cancelled session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingSession'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
  /api/athlete/training-sessions/{sessionId}/attendance:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionAttendance
      tags: [Attendance]
      summary: Attendance sheet of a session
      description: |
        One entry per player of the team's current roster, overlaid with planned absences (`expectedAbsent`). Entries
        without a recorded status have `status = null`. Authz: ADMIN; team staff; PARENT/PLAYER (linked / own entry).
      responses:
        '200':
          description: Attendance sheet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionAttendance'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    put:
      operationId: recordSessionAttendance
      tags: [Attendance]
      summary: Record attendance for a session (upsert per player)
      description: |
        Entries for players not listed are left unchanged. `minutesLate` is required for LATE and forbidden otherwise
        (422). Not allowed for CANCELLED sessions (409). Authz: ADMIN; team staff.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordAttendanceRequest'}
      responses:
        '200':
          description: Updated attendance sheet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionAttendance'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}

  # ------------------------------------------------------------------ planned absences
  /api/athlete/planned-absences:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listPlannedAbsences
      tags: [PlannedAbsences]
      summary: List planned absences overlapping a date range
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      parameters:
        - $ref: './common.yaml#/components/parameters/PlayerIdQuery'
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - $ref: './common.yaml#/components/parameters/FromDate'
        - $ref: './common.yaml#/components/parameters/ToDate'
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of planned absences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedAbsencePage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: createPlannedAbsence
      tags: [PlannedAbsences]
      summary: Announce a planned absence
      description: '`toDate` ≥ `fromDate` (422). Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlannedAbsenceInput'}
      responses:
        '201':
          description: Absence created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedAbsence'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/planned-absences/{absenceId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: absenceId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPlannedAbsence
      tags: [PlannedAbsences]
      summary: Get a planned absence
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      responses:
        '200':
          description: The absence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedAbsence'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updatePlannedAbsence
      tags: [PlannedAbsences]
      summary: Change a planned absence
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePlannedAbsenceRequest'}
      responses:
        '200':
          description: Updated absence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlannedAbsence'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
    delete:
      operationId: deletePlannedAbsence
      tags: [PlannedAbsences]
      summary: Withdraw a planned absence
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      responses:
        '204':
          description: Absence removed.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  # ------------------------------------------------------------------ training plans
  /api/athlete/training-plans:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listTrainingPlans
      tags: [TrainingPlans]
      summary: List tenant plans, or global templates with `template=true`
      description: 'Authz: any member.'
      parameters:
        - name: template
          in: query
          description: true = global templates (read-only); false = the tenant's own plans.
          schema: {type: boolean, default: false}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of plan summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlanSummaryPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: createTrainingPlan
      tags: [TrainingPlans]
      summary: Create a tenant training plan
      description: 'Authz: ADMIN; COACH; ASSISTANT_COACH.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTrainingPlanRequest'}
      responses:
        '201':
          description: Plan created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlan'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/training-plans/{planId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/PlanId'
    get:
      operationId: getTrainingPlan
      tags: [TrainingPlans]
      summary: Get a plan or template with its items
      description: 'Authz: any member.'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlan'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updateTrainingPlan
      tags: [TrainingPlans]
      summary: Rename / describe a tenant plan
      description: 'Templates are read-only (403). Authz: ADMIN; COACH; ASSISTANT_COACH.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTrainingPlanRequest'}
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlan'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
    delete:
      operationId: deleteTrainingPlan
      tags: [TrainingPlans]
      summary: Delete an unassigned tenant plan
      description: 'Plans with assignments cannot be deleted (409); templates are read-only (403). Authz: ADMIN; COACH; ASSISTANT_COACH.'
      responses:
        '204':
          description: Plan deleted.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
  /api/athlete/training-plans/{planId}:copy:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/PlanId'
    post:
      operationId: copyTrainingPlan
      tags: [TrainingPlans]
      summary: Copy a template (or tenant plan) into a new tenant plan (copy-on-use)
      description: 'Authz: ADMIN; COACH; ASSISTANT_COACH.'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopyTrainingPlanRequest'}
      responses:
        '201':
          description: The tenant-owned copy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingPlan'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
  /api/athlete/training-plans/{planId}/items:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/PlanId'
    post:
      operationId: addPlanItem
      tags: [TrainingPlans]
      summary: Append an item to a tenant plan
      description: 'Templates are read-only (403). Authz: ADMIN; COACH; ASSISTANT_COACH.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanItemInput'}
      responses:
        '201':
          description: Item created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanItem'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
    put:
      operationId: reorderPlanItems
      tags: [TrainingPlans]
      summary: Reorder the items of a tenant plan
      description: '`itemIds` must be a permutation of the plan''s items (422). Authz: ADMIN; COACH; ASSISTANT_COACH.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReorderPlanItemsRequest'}
      responses:
        '200':
          description: Items in their new order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanItem'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/training-plans/{planId}/items/{itemId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/PlanId'
      - name: itemId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updatePlanItem
      tags: [TrainingPlans]
      summary: Update a plan item
      description: 'Templates are read-only (403). Authz: ADMIN; COACH; ASSISTANT_COACH.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePlanItemRequest'}
      responses:
        '200':
          description: Updated item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanItem'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
    delete:
      operationId: deletePlanItem
      tags: [TrainingPlans]
      summary: Remove a plan item
      description: 'Templates are read-only (403). Authz: ADMIN; COACH; ASSISTANT_COACH.'
      responses:
        '204':
          description: Item removed.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  # ------------------------------------------------------------------ plan assignments & completions
  /api/athlete/plan-assignments:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listPlanAssignments
      tags: [PlanAssignments]
      summary: List plan assignments
      description: |
        With `playerId`, team assignments are fanned out to the player's current teams at read time.
        Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).
      parameters:
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - $ref: './common.yaml#/components/parameters/PlayerIdQuery'
        - name: dueFrom
          in: query
          schema: {type: string, format: date}
        - name: dueTo
          in: query
          schema: {type: string, format: date}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of assignments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanAssignmentPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: createPlanAssignment
      tags: [PlanAssignments]
      summary: Assign a tenant plan to a team or a player
      description: 'Exactly one of `teamId` / `playerId` (422). Templates must be copied first (422). Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePlanAssignmentRequest'}
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanAssignment'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/plan-assignments/{assignmentId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/AssignmentId'
    get:
      operationId: getPlanAssignment
      tags: [PlanAssignments]
      summary: Get a plan assignment
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      responses:
        '200':
          description: The assignment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanAssignment'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    delete:
      operationId: deletePlanAssignment
      tags: [PlanAssignments]
      summary: Withdraw a plan assignment
      description: 'Completions recorded for it are deleted with it. Authz: ADMIN; team staff.'
      responses:
        '204':
          description: Assignment removed.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
  /api/athlete/plan-assignments/{assignmentId}/completions/{playerId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/AssignmentId'
      - name: playerId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: recordPlanCompletion
      tags: [PlanCompletions]
      summary: Record (or change) a player's completion of an assignment
      description: 'The player must be a target of the assignment (422). Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordPlanCompletionRequest'}
      responses:
        '200':
          description: Stored completion.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanCompletion'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/plan-completions:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listPlanCompletions
      tags: [PlanCompletions]
      summary: List recorded plan completions
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      parameters:
        - name: assignmentId
          in: query
          schema: {type: string, format: uuid}
        - $ref: './common.yaml#/components/parameters/PlayerIdQuery'
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of completions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanCompletionPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  # ------------------------------------------------------------------ injuries
  /api/athlete/injuries:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listInjuries
      tags: [Injuries]
      summary: List injuries
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self, read).'
      parameters:
        - $ref: './common.yaml#/components/parameters/PlayerIdQuery'
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/InjuryStatus'}
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of injuries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InjuryPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    post:
      operationId: createInjury
      tags: [Injuries]
      summary: Report an injury
      description: '`expectedReturnOn` ≥ `occurredOn` (422). An OPEN injury shows the player as unavailable. Authz: ADMIN; team staff; PARENT (linked).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInjuryRequest'}
      responses:
        '201':
          description: Injury created (OPEN).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Injury'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
  /api/athlete/injuries/{injuryId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: injuryId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getInjury
      tags: [Injuries]
      summary: Get an injury
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      responses:
        '200':
          description: The injury.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Injury'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
    patch:
      operationId: updateInjury
      tags: [Injuries]
      summary: Update an injury (e.g. mark RECOVERED with `actualReturnOn`)
      description: 'RECOVERED requires `actualReturnOn` ≥ `occurredOn` (422). Authz: ADMIN; team staff; PARENT (linked).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateInjuryRequest'}
      responses:
        '200':
          description: Updated injury.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Injury'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
    delete:
      operationId: deleteInjury
      tags: [Injuries]
      summary: Delete an injury entered by mistake
      description: 'Authz: ADMIN; team staff.'
      responses:
        '204':
          description: Injury deleted.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

  # ------------------------------------------------------------------ body measurements
  /api/athlete/body-measurements:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listBodyMeasurements
      tags: [BodyMeasurements]
      summary: Height / weight history of a player (measuredOn ascending)
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      parameters:
        - name: playerId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - $ref: './common.yaml#/components/parameters/FromDate'
        - $ref: './common.yaml#/components/parameters/ToDate'
      responses:
        '200':
          description: Measurements.
          content:
            application/json:
              schema:
