        '204':
          description: Measurement deleted.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  # ------------------------------------------------------------------ physical tests
  /api/athlete/physical-test-types:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listPhysicalTestTypes
      tags: [PhysicalTests]
      summary: List test types (global and tenant-defined)
      description: 'Authz: any member.'
      responses:
        '200':
          description: Test types.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PhysicalTestType'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    post:
      operationId: createPhysicalTestType
      tags: [PhysicalTests]
      summary: Define a tenant-specific test type
      description: '`code` is unique across global and tenant types (409). Authz: ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhysicalTestTypeInput'}
      responses:
        '201':
          description: Test type created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestType'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/physical-test-types/{testTypeId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: testTypeId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPhysicalTestType
      tags: [PhysicalTests]
      summary: Get a test type
      description: 'Authz: any member.'
      responses:
        '200':
          description: The test type.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestType'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updatePhysicalTestType
      tags: [PhysicalTests]
      summary: Update a tenant-specific test type
      description: |
        Global types are read-only (403). A new `code` must not be used by another global or tenant type (409
        `TEST_TYPE_CODE_EXISTS`). Authz: ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePhysicalTestTypeRequest'}
      responses:
        '200':
          description: Updated test type.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestType'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deletePhysicalTestType
      tags: [PhysicalTests]
      summary: Delete a tenant-specific test type
      description: |
        Deletes the type together with the tenant's norms for it. A type that results reference cannot be deleted (409
        `TEST_TYPE_HAS_RESULTS`: delete or correct the results first, so no result is orphaned). Global types and other
        tenants' types are not found (404). Authz: ADMIN.
      responses:
        '204':
          description: Test type deleted.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/physical-test-results:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listPhysicalTestResults
      tags: [PhysicalTests]
      summary: List test results (each with its expected norm band)
      description: 'Authz: ADMIN; team staff; PARENT (linked, read); PLAYER (self, read).'
      parameters:
        - $ref: './common.yaml#/components/parameters/PlayerIdQuery'
        - $ref: './common.yaml#/components/parameters/TeamIdQuery'
        - name: testTypeId
          in: query
          schema: {type: string, format: uuid}
        - $ref: './common.yaml#/components/parameters/FromDate'
        - $ref: './common.yaml#/components/parameters/ToDate'
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
      responses:
        '200':
          description: Page of results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestResultPage'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    post:
      operationId: createPhysicalTestResult
      tags: [PhysicalTests]
      summary: Record a test result
      description: |
        The server computes the player's age at `measuredOn` (birth date and gender from core) and the expected band
        (tenant norm overrides global). Authz: ADMIN; team staff.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhysicalTestResultInput'}
      responses:
        '201':
          description: Result created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestResult'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/physical-test-results/{resultId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: resultId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPhysicalTestResult
      tags: [PhysicalTests]
      summary: Get a test result
      description: 'Authz: ADMIN; team staff; PARENT (linked); PLAYER (self).'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestResult'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updatePhysicalTestResult
      tags: [PhysicalTests]
      summary: Correct a test result (band is recomputed)
      description: 'Authz: ADMIN; team staff.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePhysicalTestResultRequest'}
      responses:
        '200':
          description: Updated result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestResult'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deletePhysicalTestResult
      tags: [PhysicalTests]
      summary: Delete a test result
      description: 'Authz: ADMIN; team staff.'
      responses:
        '204':
          description: Result deleted.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/physical-test-norms:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
    get:
      operationId: listPhysicalTestNorms
      tags: [PhysicalTests]
      summary: List norm bands
      description: |
        `scope=EFFECTIVE` (default) returns the norms in force for the tenant (tenant rows replace the global rows of the
        same test, gender and age range); `GLOBAL` / `TENANT` return one layer only. Authz: any member.
      parameters:
        - name: testTypeId
          in: query
          schema: {type: string, format: uuid}
        - name: gender
          in: query
          schema: {$ref: './common.yaml#/components/schemas/Gender'}
        - name: scope
          in: query
          schema:
            type: string
            enum: [EFFECTIVE, GLOBAL, TENANT]
            default: EFFECTIVE
      responses:
        '200':
          description: Norm bands.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PhysicalTestNorm'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    post:
      operationId: createPhysicalTestNorm
      tags: [PhysicalTests]
      summary: Add a tenant norm band (overrides global for that test, gender and age range)
      description: 'Overlapping tenant bands for the same (test, gender, age, band) are rejected (409). Authz: ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhysicalTestNormInput'}
      responses:
        '201':
          description: Norm created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestNorm'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
  /api/athlete/physical-test-norms/{normId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdHeader'
      - name: normId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: replacePhysicalTestNorm
      tags: [PhysicalTests]
      summary: Replace a tenant norm band
      description: 'Global norms are read-only (403). Authz: ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhysicalTestNormInput'}
      responses:
        '200':
          description: Updated norm.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhysicalTestNorm'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '409': {$ref: './common.yaml#/components/responses/Conflict'}
        '422': {$ref: './common.yaml#/components/responses/Unprocessable'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deletePhysicalTestNorm
      tags: [PhysicalTests]
      summary: Delete a tenant norm band (the global band applies again)
      description: 'Global norms are read-only (403). Authz: ADMIN.'
      responses:
        '204':
          description: Norm deleted.
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}
        '503': {$ref: './common.yaml#/components/responses/ServiceUnavailable'}

  # ------------------------------------------------------------------ internal
  /internal/usage/{tenantId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/TenantIdPath'
    get:
      operationId: getAthleteUsage
      tags: [Internal]
      summary: athlete-service usage counters of a tenant
      description: 'Authz: role `service`.'
      x-internal: true
      responses:
        '200':
          description: Usage counters.
          content:
            application/json:
              schema: {$ref: './common.yaml#/components/schemas/UsageReport'}
        '400': {$ref: './common.yaml#/components/responses/BadRequest'}
        '401': {$ref: './common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: './common.yaml#/components/responses/Forbidden'}
        '404': {$ref: './common.yaml#/components/responses/NotFound'}

components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Language of the template texts (RFC 9110 list, e.g. `id, en;q=0.8`). The first supported language (`es`, `en`,
        `id`) in preference order wins; absent, `*` or unsupported = `en`. Ignored for tenant plans.
      schema: {type: string, maxLength: 200}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanId:
      name: planId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: {type: string, format: uuid}

  schemas:
    # ---------------- enums & small types
    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    LocalTime:
      type: string
      description: Wall-clock time in the tenant's time zone, `HH:mm`.
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '18:30'
    TrainingSessionStatus:
      type: string
      enum: [PLANNED, DONE, CANCELLED]
    AttendanceStatus:
      type: string
      enum: [PRESENT, LATE, ABSENT, EXCUSED]
    CompletionStatus:
      type: string
      enum: [DONE, PARTIAL, NOT_DONE]
    InjurySeverity:
      type: string
      enum: [MINOR, MODERATE, SEVERE]
    InjuryStatus:
      type: string
      enum: [OPEN, RECOVERED]
    NormBand:
      type: string
      description: Expected performance band, worst to best.
      enum: [POOR, BELOW_AVERAGE, AVERAGE, ABOVE_AVERAGE, EXCELLENT]

    # ---------------- schedules & sessions
    TrainingScheduleInput:
      type: object
      required: [teamId, dayOfWeek, startTime, durationMinutes, validFrom]
      properties:
        teamId: {type: string, format: uuid}
        dayOfWeek: {$ref: '#/components/schemas/DayOfWeek'}
        startTime: {$ref: '#/components/schemas/LocalTime'}
        durationMinutes: {type: integer, format: int32, minimum: 15, maximum: 480}
        location: {type: string, maxLength: 200}
        validFrom: {type: string, format: date}
        validUntil:
          type: string
          format: date
          description: Inclusive; absent = open-ended.
    TrainingSchedule:
      type: object
      x-extends: [TrainingScheduleInput]
      required: [teamId, dayOfWeek, startTime, durationMinutes, validFrom, id]
      properties:
        teamId: {type: string, format: uuid}
        dayOfWeek: {$ref: '#/components/schemas/DayOfWeek'}
        startTime: {$ref: '#/components/schemas/LocalTime'}
        durationMinutes: {type: integer, format: int32, minimum: 15, maximum: 480}
        location: {type: string, maxLength: 200}
        validFrom: {type: string, format: date}
        validUntil:
          type: string
          format: date
          description: Inclusive; absent = open-ended.
        id: {type: string, format: uuid}
    UpdateTrainingScheduleRequest:
      type: object
      minProperties: 1
      properties:
        dayOfWeek: {$ref: '#/components/schemas/DayOfWeek'}
        startTime: {$ref: '#/components/schemas/LocalTime'}
        durationMinutes: {type: integer, format: int32, minimum: 15, maximum: 480}
        location: {type: string, maxLength: 200, nullable: true}
        validFrom: {type: string, format: date}
        validUntil: {type: string, format: date, nullable: true}
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [location, validUntil]
    TrainingSession:
      type: object
      required: [id, teamId, startsAt, durationMinutes, status]
      properties:
        id: {type: string, format: uuid}
        teamId: {type: string, format: uuid}
        scheduleId:
          type: string
          format: uuid
          nullable: true
          description: Null for ad-hoc sessions.
        startsAt: {type: string, format: date-time}
        durationMinutes: {type: integer, format: int32, minimum: 15, maximum: 480}
        location: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/TrainingSessionStatus'}
        planId: {type: string, format: uuid, nullable: true}
        notes: {type: string, nullable: true}
        cancelReason: {type: string, nullable: true}
    TrainingSessionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TrainingSession'}
        page: {$ref: './common.yaml#/components/schemas/PageMeta'}
    CreateTrainingSessionRequest:
      type: object
      required: [teamId, startsAt, durationMinutes]
      properties:
        teamId: {type: string, format: uuid}
        startsAt: {type: string, format: date-time}
        durationMinutes: {type: integer, format: int32, minimum: 15, maximum: 480}
        location: {type: string, maxLength: 200}
        planId:
          type: string
          format: uuid
          description: |
            Any plan the academy can read, referenced directly (no assignment needed, 2.3.0): one of its tenant plans
            (plans are not tied to a team, so a COACH may pick any of them) or a global template; another tenant's or
            an unknown plan is 404, the ad-hoc plan of another session 422 (`PLAN_OF_ANOTHER_SESSION`).
        notes: {type: string, maxLength: 2000}
    UpdateTrainingSessionRequest:
      type: object
      minProperties: 1
      properties:
        startsAt: {type: string, format: date-time}
        durationMinutes: {type: integer, format: int32, minimum: 15, maximum: 480}
        location: {type: string, maxLength: 200, nullable: true}
        planId:
          type: string
          format: uuid
          nullable: true
          description: |
            As in `CreateTrainingSessionRequest`. Moving the session off its ad-hoc plan (another plan, or `clear`)
            deletes that plan with its items (2.3.0).
        notes: {type: string, maxLength: 2000, nullable: true}
        status:
          type: string
          description: PLANNED ↔ DONE; use the cancel operation to cancel.
          enum: [PLANNED, DONE]
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [location, planId, notes]
    CancelTrainingSessionRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}

    # ---------------- attendance
    AttendanceEntry:
      type: object
      required: [playerId, expectedAbsent]
      properties:
        playerId: {type: string, format: uuid}
        status:
          allOf: [{$ref: '#/components/schemas/AttendanceStatus'}]
          nullable: true
          description: Null = not recorded yet.
        minutesLate: {type: integer, format: int32, minimum: 1, maximum: 480, nullable: true}
        note: {type: string, nullable: true}
        expectedAbsent:
          type: boolean
          description: A planned absence covers the session date.
        plannedAbsenceId: {type: string, format: uuid, nullable: true}
        unavailableInjuryId:
          type: string
          format: uuid
          nullable: true
          description: Set when the player has an OPEN injury.
        recordedBy:
          allOf: [{$ref: './common.yaml#/components/schemas/PersonRef'}]
          nullable: true
        recordedAt: {type: string, format: date-time, nullable: true}
    SessionAttendance:
      type: object
      required: [sessionId, entries]
      properties:
        sessionId: {type: string, format: uuid}
        entries:
          type: array
          items: {$ref: '#/components/schemas/AttendanceEntry'}
    AttendanceInput:
      type: object
      required: [playerId, status]
      properties:
        playerId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/AttendanceStatus'}
        minutesLate:
          type: integer
          format: int32
          minimum: 1
          maximum: 480
          description: Required iff status = LATE.
        note: {type: string, maxLength: 500}
    RecordAttendanceRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/AttendanceInput'}

    # ---------------- planned absences
    PlannedAbsenceInput:
      type: object
      required: [playerId, fromDate, toDate]
      properties:
        playerId: {type: string, format: uuid}
        fromDate: {type: string, format: date}
        toDate:
          type: string
          format: date
          description: Inclusive.
        reason: {type: string, maxLength: 500}
    PlannedAbsence:
      type: object
      x-extends: [PlannedAbsenceInput, AuditInfo]
      required: [playerId, fromDate, toDate, recordedBy, recordedAt, id]
      properties:
        playerId: {type: string, format: uuid}
        fromDate: {type: string, format: date}
        toDate:
          type: string
          format: date
          description: Inclusive.
        reason: {type: string, maxLength: 500}
        recordedBy: {$ref: './common.yaml#/components/schemas/PersonRef'}
        recordedAt: {type: string, format: date-time}
        id: {type: string, format: uuid}
    PlannedAbsencePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlannedAbsence'}
        page: {$ref: './common.yaml#/components/schemas/PageMeta'}
    UpdatePlannedAbsenceRequest:
      type: object
      minProperties: 1
      properties:
        fromDate: {type: string, format: date}
        toDate: {type: string, format: date}
        reason: {type: string, maxLength: 500, nullable: true}
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [reason]

    # ---------------- plans
    PlanItemInput:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000}
        durationMinutes: {type: integer, format: int32, minimum: 1, maximum: 480}
        sets: {type: integer, format: int32, minimum: 1, maximum: 100}
        repetitions: {type: integer, format: int32, minimum: 1, maximum: 1000}
        videoUrl: {type: string, format: uri, maxLength: 2000}
    PlanItem:
      type: object
      description: The `title` and `description` of a template's item follow the plan's language rule (`TrainingPlan.name`).
      x-extends: [PlanItemInput]
      required: [title, id, position]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000}
        durationMinutes: {type: integer, format: int32, minimum: 1, maximum: 480}
        sets: {type: integer, format: int32, minimum: 1, maximum: 100}
        repetitions: {type: integer, format: int32, minimum: 1, maximum: 1000}
        videoUrl: {type: string, format: uri, maxLength: 2000}
        id: {type: string, format: uuid}
        position:
          type: integer
          format: int32
          minimum: 0
          description: 0-based order within the plan.
    UpdatePlanItemRequest:
      type: object
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000, nullable: true}
        durationMinutes: {type: integer, format: int32, minimum: 1, maximum: 480, nullable: true}
        sets: {type: integer, format: int32, minimum: 1, maximum: 100, nullable: true}
        repetitions: {type: integer, format: int32, minimum: 1, maximum: 1000, nullable: true}
        videoUrl: {type: string, format: uri, maxLength: 2000, nullable: true}
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [description, durationMinutes, sets, repetitions, videoUrl]
    ReorderPlanItemsRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
    TrainingPlanSummary:
      type: object
      x-extends: [TrainingPlanFields]
      required: [id, name, template, itemCount, totalDurationMinutes]
      properties:
        id: {type: string, format: uuid}
        name:
          type: string
          description: Templates in the negotiated language (`Accept-Language`, fallback `en`); tenant plans as stored.
        nameKey:
          type: string
          nullable: true
          description: Stable key of a global template's texts (e.g. `form-shooting`), the same in every language; null for tenant plans (copies included).
        description:
          type: string
          nullable: true
          description: Same language rule as `name`.
        template:
          type: boolean
          description: Global, read-only template (copy before use).
        sourceTemplateId:
          type: string
          format: uuid
          nullable: true
          description: Template (or plan) this plan was copied from.
        itemCount: {type: integer, format: int32, minimum: 0}
        totalDurationMinutes: {type: integer, format: int32, minimum: 0}
        archived:
          type: boolean
          description: Archived plans are hidden from lists and cannot be assigned (see `archiveTrainingPlan`).
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on the ad-hoc plan of a session (created by `copyItemsToSession`, 2.3.0): the plan belongs to that
            session, is not listed and cannot be assigned or attached to another session.
        matchedItems:
          type: array
          description: |
            Only in a search (`q`): the plan's items whose title contains `q` (a template's in the negotiated
            language), in plan order; absent when only the name matched (2.3.0).
          items: {$ref: '#/components/schemas/PlanItemMatch'}
    TrainingPlan:
      type: object
      x-extends: [TrainingPlanFields]
      required: [id, name, template, itemCount, totalDurationMinutes, items]
      properties:
        id: {type: string, format: uuid}
        name:
          type: string
          description: Templates in the negotiated language (`Accept-Language`, fallback `en`); tenant plans as stored.
        nameKey:
          type: string
          nullable: true
          description: Stable key of a global template's texts (e.g. `form-shooting`), the same in every language; null for tenant plans (copies included).
        description:
          type: string
          nullable: true
          description: Same language rule as `name`.
        template:
          type: boolean
          description: Global, read-only template (copy before use).
        sourceTemplateId:
          type: string
          format: uuid
          nullable: true
          description: Template (or plan) this plan was copied from.
        itemCount: {type: integer, format: int32, minimum: 0}
        totalDurationMinutes: {type: integer, format: int32, minimum: 0}
        archived:
          type: boolean
          description: Archived plans are hidden from lists and cannot be assigned (see `archiveTrainingPlan`).
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on the ad-hoc plan of a session (created by `copyItemsToSession`, 2.3.0): the plan belongs to that
            session, is not listed and cannot be assigned or attached to another session.
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanItem'}
    PlanItemMatch:
      type: object
      description: An item found by the plan search, enough to show "found in <plan>" and to quick-add it.
      required: [id, planId, title]
      properties:
        id: {type: string, format: uuid}
        planId: {type: string, format: uuid}
        title:
          type: string
          description: In the negotiated language for a template's item; as stored otherwise.
    TrainingPlanSummaryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TrainingPlanSummary'}
        page: {$ref: './common.yaml#/components/schemas/PageMeta'}
    CreateTrainingPlanRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000}
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PlanItemInput'}
    UpdateTrainingPlanRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 4000, nullable: true}
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [description]
    CopyTrainingPlanRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Defaults to the source plan's name.
    PlanItemRef:
      type: object
      required: [planId, itemId]
      properties:
        planId:
          type: string
          format: uuid
          description: Any plan the academy can read (a tenant plan or a global template).
        itemId: {type: string, format: uuid}
    CopyPlanItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Items to copy, in this order; the same item may be given twice (two copies).
          items: {$ref: '#/components/schemas/PlanItemRef'}

    # ---------------- assignments & completions
    CreatePlanAssignmentRequest:
      type: object
      description: Exactly one of `teamId` / `playerId`.
      required: [planId, dueOn]
      properties:
        planId: {type: string, format: uuid}
        teamId: {type: string, format: uuid}
        playerId: {type: string, format: uuid}
        dueOn: {type: string, format: date}
        notes: {type: string, maxLength: 2000}
    PlanAssignment:
      type: object
      x-extends: [AuditInfo]
      required: [recordedBy, recordedAt, id, plan, dueOn]
      properties:
        recordedBy: {$ref: './common.yaml#/components/schemas/PersonRef'}
        recordedAt: {type: string, format: date-time}
        id: {type: string, format: uuid}
        plan: {$ref: '#/components/schemas/TrainingPlanSummary'}
        teamId: {type: string, format: uuid, nullable: true}
        playerId: {type: string, format: uuid, nullable: true}
        dueOn: {type: string, format: date}
        notes: {type: string, nullable: true}
    PlanAssignmentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanAssignment'}
        page: {$ref: './common.yaml#/components/schemas/PageMeta'}
    RecordPlanCompletionRequest:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/CompletionStatus'}
        comment: {type: string, maxLength: 1000}
    PlanCompletion:
      type: object
      x-extends: [AuditInfo]
      required: [recordedBy, recordedAt, id, assignmentId, playerId, status]
      properties:
        recordedBy: {$ref: './common.yaml#/components/schemas/PersonRef'}
        recordedAt: {type: string, format: date-time}
        id: {type: string, format: uuid}
        assignmentId: {type: string, format: uuid}
        playerId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/CompletionStatus'}
        comment: {type: string, nullable: true}
    PlanCompletionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanCompletion'}
        page: {$ref: './common.yaml#/components/schemas/PageMeta'}

    # ---------------- injuries
    CreateInjuryRequest:
      type: object
      required: [playerId, occurredOn, bodyPart, severity]
      properties:
        playerId: {type: string, format: uuid}
        occurredOn: {type: string, format: date}
        bodyPart: {type: string, minLength: 1, maxLength: 80, example: left ankle}
        severity: {$ref: '#/components/schemas/InjurySeverity'}
        description: {type: string, maxLength: 2000}
        expectedReturnOn:
          type: string
          format: date
          description: Must be ≥ occurredOn.
    Injury:
      type: object
      x-extends: [AuditInfo]
      required: [recordedBy, recordedAt, id, playerId, occurredOn, bodyPart, severity, status]
      properties:
        recordedBy: {$ref: './common.yaml#/components/schemas/PersonRef'}
        recordedAt: {type: string, format: date-time}
        id: {type: string, format: uuid}
        playerId: {type: string, format: uuid}
        occurredOn: {type: string, format: date}
        bodyPart: {type: string}
        severity: {$ref: '#/components/schemas/InjurySeverity'}
        description: {type: string, nullable: true}
        expectedReturnOn: {type: string, format: date, nullable: true}
        actualReturnOn: {type: string, format: date, nullable: true}
        status: {$ref: '#/components/schemas/InjuryStatus'}
    InjuryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Injury'}
        page: {$ref: './common.yaml#/components/schemas/PageMeta'}
    UpdateInjuryRequest:
      type: object
      minProperties: 1
      properties:
        occurredOn: {type: string, format: date}
        bodyPart: {type: string, minLength: 1, maxLength: 80}
        severity: {$ref: '#/components/schemas/InjurySeverity'}
        description: {type: string, maxLength: 2000, nullable: true}
        expectedReturnOn: {type: string, format: date, nullable: true}
        actualReturnOn: {type: string, format: date, nullable: true}
        status: {$ref: '#/components/schemas/InjuryStatus'}
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [description, expectedReturnOn, actualReturnOn]

    # ---------------- body measurements
    BodyMeasurementInput:
      type: object
      description: At least one of `heightCm` / `weightKg`.
      required: [playerId, measuredOn]
      properties:
        playerId: {type: string, format: uuid}
        measuredOn: {type: string, format: date}
        heightCm: {type: number, format: double, minimum: 50, maximum: 250}
        weightKg: {type: number, format: double, minimum: 10, maximum: 250}
    BodyMeasurement:
      type: object
      x-extends: [AuditInfo]
      required: [recordedBy, recordedAt, id, playerId, measuredOn]
      properties:
        recordedBy: {$ref: './common.yaml#/components/schemas/PersonRef'}
        recordedAt: {type: string, format: date-time}
        id: {type: string, format: uuid}
        playerId: {type: string, format: uuid}
        measuredOn: {type: string, format: date}
        heightCm: {type: number, format: double, nullable: true}
        weightKg: {type: number, format: double, nullable: true}
    UpdateBodyMeasurementRequest:
      type: object
      minProperties: 1
      properties:
        measuredOn: {type: string, format: date}
        heightCm: {type: number, format: double, minimum: 50, maximum: 250, nullable: true}
        weightKg: {type: number, format: double, minimum: 10, maximum: 250, nullable: true}
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [heightCm, weightKg]

    # ---------------- physical tests
    PhysicalTestTypeInput:
      type: object
      required: [code, name, unit, higherIsBetter]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{2,32}$'
          example: SPRINT_20M
        name: {type: string, minLength: 1, maxLength: 120}
        unit:
          type: string
          minLength: 1
          maxLength: 16
          example: s
        higherIsBetter: {type: boolean}
        description: {type: string, maxLength: 2000}
    PhysicalTestType:
      type: object
      x-extends: [PhysicalTestTypeInput]
      required: [code, name, unit, higherIsBetter, id, global]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{2,32}$'
          example: SPRINT_20M
        name: {type: string, minLength: 1, maxLength: 120}
        unit:
          type: string
          minLength: 1
          maxLength: 16
          example: s
        higherIsBetter: {type: boolean}
        description: {type: string, maxLength: 2000}
        id: {type: string, format: uuid}
        global:
          type: boolean
          description: Platform-provided (read-only) type.
    UpdatePhysicalTestTypeRequest:
      type: object
      minProperties: 1
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{2,32}$'
          example: SPRINT_20M
          description: Unique across global and tenant types (409); results show the new code.
        name: {type: string, minLength: 1, maxLength: 120}
        unit: {type: string, minLength: 1, maxLength: 16}
        higherIsBetter: {type: boolean}
        description: {type: string, maxLength: 2000, nullable: true}
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [description]
    PhysicalTestResultInput:
      type: object
      required: [playerId, testTypeId, measuredOn, value]
      properties:
        playerId: {type: string, format: uuid}
        testTypeId: {type: string, format: uuid}
        measuredOn: {type: string, format: date}
        value:
          type: number
          format: double
          description: In the test type's unit.
        notes: {type: string, maxLength: 1000}
    PhysicalTestResult:
      type: object
      x-extends: [AuditInfo]
      required: [recordedBy, recordedAt, id, playerId, testTypeId, testCode, unit, measuredOn, value, ageAtMeasurement, bandStatus, referencePending]
      properties:
        recordedBy: {$ref: './common.yaml#/components/schemas/PersonRef'}
        recordedAt: {type: string, format: date-time}
        id: {type: string, format: uuid}
        playerId: {type: string, format: uuid}
        testTypeId: {type: string, format: uuid}
        testCode: {type: string}
        unit: {type: string}
        measuredOn: {type: string, format: date}
        value: {type: number, format: double}
        ageAtMeasurement:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Actual age (years) on measuredOn; null when core has no birth date for the player.
        bandStatus: {$ref: '#/components/schemas/BandStatus'}
        expectedBand:
          allOf: [{$ref: '#/components/schemas/NormBand'}]
          nullable: true
          description: Band for (gender, age at measurement, value); null when no norm covers the result.
        normId:
          type: string
          format: uuid
          nullable: true
          description: Norm row that produced `expectedBand`.
        referencePending:
          type: boolean
          description: The applied norm has no cited source yet ("reference pending" in the UI).
        notes: {type: string, nullable: true}
    BandStatus:
      type: string
      description: |
        How `expectedBand` was resolved: MATCHED — a norm covers (gender, age, value); NO_NORM — no effective norm
        covers it (`expectedBand` null); MISSING_PLAYER_DATA — core has no birth date or gender for the player
        (`expectedBand` null, `ageAtMeasurement` null when the birth date is missing).
      enum: [MATCHED, NO_NORM, MISSING_PLAYER_DATA]
    PlayerAvailability:
      type: object
      required: [playerId, available, injuries]
      properties:
        playerId: {type: string, format: uuid}
        available: {type: boolean}
        expectedReturnOn:
          type: string
          format: date
          nullable: true
          description: Latest expected return of the blocking injuries; absent/null when available or unknown.
        injuries:
          type: array
          description: Ids of the injuries that block availability.
          items: {type: string, format: uuid}
    PlanProgress:
      type: object
      required: [assignmentId, total, notRecorded, counts, players]
      properties:
        assignmentId: {type: string, format: uuid}
        total:
          type: integer
          format: int32
          minimum: 0
          description: Targeted players visible to the caller.
        notRecorded: {type: integer, format: int32, minimum: 0}
        counts:
          type: object
          required: [DONE, PARTIAL, NOT_DONE]
          properties:
            DONE: {type: integer, format: int32, minimum: 0}
            PARTIAL: {type: integer, format: int32, minimum: 0}
            NOT_DONE: {type: integer, format: int32, minimum: 0}
        players:
          type: array
          items: {$ref: '#/components/schemas/PlayerProgress'}
    PlayerProgress:
      type: object
      required: [playerId]
      properties:
        playerId: {type: string, format: uuid}
        status:
          allOf: [{$ref: '#/components/schemas/CompletionStatus'}]
          nullable: true
          description: Null when nothing was recorded for the player yet.
        completionId: {type: string, format: uuid, nullable: true}
    PhysicalTestResultPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PhysicalTestResult'}
        page: {$ref: './common.yaml#/components/schemas/PageMeta'}
    UpdatePhysicalTestResultRequest:
      type: object
      minProperties: 1
      properties:
        measuredOn: {type: string, format: date}
        value: {type: number, format: double}
        notes: {type: string, maxLength: 1000, nullable: true}
        clear:
          type: array
          uniqueItems: true
          description: Properties to set to null (ADR-0032). An absent or null property stays unchanged; a property named here must not also be given a value (400).
          items:
            type: string
            enum: [notes]
    PhysicalTestNormInput:
      type: object
      description: Value range [minValue, maxValue) for a band; a missing bound is open.
      required: [testTypeId, gender, minAge, maxAge, band]
      properties:
        testTypeId: {type: string, format: uuid}
        gender: {$ref: './common.yaml#/components/schemas/Gender'}
        minAge: {type: integer, format: int32, minimum: 3, maximum: 99}
        maxAge:
          type: integer
          format: int32
          minimum: 3
          maximum: 99
          description: Inclusive.
        band: {$ref: '#/components/schemas/NormBand'}
        minValue: {type: number, format: double, nullable: true}
        maxValue: {type: number, format: double, nullable: true}
        source:
          type: string
          maxLength: 500
          nullable: true
          description: Citation of the reference the values come from.
    PhysicalTestNorm:
      type: object
      x-extends: [PhysicalTestNormInput]
      required: [testTypeId, gender, minAge, maxAge, band, id, global, referencePending]
      properties:
        testTypeId: {type: string, format: uuid}
        gender: {$ref: './common.yaml#/components/schemas/Gender'}
        minAge: {type: integer, format: int32, minimum: 3, maximum: 99}
        maxAge:
          type: integer
          format: int32
          minimum: 3
          maximum: 99
          description: Inclusive.
        band: {$ref: '#/components/schemas/NormBand'}
        minValue: {type: number, format: double, nullable: true}
        maxValue: {type: number, format: double, nullable: true}
        source:
          type: string
          maxLength: 500
          nullable: true
          description: Citation of the reference the values come from.
        id: {type: string, format: uuid}
        global:
          type: boolean
          description: Platform-provided norm (tenant rows override it).
        referencePending:
          type: boolean
          description: No source cited.
  # Field groups that several schemas repeat (x-extends) instead of composing them with allOf, which
  # swagger-request-validator cannot check strictly. Not wire types: no client code is generated for them.
  x-mixins:
    TrainingPlanFields:
      type: object
      required: [id, name, template, itemCount, totalDurationMinutes]
      properties:
        id: {type: string, format: uuid}
        name:
          type: string
          description: Templates in the negotiated language (`Accept-Language`, fallback `en`); tenant plans as stored.
        nameKey:
          type: string
          nullable: true
          description: Stable key of a global template's texts (e.g. `form-shooting`), the same in every language; null for tenant plans (copies included).
        description:
          type: string
          nullable: true
          description: Same language rule as `name`.
        template:
          type: boolean
          description: Global, read-only template (copy before use).
        sourceTemplateId:
          type: string
          format: uuid
          nullable: true
          description: Template (or plan) this plan was copied from.
        itemCount: {type: integer, format: int32, minimum: 0}
        totalDurationMinutes: {type: integer, format: int32, minimum: 0}
        archived:
          type: boolean
          description: Archived plans are hidden from lists and cannot be assigned (see `archiveTrainingPlan`).
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on the ad-hoc plan of a session (created by `copyItemsToSession`, 2.3.0): the plan belongs to that
            session, is not listed and cannot be assigned or attached to another session.
    AuditInfo:
      type: object
      required: [recordedBy, recordedAt]
      properties:
        recordedBy: {$ref: './common.yaml#/components/schemas/PersonRef'}
        recordedAt: {type: string, format: date-time}
