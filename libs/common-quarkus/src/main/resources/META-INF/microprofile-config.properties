# Defaults contributed by common-quarkus to every service (ordinal 100: a service's application.properties wins).

# Request header carrying the tenant for /api/** (read by TenantHeaderFilter).
hoops.tenancy.header=X-Tenant-Id

# Hibernate discriminator multitenancy; entities mark their column with @org.hibernate.annotations.TenantId.
quarkus.hibernate-orm.multitenant=DISCRIMINATOR

# Quarkus passes the tenant id to Hibernate as a String while tenant_id columns are uuid: let the server infer
# the type of string parameters instead of forcing varchar (ADR-0011).
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# /api paths that carry no X-Tenant-Id (exact paths, comma separated): core's /api/core/me lists the caller's tenants.
hoops.tenancy.exempt-paths=/api/core/me

# core-service /internal client shared by game and athlete (com.hoopsacademy.common.client.CoreInternalClient).
hoops.core.url=http://localhost:8081
quarkus.rest-client.core.url=${hoops.core.url}
quarkus.rest-client.core.connect-timeout=2000
quarkus.rest-client.core.read-timeout=2000
hoops.core.cache-ttl=30S

# ---- HTTP hardening (defense in depth; nginx / ingress add the browser-facing headers too) -------------------
# Body limit: larger declared bodies get a 413 Problem from RequestBodyLimit (core's logo has its own 512 KB rule).
quarkus.http.limits.max-body-size=2M
# Security headers on every response except the management paths under /q/ (dev UI, health, metrics).
quarkus.http.filter.security.matches=^/(?!q/).*
quarkus.http.filter.security.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.security.header."X-Frame-Options"=DENY
quarkus.http.filter.security.header."Referrer-Policy"=no-referrer
quarkus.http.filter.security.header."Content-Security-Policy"=default-src 'none'; frame-ancestors 'none'
quarkus.http.filter.security.header."Cross-Origin-Resource-Policy"=same-origin
# CORS allow-list (comma separated). Same-origin through nginx/ingress needs none; the Flutter dev server does.
# Override per environment with HOOPS_CORS_ORIGINS (e.g. https://academy.example). Never "*", no credentials.
hoops.cors.origins=http://localhost:5173
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${hoops.cors.origins}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=authorization,content-type,x-tenant-id,if-none-match,if-match,accept,accept-language
quarkus.http.cors.exposed-headers=ETag,Location
quarkus.http.cors.access-control-max-age=PT1H
quarkus.http.cors.access-control-allow-credentials=false
# No request/access logging by default (would log paths with ids for every call); enable per environment.
quarkus.http.access-log.enabled=false

# ---- observability (ADR-0017) ----------------------------------------------------------------------------------
# OpenTelemetry: SDK off unless an environment turns it on (QUARKUS_OTEL_SDK_DISABLED=false +
# QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT); traceId/spanId then appear in the MDC, Problem.traceId and JSON logs.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
# JSON console logs only in prod (containers); dev and test keep the readable format. MDC (tenantId, traceId) is
# included by the JSON formatter; the plain format shows it too.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{3.}] (%t) tenant=%X{tenantId} trace=%X{traceId} %s%e%n
# Security events (ADR-0043): category hoops.security, one WARN record per authentication/authorization failure.
# Quarkus OIDC's own "Token verification has failed" WARN quotes the refused token (header and claims, CWE-532); the
# invalid_token event replaces it with the reason (expired, audience, signature, ...), so that logger is muted below ERROR.
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR
# Prometheus on /q/metrics (not routed by nginx or the ingress; scraped in-cluster).
quarkus.micrometer.export.prometheus.path=/q/metrics

# A JWT without `sub` is rejected (401) instead of being identified by preferred_username (CallerSubject).
# The test profile sets it to false (below): @TestSecurity alone yields a JWT without claims.
hoops.security.require-sub=true

# ---- events (WP66, ADR-0036) -------------------------------------------------------------------------------------
# Quarkus Dev Services for Kafka in tests and dev mode (core has quarkus-kafka-client, game and athlete
# quarkus-messaging-kafka).
# Quarkus 3.40's default provider is upstream-kafka-native (apache/kafka-native), its default Redpanda image v24.1.2:
# both differ from the broker of compose and the chart. The image needs the provider: with the default provider the
# Redpanda image's entrypoint rejects the Kafka container's start command ("rpk: unknown shorthand flag: 'c'").
# Keep the tag equal to infra/compose/compose.yaml and events.redpanda.image (deploy/helm/tests/run.sh checks all three).
quarkus.kafka.devservices.provider=redpanda
quarkus.kafka.devservices.image-name=docker.io/redpandadata/redpanda:v26.2.7
# Dev Services create the topics like compose does (one partition each; infra/compose/redpanda-topics.sh); the names are
# common.replica.RosterTopic's (LibraryDefaultsContract checks every service sees all seven).
quarkus.kafka.devservices.topic-partitions."core.person"=1
quarkus.kafka.devservices.topic-partitions."core.player"=1
quarkus.kafka.devservices.topic-partitions."core.team"=1
quarkus.kafka.devservices.topic-partitions."core.team-player"=1
quarkus.kafka.devservices.topic-partitions."core.team-staff"=1
quarkus.kafka.devservices.topic-partitions."core.guardian-link"=1
quarkus.kafka.devservices.topic-partitions."core.tenant"=1
# Broker of core's producer and of game's and athlete's consumer: compose (host mode) by default, the chart sets the
# in-cluster address and SASL/SCRAM (ADR-0036 section 8). Dev mode and tests need bootstrap.servers unset (Dev Services,
# RosterBrokerResource). kafka.sasl.jaas.config names each service's user, so it stays in the service's file.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl.mechanism=SCRAM-SHA-256

# ---- shared by core, game and athlete (WP137, ADR-0069; a service's application.properties may still override) ------
# One PostgreSQL datasource each; the schemas exist before Flyway runs (infra/db/init), Hibernate never touches them.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.create-schemas=false
quarkus.hibernate-orm.schema-management.strategy=none
# The realm as the service reaches it, for token validation and the client-credentials tokens (ADR-0071): one variable,
# OIDC_AUTH_SERVER_URL, in every service and deployment. The default is compose's Keycloak (`just up`), so quarkus:dev
# needs none; the chart sets the in-cluster http://keycloak:8080/auth/realms/academy.
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8080/auth/realms/academy}
quarkus.oidc-client.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8080/auth/realms/academy}
# Keycloak realm roles from realm_access/roles (only super_admin is one; tenant roles live in core, ADR-0005). Service
# tokens are fetched on the first call, not at start, so a service starts while Keycloak is still coming up.
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc-client.early-tokens-acquisition=false
# OpenTelemetry (WP86, ADR-0046), build-time keys: the log handler is compiled in (it exports only when the SDK is on,
# QUARKUS_OTEL_SDK_DISABLED=false from the chart) and root spans are sampled at quarkus.otel.traces.sampler.arg (runtime,
# default 1.0; the chart sets global.observability.tracesSampleRatio), children follow their parent.
quarkus.otel.logs.enabled=true
quarkus.otel.traces.sampler=parentbased_traceidratio

# ---- test profile of every service --------------------------------------------------------------------------------
# Authentication is simulated (@TenantUser, @TestSecurity, WireMock as token endpoint); a test profile with real tokens
# (RealBearerTokensProfile) turns OIDC back on. @TestSecurity alone yields a JWT without claims, hence require-sub.
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc-client.discovery-enabled=false
%test.quarkus.oidc-client.credentials.secret=test-only-secret
%test.hoops.security.require-sub=false
# Coverage of classes loaded by Quarkus goes into the same file as the plain JaCoCo agent (quarkus-jacoco).
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
