# Defaults contributed by common-quarkus to every service (ordinal 100: a service's application.properties wins).

# Request header carrying the tenant for /api/** (read by TenantHeaderFilter).
hoops.tenancy.header=X-Tenant-Id

# Hibernate discriminator multitenancy; entities mark their column with @org.hibernate.annotations.TenantId.
quarkus.hibernate-orm.multitenant=DISCRIMINATOR

# Quarkus passes the tenant id to Hibernate as a String while tenant_id columns are uuid: let the server infer
# the type of string parameters instead of forcing varchar (ADR-0011).
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# /api paths that carry no X-Tenant-Id (exact paths, comma separated): core's /api/core/me lists the caller's tenants.
hoops.tenancy.exempt-paths=/api/core/me

# core-service /internal client shared by game and athlete (com.hoopsacademy.common.client.CoreInternalClient).
hoops.core.url=http://localhost:8081
quarkus.rest-client.core.url=${hoops.core.url}
quarkus.rest-client.core.connect-timeout=2000
quarkus.rest-client.core.read-timeout=2000
hoops.core.cache-ttl=30S

# ---- HTTP hardening (defense in depth; nginx / ingress add the browser-facing headers too) -------------------
# Body limit: larger declared bodies get a 413 Problem from RequestBodyLimit (core's logo has its own 512 KB rule).
quarkus.http.limits.max-body-size=2M
# Security headers on every response except the management paths under /q/ (dev UI, health, metrics).
quarkus.http.filter.security.matches=^/(?!q/).*
quarkus.http.filter.security.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.security.header."X-Frame-Options"=DENY
quarkus.http.filter.security.header."Referrer-Policy"=no-referrer
quarkus.http.filter.security.header."Content-Security-Policy"=default-src 'none'; frame-ancestors 'none'
quarkus.http.filter.security.header."Cross-Origin-Resource-Policy"=same-origin
# CORS allow-list (comma separated). Same-origin through nginx/ingress needs none; the Flutter dev server does.
# Override per environment with HOOPS_CORS_ORIGINS (e.g. https://academy.example). Never "*", no credentials.
hoops.cors.origins=http://localhost:5173
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${hoops.cors.origins}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=authorization,content-type,x-tenant-id,if-none-match,if-match,accept,accept-language
quarkus.http.cors.exposed-headers=ETag,Location
quarkus.http.cors.access-control-max-age=PT1H
quarkus.http.cors.access-control-allow-credentials=false
# No request/access logging by default (would log paths with ids for every call); enable per environment.
quarkus.http.access-log.enabled=false

# ---- observability (ADR-0017) ----------------------------------------------------------------------------------
# OpenTelemetry: SDK off unless an environment turns it on (QUARKUS_OTEL_SDK_DISABLED=false +
# QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT); traceId/spanId then appear in the MDC, Problem.traceId and JSON logs.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
# JSON console logs only in prod (containers); dev and test keep the readable format. MDC (tenantId, traceId) is
# included by the JSON formatter; the plain format shows it too.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{3.}] (%t) tenant=%X{tenantId} trace=%X{traceId} %s%e%n
# Prometheus on /q/metrics (not routed by nginx or the ingress; scraped in-cluster).
quarkus.micrometer.export.prometheus.path=/q/metrics

# A JWT without `sub` is rejected (401) instead of being identified by preferred_username (CallerSubject).
# Test profiles set this to false: @TestSecurity alone yields a JWT without claims.
hoops.security.require-sub=true

# ---- events (WP66, ADR-0036) -------------------------------------------------------------------------------------
# Quarkus Dev Services for Kafka in tests and dev mode (services with quarkus-messaging-kafka: core since WP67; game and
# athlete get "Unrecognized configuration key" warnings for these two keys until WP68/WP69 add the extension).
# Quarkus 3.40's default provider is upstream-kafka-native (apache/kafka-native), its default Redpanda image v24.1.2:
# both differ from the broker of compose and the chart. The image needs the provider: with the default provider the
# Redpanda image's entrypoint rejects the Kafka container's start command ("rpk: unknown shorthand flag: 'c'").
# Keep the tag equal to infra/compose/compose.yaml and events.redpanda.image (deploy/helm/tests/run.sh checks all three).
quarkus.kafka.devservices.provider=redpanda
quarkus.kafka.devservices.image-name=docker.io/redpandadata/redpanda:v26.2.6
