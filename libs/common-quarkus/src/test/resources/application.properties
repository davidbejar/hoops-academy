# ---- common-quarkus own test application (NOT shipped in the test-jar) ----
# Database: provided by PostgresRlsResource (app role for the datasource, migrator role for Flyway).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.flyway.schemas=core
quarkus.flyway.create-schemas=false
quarkus.hibernate-orm.schema-management.strategy=none

# Authentication is simulated with @TestSecurity / @TenantUser; no Keycloak needed.
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false
quarkus.oidc-client.auth-server-url=http://localhost:1/realms/test
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=/protocol/openid-connect/token
quarkus.oidc-client.client-id=common-quarkus-test
quarkus.oidc-client.credentials.secret=test-only-secret
quarkus.oidc-client.early-tokens-acquisition=false

# Coverage of classes loaded by Quarkus goes into the same file as the plain JaCoCo agent.
quarkus.jacoco.data-file=target/jacoco.exec
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.report=false

# /api paths without X-Tenant-Id (core's /api/core/me is the library default; the probe mimics it).
hoops.tenancy.exempt-paths=/api/core/me,/api/probe/me,/api/probe/me/subject

# Small request-body limit so RequestBodyLimitTest can exceed it cheaply (services use 2M).
quarkus.http.limits.max-body-size=64K

# @TestSecurity without @OidcSecurity yields a claim-less JWT; MissingSubjectTest turns the check back on.
hoops.security.require-sub=false
