# Accepted ZAP API-scan alerts of game-service (scripts/zap-api-scan.sh game, ADR-0045). The scan itself runs every API
# rule (no rule is switched off here); scripts/zap-gate.py reads this file afterwards and fails on a High/Medium
# alert that no IGNORE line accepts. Format: <rule id> TAB IGNORE TAB (<name>) TAB [tags] justification, tags
# [alert=<exact name>] [url=<path prefix>] [expires=YYYY-MM-DD]. Every line needs a justification; give findings
# that wait for a fix an expiry.
40018	IGNORE	(SQL Injection)	[alert=SQL Injection][url=/api/game/matches/matchId/events:batch][expires=2027-05-06] False positive (WP83): the boolean-based differential is nginx rate limiting, not SQL. events:batch is limited to 120 req/min, burst 60 (infra/compose/nginx.conf, the Gateway in the chart): during the scan 426 of its 791 requests got the HTML 429 page and the others the 400 Problem, so the "true" and "false" payloads answered differently. Replayed by hand, the three payloads (deviceId, id, period) give identical 400 Problems; the ingest is JSON-Schema validated and every value is a bound JDBC parameter (SpotBugs, CodeQL and Semgrep agree). Scoped to that path only.
