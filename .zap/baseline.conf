# OWASP ZAP baseline rules for the compose stack (CI job zap-baseline, ADR/WP17).
# Format: <rule id> TAB <IGNORE|WARN|FAIL> TAB (<name>) [TAB justification]. Generated with `zap-baseline.py -g`.
# Gate: scripts/zap-gate.py fails the job on every High/Medium alert whose rule is not IGNORE here, independent of
# WARN/FAIL (ZAP runs with -I). An IGNORE line MUST carry a justification; review them every release.
