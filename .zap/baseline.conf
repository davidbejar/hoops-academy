10055	IGNORE	(CSP)	[alert=CSP: style-src unsafe-inline] Accepted (Medium): style-src 'unsafe-inline' is required by the Flutter web engine, which injects <style> elements at runtime; scripts stay hash/self-only. Re-check when Flutter supports style nonces/hashes.
10055	IGNORE	(CSP)	[alert=CSP: Failure to Define Directive with No Fallback][url=/auth/realms/] Accepted (Medium): Keycloak's realm default CSP (`frame-src 'self'; frame-ancestors 'self'; object-src 'none'`) on its own login/account pages has no default-src; Keycloak-rendered pages, not ours. Hardening via realm browserSecurityHeaders is a follow-up (docs/wp/FOLLOW-UPS.md).
10055	IGNORE	(CSP)	[alert=CSP: Wildcard Directive][url=/auth/realms/] Accepted (Medium): same Keycloak default CSP (missing script-src/style-src/img-src... directives are reported as wildcards). Keycloak pages only.
10055	IGNORE	(CSP)	[alert=CSP: script-src unsafe-inline][url=/auth/realms/] Accepted (Medium): same Keycloak default CSP (no script-src -> inline allowed); Keycloak's login theme needs its inline scripts. Keycloak pages only.
10202	IGNORE	(Absence of Anti-CSRF Tokens)	[url=/auth/realms/] Accepted (Medium/Low): the flagged forms are Keycloak's own (device verification, logout confirmation) and are protected by Keycloak's session-bound codes/tab ids; the SPA itself uses bearer tokens and has no cookie-authenticated forms.
10020	IGNORE	(Anti-clickjacking Header)	[url=/auth/realms/academy/protocol/openid-connect/login-status-iframe.html] Accepted (Medium): the OIDC session-status iframe must be framed by the SPA (same origin through nginx); Keycloak omits frame-ancestors there by design and validates the embedding origin itself. Every other page sends frame-ancestors/X-Frame-Options.
