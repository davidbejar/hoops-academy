# Accepted ZAP API-scan alerts of finance-service (scripts/zap-api-scan.sh finance, ADR-0045). The scan itself runs every API
# rule (no rule is switched off here); scripts/zap-gate.py reads this file afterwards and fails on a High/Medium
# alert that no IGNORE line accepts. Format: <rule id> TAB IGNORE TAB (<name>) TAB [tags] justification, tags
# [alert=<exact name>] [url=<path prefix>] [expires=YYYY-MM-DD]. Every line needs a justification; give findings
# that wait for a fix an expiry.
40018	IGNORE	(SQL Injection)	[alert=SQL Injection][url=/api/finance/dues:export][expires=2027-05-16] False positive expected (WP123, not yet seen in a scan): the export paths are rate limited at the compose nginx (ADR-0048, 10/min + 2/s per IP, the same zone as core's exports), so during the scan most requests get the 429 page and the others the 404 Problem of a non-member (the scan's super admin is in no academy), the differential ZAP read as SQL injection on core's rate-limited POST (run 43740521836, .zap/api-core.conf). finance-service binds every parameter (constant SQL, pgx; CodeQL and Semgrep gates) and answers a non-member before any query. Scoped to this path (literal colon and %3A form); drop it if the first CI scans never raise it.
