name: codeql

# SAST with CodeQL (WP83, ADR-0045): Java, query suite security-extended, built from source (main code only: tests
# are neither compiled nor analysed). The SARIF goes to code scanning. Gate: a High or Critical result
# (security-severity >= 7.0) not accepted in .github/codeql/accepted.json fails the job (scripts/sarif-gate.py); an
# acceptance has a reason and an expiry. How to triage: docs/security/sast-dast.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly: new queries in the bundle find old code
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Build (main code only, traced by CodeQL)
        run: ./mvnw -B -ntp -Dmaven.test.skip=true -Djacoco.skip=true -Dspotbugs.skip=true compile
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin
          output: codeql-out
      - name: Gate (High/Critical not accepted in .github/codeql/accepted.json)
        run: python3 -I scripts/sarif-gate.py --fail-on high --baseline .github/codeql/accepted.json codeql-out/*.sarif | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: codeql-out/
