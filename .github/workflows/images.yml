name: images

# Builds the container images (deploy/containers) and scans them with Trivy. Images are pushed only from `main` and only
# when the repository variable IMAGE_REGISTRY is set (recommended: ghcr.io/<owner>/<repo>, repo-scoped names). Login uses
# the secrets REGISTRY_USERNAME + REGISTRY_PASSWORD when BOTH exist (any registry); with neither, the job's own
# GITHUB_TOKEN pushes to ghcr.io under this repository's owner (the push jobs request `packages: write`). A single
# secret set is a configuration error and fails the step.
# SBOMs (WP85, ADR-0043): every image gets CycloneDX SBOMs, validated with cyclonedx-cli, kept as the workflow
# artifact `sbom-<image>` (90 days) and, when pushed, attached to the pushed image as OCI referrers (ORAS,
# artifact type application/vnd.cyclonedx+json): services `<svc>-maven.cdx.json` (runtime dependencies,
# cyclonedx-maven-plugin in the image's Maven stage) and `<svc>-image.cdx.json` (Trivy: OS packages and jars of the
# image); web `web-image.cdx.json` (Trivy). Same commands locally: scripts/sbom.sh.
on:
  push:
    branches: [main]
    paths: ['services/**', 'libs/**', 'apps/web/**', 'deploy/containers/**', 'infra/db/**', 'pom.xml', 'scripts/sbom.sh', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [core-service, game-service, athlete-service]
        include:
          - {service: core-service, port: 8081}
          - {service: game-service, port: 8082}
          - {service: athlete-service, port: 8083}
    env:
      IMAGE: localhost/hoops/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (multi-stage, Maven inside the container)
        run: |
          podman build -f deploy/containers/service.Containerfile \
            --ignorefile deploy/containers/service.containerignore \
            --build-arg SERVICE=${{ matrix.service }} --build-arg SERVICE_PORT=${{ matrix.port }} \
            --build-arg SOURCE_URL=https://github.com/${{ github.repository }} -t "$IMAGE" .
      - name: Runs as non-root, starts the JVM without a shell
        # distroless (ADR-0054) has no `id` and no shell: read the configured user, then run the image's own java
        run: |
          user=$(podman image inspect --format '{{.Config.User}}' "$IMAGE")
          case "${user%%:*}" in ''|0|root) echo "::error::image user is '$user'"; exit 1 ;; esac
          podman run --rm --read-only --entrypoint /usr/bin/java "$IMAGE" -version
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          podman save -o image.tar "$IMAGE"
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.76.1 image --input /w/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - name: SBOM (CycloneDX of the Maven build and of the image, validated)
        run: |
          # the Maven stage is cached from the build step: this only copies out its target/bom.json
          scripts/sbom.sh maven ${{ matrix.service }} sbom
          scripts/sbom.sh generate ${{ matrix.service }} "$IMAGE" sbom
      - name: Keep the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Push
        if: ${{ github.ref == 'refs/heads/main' && vars.IMAGE_REGISTRY != '' }}
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.service }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          set -euo pipefail
          registry=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]'); registry="${registry%/}"
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then user="$REGISTRY_USERNAME"; pass="$REGISTRY_PASSWORD"
          elif [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then user="${{ github.actor }}"; pass="$GITHUB_TOKEN"
          else echo "::error::set both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither (GITHUB_TOKEN -> ghcr.io)"; exit 1; fi
          echo "$pass" | podman login -u "$user" --password-stdin "${registry%%/*}"
          podman tag "$IMAGE" "$registry/$NAME:${{ github.sha }}"
          podman push --digestfile digest.txt "$registry/$NAME:${{ github.sha }}"
          # the SBOMs as OCI referrers of the pushed digest (ghcr.io: ORAS falls back to the referrers tag schema)
          scripts/sbom.sh attach "$registry/$NAME@$(cat digest.txt)" sbom "$REGISTRY_AUTH_FILE"

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: localhost/hoops/web:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: {channel: stable, cache: true}
      - name: flutter build web
        working-directory: apps/web
        run: flutter pub get && flutter build web --release --pwa-strategy=offline-first
      - name: Build image (host-built bundle)
        run: |
          podman build -f deploy/containers/web.Containerfile --ignorefile deploy/containers/web.containerignore \
            --build-arg WEB_SOURCE=host --build-arg SOURCE_URL=https://github.com/${{ github.repository }} -t "$IMAGE" .
      - name: Runs as non-root
        run: test "$(podman run --rm --entrypoint id "$IMAGE" -u)" != 0
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          podman save -o image.tar "$IMAGE"
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.76.1 image --input /w/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - name: SBOM (CycloneDX of the image, validated)
        run: scripts/sbom.sh generate web "$IMAGE" sbom
      - name: Keep the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Push
        if: ${{ github.ref == 'refs/heads/main' && vars.IMAGE_REGISTRY != '' }}
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: web
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          set -euo pipefail
          registry=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]'); registry="${registry%/}"
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then user="$REGISTRY_USERNAME"; pass="$REGISTRY_PASSWORD"
          elif [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then user="${{ github.actor }}"; pass="$GITHUB_TOKEN"
          else echo "::error::set both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither (GITHUB_TOKEN -> ghcr.io)"; exit 1; fi
          echo "$pass" | podman login -u "$user" --password-stdin "${registry%%/*}"
          podman tag "$IMAGE" "$registry/$NAME:${{ github.sha }}"
          podman push --digestfile digest.txt "$registry/$NAME:${{ github.sha }}"
          # the SBOMs as OCI referrers of the pushed digest (ghcr.io: ORAS falls back to the referrers tag schema)
          scripts/sbom.sh attach "$registry/$NAME@$(cat digest.txt)" sbom "$REGISTRY_AUTH_FILE"

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install kubeconform + gitleaks
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Chart tests (lint, snapshots, kubeconform, policy asserts, gitleaks)
        run: deploy/helm/tests/run.sh

  # pdf-service (Rust, ADR-0052): context services/pdf-service, distroless cc base, cargo-auditable binary, so Trivy's
  # scan and SBOM list the crates (rustbinary) besides the Debian packages. One SBOM: `pdf-service-image.cdx.json`.
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: localhost/hoops/pdf-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (multi-stage, cargo inside the container)
        run: |
          podman build -f deploy/containers/pdf.Containerfile \
            --build-arg SOURCE_URL=https://github.com/${{ github.repository }} -t "$IMAGE" services/pdf-service
      - name: Runs as non-root on a read-only root file system
        # distroless: no shell and no `id`; read the configured user, then start the service read-only and ask its health
        run: |
          user=$(podman image inspect --format '{{.Config.User}}' "$IMAGE")
          case "${user%%:*}" in ''|0|root) echo "::error::image user is '$user'"; exit 1 ;; esac
          podman run -d --name pdf --read-only --cap-drop=ALL -p 127.0.0.1:8084:8084 "$IMAGE"
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8084/q/health/ready && break; sleep 1; done
          curl -fs http://127.0.0.1:8084/q/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8084/internal/pdf/team-roster)" = 401
          podman rm -f pdf
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          podman save -o image.tar "$IMAGE"
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.76.1 image --input /w/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - name: SBOM (CycloneDX of the image, crates included, validated)
        run: scripts/sbom.sh generate pdf-service "$IMAGE" sbom
      - name: Keep the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-pdf-service
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Push
        if: ${{ github.ref == 'refs/heads/main' && vars.IMAGE_REGISTRY != '' }}
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: pdf-service
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          set -euo pipefail
          registry=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]'); registry="${registry%/}"
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then user="$REGISTRY_USERNAME"; pass="$REGISTRY_PASSWORD"
          elif [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then user="${{ github.actor }}"; pass="$GITHUB_TOKEN"
          else echo "::error::set both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither (GITHUB_TOKEN -> ghcr.io)"; exit 1; fi
          echo "$pass" | podman login -u "$user" --password-stdin "${registry%%/*}"
          podman tag "$IMAGE" "$registry/$NAME:${{ github.sha }}"
          podman push --digestfile digest.txt "$registry/$NAME:${{ github.sha }}"
          scripts/sbom.sh attach "$registry/$NAME@$(cat digest.txt)" sbom "$REGISTRY_AUTH_FILE"

  # finance-service (Go, ADR-0055): context services/finance-service, distroless static base, a static binary whose
  # module list Trivy reads. The start check needs a database: a throwaway Postgres with infra/db/init, then the image
  # read-only, migrating as finance_migrator and serving as finance_app, without the broker (consumer off).
  finance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: localhost/hoops/finance-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (multi-stage, go inside the container)
        run: |
          podman build -f deploy/containers/finance.Containerfile \
            --build-arg SOURCE_URL=https://github.com/${{ github.repository }} -t "$IMAGE" services/finance-service
      - name: Runs as non-root on a read-only root file system against a real database
        run: |
          set -euo pipefail
          user=$(podman image inspect --format '{{.Config.User}}' "$IMAGE")
          case "${user%%:*}" in ''|0|root) echo "::error::image user is '$user'"; exit 1 ;; esac
          pw() { head -c 18 /dev/urandom | base64 | tr -dc 'A-Za-z0-9'; }
          app=$(pw); migrator=$(pw)
          args=(); for v in CORE_MIGRATOR CORE_APP CORE_PLATFORM GAME_MIGRATOR GAME_APP ATHLETE_MIGRATOR ATHLETE_APP; do
            args+=(-e "${v}_PASSWORD=$(pw)"); done
          podman network create finance-check
          podman run -d --name db --network finance-check -e POSTGRES_PASSWORD="$(pw)" -e POSTGRES_DB=hoops "${args[@]}" \
            -e FINANCE_APP_PASSWORD="$app" -e FINANCE_MIGRATOR_PASSWORD="$migrator" \
            -v "$PWD/infra/db/init:/docker-entrypoint-initdb.d:ro,Z" docker.io/library/postgres:17
          for _ in $(seq 1 60); do podman exec db pg_isready -U postgres -d hoops >/dev/null 2>&1 && break; sleep 1; done
          sleep 3
          podman run -d --name finance --network finance-check --read-only --cap-drop=ALL -p 127.0.0.1:8085:8085 \
            -e FINANCE_DB_URL=postgres://db:5432/hoops -e FINANCE_APP_PASSWORD="$app" \
            -e FINANCE_MIGRATOR_PASSWORD="$migrator" -e FINANCE_ROSTER_CONSUMER_ENABLED=false "$IMAGE"
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8085/q/health/ready && break; sleep 1; done
          curl -fs http://127.0.0.1:8085/q/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/api/finance/settings)" = 401
          podman rm -f finance db
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          podman save -o image.tar "$IMAGE"
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.76.1 image --input /w/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - name: SBOM (CycloneDX of the image, Go modules included, validated)
        run: scripts/sbom.sh generate finance-service "$IMAGE" sbom
      - name: Keep the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-finance-service
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Push
        if: ${{ github.ref == 'refs/heads/main' && vars.IMAGE_REGISTRY != '' }}
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: finance-service
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          set -euo pipefail
          registry=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]'); registry="${registry%/}"
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then user="$REGISTRY_USERNAME"; pass="$REGISTRY_PASSWORD"
          elif [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then user="${{ github.actor }}"; pass="$GITHUB_TOKEN"
          else echo "::error::set both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither (GITHUB_TOKEN -> ghcr.io)"; exit 1; fi
          echo "$pass" | podman login -u "$user" --password-stdin "${registry%%/*}"
          podman tag "$IMAGE" "$registry/$NAME:${{ github.sha }}"
          podman push --digestfile digest.txt "$registry/$NAME:${{ github.sha }}"
          scripts/sbom.sh attach "$registry/$NAME@$(cat digest.txt)" sbom "$REGISTRY_AUTH_FILE"
