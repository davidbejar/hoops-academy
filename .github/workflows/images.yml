name: images

# Builds the container images (deploy/containers) and scans them with Trivy. Images are pushed only from `main` and only
# when the repository variable IMAGE_REGISTRY is set (recommended: ghcr.io/<owner>/<repo>, repo-scoped names). Login uses
# the secrets REGISTRY_USERNAME + REGISTRY_PASSWORD when BOTH exist (any registry); with neither, the job's own
# GITHUB_TOKEN pushes to ghcr.io under this repository's owner (the push jobs request `packages: write`). A single
# secret set is a configuration error and fails the step.
on:
  push:
    branches: [main]
    paths: ['services/**', 'libs/**', 'apps/web/**', 'deploy/containers/**', 'pom.xml', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [core-service, game-service, athlete-service]
        include:
          - {service: core-service, port: 8081}
          - {service: game-service, port: 8082}
          - {service: athlete-service, port: 8083}
    env:
      IMAGE: localhost/hoops/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (multi-stage, Maven inside the container)
        run: |
          podman build -f deploy/containers/service.Containerfile \
            --ignorefile deploy/containers/service.containerignore \
            --build-arg SERVICE=${{ matrix.service }} --build-arg SERVICE_PORT=${{ matrix.port }} \
            --build-arg SOURCE_URL=https://github.com/${{ github.repository }} -t "$IMAGE" .
      - name: Runs as non-root
        run: test "$(podman run --rm --entrypoint id "$IMAGE" -u)" != 0
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          podman save -o image.tar "$IMAGE"
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.76.1 image --input /w/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - name: Push
        if: ${{ github.ref == 'refs/heads/main' && vars.IMAGE_REGISTRY != '' }}
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          registry=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]'); registry="${registry%/}"
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then user="$REGISTRY_USERNAME"; pass="$REGISTRY_PASSWORD"
          elif [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then user="${{ github.actor }}"; pass="$GITHUB_TOKEN"
          else echo "::error::set both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither (GITHUB_TOKEN -> ghcr.io)"; exit 1; fi
          echo "$pass" | podman login -u "$user" --password-stdin "${registry%%/*}"
          podman tag "$IMAGE" "$registry/$NAME:${{ github.sha }}"
          podman push "$registry/$NAME:${{ github.sha }}"

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: localhost/hoops/web:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: {channel: stable, cache: true}
      - name: flutter build web
        working-directory: apps/web
        run: flutter pub get && flutter build web --release --pwa-strategy=offline-first
      - name: Build image (host-built bundle)
        run: |
          podman build -f deploy/containers/web.Containerfile --ignorefile deploy/containers/web.containerignore \
            --build-arg WEB_SOURCE=host --build-arg SOURCE_URL=https://github.com/${{ github.repository }} -t "$IMAGE" .
      - name: Runs as non-root
        run: test "$(podman run --rm --entrypoint id "$IMAGE" -u)" != 0
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          podman save -o image.tar "$IMAGE"
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.76.1 image --input /w/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - name: Push
        if: ${{ github.ref == 'refs/heads/main' && vars.IMAGE_REGISTRY != '' }}
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: web
        run: |
          set -euo pipefail
          registry=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]'); registry="${registry%/}"
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then user="$REGISTRY_USERNAME"; pass="$REGISTRY_PASSWORD"
          elif [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then user="${{ github.actor }}"; pass="$GITHUB_TOKEN"
          else echo "::error::set both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither (GITHUB_TOKEN -> ghcr.io)"; exit 1; fi
          echo "$pass" | podman login -u "$user" --password-stdin "${registry%%/*}"
          podman tag "$IMAGE" "$registry/$NAME:${{ github.sha }}"
          podman push "$registry/$NAME:${{ github.sha }}"

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install kubeconform + gitleaks
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Chart tests (lint, snapshots, kubeconform, policy asserts, gitleaks)
        run: deploy/helm/tests/run.sh
