name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    # Testcontainers works with the runner's Docker; locally we use Podman (see scripts/env.sh).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify
        run: ./mvnw -B -ntp verify

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/web
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
        working-directory: apps/web
      - run: flutter analyze
        working-directory: apps/web
      - run: flutter test
        working-directory: apps/web
        env:
          # goldens are recorded on macOS; Linux renders the test font/shapes a few % differently (test/flutter_test_config.dart)
          GOLDEN_DIFF_TOLERANCE: "0.06"

  # Browser-level smoke in headless Chrome for Testing (WP55, decision 37): the mock-mode journey through
  # `flutter drive` (login -> academy -> live match -> event -> sync -> training -> platform console). Chrome and the
  # matching chromedriver are pinned; bump both together. The login round trip against the real stack is in e2e.yml.
  web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - id: chrome
        uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
        with:
          chrome-version: 157.0.8103.38
          install-chromedriver: true
      # chromedriver finds the runner's own Chrome (/opt/google/chrome, another major) before the action's, so remove
      # it and make `google-chrome` a wrapper around the pinned build with the flags a headless runner needs.
      - name: Make the pinned Chrome the only google-chrome
        run: |
          sudo rm -rf /opt/google/chrome /usr/bin/google-chrome   # the latter is a symlink into the former
          printf '#!/bin/sh\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "${{ steps.chrome.outputs.chrome-path }}" | sudo tee /usr/bin/google-chrome >/dev/null
          sudo chmod +x /usr/bin/google-chrome
          google-chrome --version
      - run: flutter pub get
        working-directory: apps/web
      - name: Web smoke (mock mode, headless)
        working-directory: apps/web
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          "$CHROME_EXECUTABLE" --version
          "$CHROMEDRIVER" --version
          start=$(date +%s)
          tool/web_smoke.sh
          echo "web smoke took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

  helm-chart-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install kubeconform + gitleaks
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      # chart-file drift (realm JSON / init SQL copies), lint, snapshots, kubeconform, policy asserts, gitleaks
      - run: deploy/helm/tests/run.sh
      - name: helm package (no symlinks in the charts)
        run: helm package deploy/helm/hoops -d "$RUNNER_TEMP"

  # OWASP dependency-check: fails on any unsuppressed CVSS >= 7 (failBuildOnCVSS in the root pom; suppressions only
  # with justification + expiry in .dependency-check-suppressions.xml). NVD API key: repository secret NVD_API_KEY
  # (without it the first NVD download takes hours and is throttled).
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The NVD mirror (~400k records, hours to fetch from scratch) is cached across runs. restore/save are split so the
      # data is saved only when the scan succeeded, so a failed or cancelled run cannot poison the cache (WP64).
      - name: Restore NVD data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      - name: dependency-check (aggregate)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # the security-scan profile binds dependency-check:aggregate to verify (whole reactor, one report)
        run: |
          ./mvnw -B -ntp -Psecurity-scan verify -DskipTests -Djacoco.skip=true \
            -DnvdApiKey="$NVD_API_KEY" -DossindexAnalyzerEnabled=false -Dformats=HTML,JSON
      - name: Save NVD data
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*

  # Repository scan: vulnerable lockfile/pom dependencies, IaC misconfigurations (Helm, Containerfiles, compose,
  # workflows) and committed secrets. Fails on HIGH/CRITICAL (fixable vulnerabilities only).
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Trivy resolves the Maven dependency tree from the local repository; without it it fetches every POM from Maven
      # Central, which rate-limits the runner (429). Populate ~/.m2 first and mount it read-only into the scanner.
      - name: Populate the Maven cache
        run: ./mvnw -B -ntp -q -DskipTests -Djacoco.skip=true package
      - name: trivy fs
        run: |
          docker run --rm -v "$PWD:/src" -v "$HOME/.m2:/root/.m2:ro" -w /src aquasec/trivy:0.76.1 fs \
            --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            --skip-dirs apps/web/build --skip-dirs '**/target' --skip-dirs apps/web/.dart_tool \
            --ignorefile .trivyignore.yaml .

  # OWASP ZAP baseline (passive) against the compose stack: nginx + Keycloak + core-service. Fails on any
  # High/Medium alert not accepted (IGNORE + justification) in .zap/baseline.conf (scripts/zap-gate.py).
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Placeholder .env (CI only; values are the documented change-me placeholders)
        run: cp .env.example .env
      - name: Start Postgres, Keycloak, MailHog, nginx
        run: docker compose --env-file .env -f infra/compose/compose.yaml up -d --wait
      - name: Build and start core-service on the host (nginx reaches it via host.containers.internal)
        run: |
          ./mvnw -B -ntp -pl services/core-service -am package -DskipTests -Djacoco.skip=true
          set -a; . ./.env; set +a
          nohup java -jar services/core-service/target/quarkus-app/quarkus-run.jar > core.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:8081/q/health/ready && break; sleep 2; done
          curl -fs http://localhost:8080/healthz
      - name: ZAP baseline
        run: |
          mkdir -p zap && cp .zap/baseline.conf zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080/ -c baseline.conf -J zap.json -r zap.html -I
      - name: Gate (High/Medium not accepted in .zap/baseline.conf)
        run: python3 scripts/zap-gate.py zap/zap.json .zap/baseline.conf
      - name: Upload report + logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline
          path: |
            zap/zap.html
            zap/zap.json
            core.log
