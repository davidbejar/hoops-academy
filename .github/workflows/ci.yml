name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the superseded run. A run on main, a schedule or a dispatch is never cancelled
# (its group is the run itself, so it cannot even replace a queued one).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    # Testcontainers works with the runner's Docker; locally we use Podman (see scripts/env.sh).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - name: Build and verify
        run: ./mvnw -B -ntp verify

  # pdf-service (Rust, ADR-0052): the gates of `just test-rust`, services/pdf-service/scripts/check.sh: rustfmt, clippy
  # (warnings denied), the tests under cargo-llvm-cov with the coverage gate (>= 80 % lines, >= 90 % in the domain crate)
  # and cargo deny (RustSec advisories, licences, bans, sources). The toolchain comes from rust-toolchain.toml through the
  # runner's rustup; the two cargo tools are release binaries pinned by version and SHA-256.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pdf-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - name: cargo-llvm-cov 0.9.1 and cargo-deny 0.20.2
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLO https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          printf '%s\n' \
            'b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz' \
            '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz' \
            | sha256sum -c -
          tar -xzf cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz -C "$HOME/.cargo/bin" cargo-llvm-cov
          tar -xzf cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/pdf-service/target
          key: cargo-${{ runner.os }}-${{ hashFiles('services/pdf-service/Cargo.lock', 'services/pdf-service/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Rust gates (fmt, clippy, tests + coverage gate, cargo deny)
        run: scripts/check.sh

  # finance-service (Go, ADR-0055): the same script as `just test-go`. Go (the setup-go action) and golangci-lint come as
  # release archives checked against their SHA-256 (no third-party action); the tests start Postgres and Redpanda with Testcontainers on
  # the runner's Docker.
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/finance-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: golangci-lint 2.15.0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLO https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz
          echo '9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea  golangci-lint-2.15.0-linux-amd64.tar.gz' | sha256sum -c -
          tar -xzf golangci-lint-2.15.0-linux-amd64.tar.gz --strip-components=1 golangci-lint-2.15.0-linux-amd64/golangci-lint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('services/finance-service/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Go gates (gofmt, tidy, golangci-lint, tests + coverage gate, govulncheck)
        env:
          GOTOOLCHAIN: local
        run: scripts/check.sh

  # The Python tests of scripts/tests (the pin scripts and their guards for the JDK, Go, Rust, Trivy and the workflows,
  # the SARIF and ZAP gates, the diagram generator) and every tracked *.test.sh (test_workflows.py checks that each one is
  # a step here, WP146): the doctor's Podman drop-in (stubbed), the JDK choice of env.sh (stub JDKs), the Claude hook's
  # command matcher and helpers (stub gates, go and mvnw), and events-drift against a throwaway PostgreSQL (Podman, on
  # the runner, like model-diagrams). They used to run as a step of semgrep.yml.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python tests
        run: python3 -I -m unittest discover -s scripts/tests
      - name: Doctor's Podman drop-in step (stubbed)
        run: scripts/tests/doctor-podman-dropin.test.sh
      - name: JDK choice of env.sh (stub JDKs)
        run: scripts/tests/env-jdk.test.sh
      - name: Claude hook's tenancy gate matcher and helpers (stubbed)
        run: scripts/hooks/tenancy-gate.test.sh
      - name: events-drift against a throwaway PostgreSQL
        run: scripts/tests/events-drift.test.sh
      - name: kind's patch of the CloudNativePG operator (jq only)
        run: scripts/tests/kind-cnpg-patch.test.sh

  # docs/domain/*-model.md are generated: ER diagrams from a throwaway PostgreSQL (Podman, on the runner) with the
  # Flyway files applied, class diagrams from the Java sources. Fails with a diff when a page is stale: `just diagrams`.
  model-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # the generator's own tests (parser, Mermaid syntax of the pages) run in the `scripts` job
      - name: Pages are up to date
        run: just diagrams-check

  # The documentation site (mkdocs.yml, ADR-0057, docs/runbooks/docs-site.md): a strict Zensical build of docs/, so a
  # broken link or anchor between pages, or a page that no longer parses, fails the pipeline. Publishing is pages.yml.
  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # the recipe installs Zensical from the pinned config/docs/requirements.txt, then builds with --strict
      - name: Strict build
        run: just docs-build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: flutter pub get
        working-directory: apps/web
      - run: just web-format-check
      - run: flutter analyze
        working-directory: apps/web
      - run: just web-test
        env:
          # goldens are recorded on macOS; Linux renders the test font/shapes a few % differently (test/flutter_test_config.dart)
          GOLDEN_DIFF_TOLERANCE: "0.06"

  # Browser-level smoke in headless Chrome for Testing (WP55, decision 37): the mock-mode journey through
  # `flutter drive` (login -> academy -> live match -> event -> sync -> training -> platform console). Chrome and the
  # matching chromedriver are pinned in the setup-pinned-chrome action (also used by e2e.yml). The login round trip
  # against the real stack is in e2e.yml.
  web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - id: chrome
        uses: ./.github/actions/setup-pinned-chrome
      - run: flutter pub get
        working-directory: apps/web
      - name: Web smoke (mock mode, headless)
        working-directory: apps/web
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          "$CHROME_EXECUTABLE" --version
          "$CHROMEDRIVER" --version
          start=$(date +%s)
          tool/web_smoke.sh
          echo "web smoke took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

  helm-chart-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: ./.github/actions/setup-chart-tools
      # chart-file drift (realm JSON / init SQL copies), lint, snapshots, kubeconform, policy asserts, gitleaks
      - run: deploy/helm/tests/run.sh
      - name: helm package (no symlinks in the charts)
        run: helm package deploy/helm/hoops -d "$RUNNER_TEMP"

  # OpenTofu module of the cloud VM (WP104, ADR-0050). No cloud credential exists in this repository's CI: init downloads
  # the provider per the lock file, `tofu test` only plans against a mocked provider, nothing is applied.
  tofu-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: infra/tofu/.opentofu-version
          tofu_wrapper: false
      # fmt, init (lock file read-only), validate, tofu test, trivy config (container), shellcheck, cloud/kind pins
      - run: infra/tofu/check.sh

  # OWASP dependency-check: fails on any unsuppressed CVSS >= 7 (failBuildOnCVSS in the root pom; suppressions only
  # with justification + expiry in .dependency-check-suppressions.xml). NVD API key: repository secret NVD_API_KEY
  # (without it the first NVD download takes hours and is throttled).
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      # The NVD mirror (~400k records, hours to fetch from scratch) is cached across runs. restore/save are split so the
      # data is saved only when the scan succeeded, so a failed or cancelled run cannot poison the cache (WP64).
      - name: Restore NVD data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      - name: dependency-check (aggregate)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # The goal is called directly (whole reactor, one report): the full lifecycle would run SpotBugs, PMD and CPD
        # a second time, `backend` already gates on them. `compile` first, so the reactor modules resolve from target/classes
        # (without it the plugin warns that common-quarkus and contracts "could not be resolved" and skips them).
        run: |
          ./mvnw -B -ntp -Psecurity-scan compile org.owasp:dependency-check-maven:aggregate \
            -DnvdApiKey="$NVD_API_KEY" -DossindexAnalyzerEnabled=false -Dformats=HTML,JSON
      - name: Save NVD data
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*

  # Repository scan: vulnerable lockfile/pom dependencies, IaC misconfigurations (Helm, Containerfiles, compose,
  # workflows) and committed secrets. Fails on HIGH/CRITICAL (fixable vulnerabilities only).
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      # Trivy resolves the Maven dependency tree from the local repository; without it it fetches every POM from Maven
      # Central, which rate-limits the runner (429). Populate ~/.m2 first and mount it read-only into the scanner.
      # Resolving is enough: no Quarkus package of the reactor (go-offline gave Trivy the same 11 targets and the same
      # packages and vulnerabilities as `package` did, checked on 2026-11-24).
      - name: Populate the Maven cache
        run: ./mvnw -B -ntp -q dependency:go-offline
      - name: trivy fs
        run: |
          docker run --rm -v "$PWD:/src" -v "$HOME/.m2:/root/.m2:ro" -w /src aquasec/trivy:0.76.2 fs \
            --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            --skip-dirs apps/web/build --skip-dirs '**/target' --skip-dirs apps/web/.dart_tool \
            --ignorefile .trivyignore.yaml .

  # OWASP ZAP baseline (passive) against the compose stack: nginx + Keycloak + core-service. Fails on any
  # High/Medium alert not accepted (IGNORE + justification) in .zap/baseline.conf (scripts/zap-gate.py).
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - name: Placeholder .env (CI only; values are the documented change-me placeholders)
        run: cp .env.example .env
      - name: Start Postgres, Keycloak, MailHog, nginx
        run: docker compose --env-file .env -f infra/compose/compose.yaml up -d --wait
      - name: Build and start core-service on the host (nginx reaches it via host.containers.internal)
        run: |
          ./mvnw -B -ntp -pl services/core-service -am package -DskipTests -Djacoco.skip=true
          set -a; . ./.env; set +a
          nohup java -jar services/core-service/target/quarkus-app/quarkus-run.jar > core.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:8081/q/health/ready && break; sleep 2; done
          curl -fs http://localhost:8080/healthz
      - name: ZAP baseline
        run: |
          mkdir -p zap && cp .zap/baseline.conf zap/ && chmod -R 777 zap
          # ZAP 2.17.0, `stable` of 2026-10-26, pinned by digest (same image as scripts/zap-api-scan.sh)
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://localhost:8080/ -c baseline.conf -J zap.json -r zap.html -I
      - name: Gate (High/Medium not accepted in .zap/baseline.conf)
        run: python3 scripts/zap-gate.py zap/zap.json .zap/baseline.conf
      - name: Upload report + logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline
          path: |
            zap/zap.html
            zap/zap.json
            core.log
