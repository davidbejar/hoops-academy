name: e2e

# End-to-end journeys (e2e/) against the compose stack on the runner: Postgres, Keycloak, MailHog and nginx run as
# containers, the three Quarkus services as fast-jars on the host, pdf-service and finance-service as compose
# containers built here (same scripts as `just e2e`, docs/runbooks/e2e.md). Then, on the same stack, the ZAP API scans
# of core, game, athlete and finance (WP83, WP123, ADR-0045).
# Podman is used (preinstalled on ubuntu-24.04 runners) because infra/compose/nginx.conf reaches the host through
# host.containers.internal and infra/keycloak/seed-users.sh uses `podman exec`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the superseded run. A run on main, a schedule or a dispatch is never cancelled
# (its group is the run itself, so it cannot even replace a queued one).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 130 # images of pdf/finance ~10 min + journeys ~25 min + four ZAP API scans of at most ~20 min each
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Podman compose
        # `podman compose` delegates to the runner's docker-compose plugin, which talks to $DOCKER_HOST: start the
        # rootless Podman API socket and export it (the runner's Docker daemon is not used).
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          systemctl --user enable --now podman.socket
          sock="/run/user/$(id -u)/podman/podman.sock"
          for _ in $(seq 1 20); do [ -S "$sock" ] && break; sleep 1; done
          echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
          podman --version; DOCKER_HOST="unix://$sock" podman compose version
      - name: Generate a throw-away .env (random secrets, never committed)
        run: |
          cp .env.example .env
          # the journey uses the master-realm Admin API through nginx to set invited users' passwords
          grep -q '^HOOPS_EXPOSE_KC_ADMIN=' .env && sed -i 's|^HOOPS_EXPOSE_KC_ADMIN=.*|HOOPS_EXPOSE_KC_ADMIN=true|' .env || echo 'HOOPS_EXPOSE_KC_ADMIN=true' >> .env
          # nginx (a container) reaches finance-service through the host: publish its port on every interface here
          echo 'HOOPS_FINANCE_BIND=0.0.0.0' >> .env
          while IFS= read -r line; do
            case "$line" in
              *=change-me-*) key="${line%%=*}"; sed -i "s|^${key}=.*|${key}=$(openssl rand -hex 16)|" .env ;;
            esac
          done < .env.example
          echo "::add-mask::$(grep '^DEV_USER_PASSWORD=' .env | cut -d= -f2-)"
      - name: Build the services once
        run: ./mvnw -B -ntp -q -pl services/core-service,services/game-service,services/athlete-service -am package -DskipTests
      - name: Start stack, seed users, start services
        # the jars, then pdf-service and finance-service (compose profiles pdf and finance; their images are built here)
        run: |
          just up
          just seed-users
          e2e/bin/services-up.sh --no-build
      - name: Journeys
        run: ./mvnw -B -ntp -pl e2e test -De2e.baseUrl=http://localhost:8080
      - uses: ./.github/actions/setup-flutter
      - id: chrome
        uses: ./.github/actions/setup-pinned-chrome
      - name: Browser login round trip (first sign-in, temporary password)
        # headless Chrome + chromedriver against the stack: app -> Keycloak `hoops` theme -> update-password -> signed in
        working-directory: apps/web
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME: /usr/bin/google-chrome
          HOOPS_E2E_ARTIFACT_DIR: ${{ github.workspace }}/browser-login-artifacts
        run: |
          flutter pub get
          start=$(date +%s)
          tool/ci_login_check.sh
          echo "browser login check took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      # Active ZAP scan of each service's OpenAPI contract through nginx, signed in as the platform super admin
      # (PKCE login, token refreshed by .zap/hooks/bearer_refresh.py). Fails on a High/Medium alert not accepted in
      # .zap/api-<service>.conf (scripts/zap-gate.py). Runs last: the scan writes junk data into the throw-away stack.
      - name: ZAP API scans (core, game, athlete, finance)
        env:
          ZAP_ENGINE: podman
          ZAP_WORK_DIR: ${{ github.workspace }}/zap-api
          ZAP_MAX_SCAN_MINUTES: '15'
        run: |
          rc=0
          for svc in core game athlete finance; do
            echo "### ZAP API scan: $svc" >> "$GITHUB_STEP_SUMMARY"
            scripts/zap-api-scan.sh "$svc" http://localhost:8080 > "zap-$svc.out" 2>&1 || rc=1
            tail -n 40 "zap-$svc.out"
            grep -E '^(ZAP alerts|BLOCKING|EXPIRED|CONFIG|zap-api-scan)' "zap-$svc.out" >> "$GITHUB_STEP_SUMMARY" || true
          done
          exit "$rc"
      - name: Service logs on failure
        if: failure()
        run: |
          for s in core game athlete; do echo "::group::$s"; tail -n 200 "e2e/target/services/$s.log" || true; echo "::endgroup::"; done
          for s in pdf finance; do echo "::group::$s"; podman logs "hoops-$s-service" 2>&1 | tail -n 200 || true; echo "::endgroup::"; done
          podman ps -a
          podman logs hoops-keycloak 2>&1 | tail -n 100 || true
      - name: Stop
        if: always()
        run: |
          e2e/bin/services-down.sh || true
          just down || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reports
          path: |
            e2e/target/surefire-reports/
            e2e/target/services/*.log
            browser-login-artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-api-reports
          if-no-files-found: ignore
          path: |
            zap-api/*/zap-api-*.json
            zap-api/*/zap-api-*.html
            zap-api/*/zap-api-*.log
