name: e2e

# End-to-end journeys (e2e/) against the compose stack on the runner: Postgres, Keycloak, MailHog and nginx run as
# containers, the three services as fast-jars on the host (same scripts as `just e2e`, docs/runbooks/e2e.md).
# Podman is used (preinstalled on ubuntu-24.04 runners) because infra/compose/nginx.conf reaches the host through
# host.containers.internal and infra/keycloak/seed-users.sh uses `podman exec`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Podman compose
        # `podman compose` delegates to the runner's docker-compose plugin, which talks to $DOCKER_HOST: start the
        # rootless Podman API socket and export it (the runner's Docker daemon is not used).
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          systemctl --user enable --now podman.socket
          sock="/run/user/$(id -u)/podman/podman.sock"
          for _ in $(seq 1 20); do [ -S "$sock" ] && break; sleep 1; done
          echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
          podman --version; DOCKER_HOST="unix://$sock" podman compose version
      - name: Generate a throw-away .env (random secrets, never committed)
        run: |
          cp .env.example .env
          # the journey uses the master-realm Admin API through nginx to set invited users' passwords
          grep -q '^HOOPS_EXPOSE_KC_ADMIN=' .env && sed -i 's|^HOOPS_EXPOSE_KC_ADMIN=.*|HOOPS_EXPOSE_KC_ADMIN=true|' .env || echo 'HOOPS_EXPOSE_KC_ADMIN=true' >> .env
          while IFS= read -r line; do
            case "$line" in
              *=change-me-*) key="${line%%=*}"; sed -i "s|^${key}=.*|${key}=$(openssl rand -hex 16)|" .env ;;
            esac
          done < .env.example
          echo "::add-mask::$(grep '^DEV_USER_PASSWORD=' .env | cut -d= -f2-)"
      - name: Build the services once
        run: ./mvnw -B -ntp -q -pl services/core-service,services/game-service,services/athlete-service -am package -DskipTests
      - name: Start stack, seed users, start services
        run: |
          just up
          just seed-users
          e2e/bin/services-up.sh --no-build
      - name: Journeys
        run: ./mvnw -B -ntp -pl e2e test -De2e.baseUrl=http://localhost:8080
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - id: chrome
        uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
        with:
          chrome-version: 157.0.8103.38
          install-chromedriver: true
      # chromedriver finds the runner's own Chrome (/opt/google/chrome, another major) before the action's, so remove
      # it and make `google-chrome` a wrapper around the pinned build with the flags a headless runner needs.
      - name: Make the pinned Chrome the only google-chrome
        run: |
          sudo rm -rf /opt/google/chrome /usr/bin/google-chrome   # the latter is a symlink into the former
          printf '#!/bin/sh\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "${{ steps.chrome.outputs.chrome-path }}" | sudo tee /usr/bin/google-chrome >/dev/null
          sudo chmod +x /usr/bin/google-chrome
          google-chrome --version
      - name: Browser login round trip (first sign-in, temporary password)
        # headless Chrome + chromedriver against the stack: app -> Keycloak `hoops` theme -> update-password -> signed in
        working-directory: apps/web
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROME: /usr/bin/google-chrome
          HOOPS_E2E_ARTIFACT_DIR: ${{ github.workspace }}/browser-login-artifacts
        run: |
          flutter pub get
          start=$(date +%s)
          tool/ci_login_check.sh
          echo "browser login check took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: |
          for s in core game athlete; do echo "::group::$s"; tail -n 200 "e2e/target/services/$s.log" || true; echo "::endgroup::"; done
          podman ps -a
          podman logs hoops-keycloak 2>&1 | tail -n 100 || true
      - name: Stop
        if: always()
        run: |
          e2e/bin/services-down.sh || true
          just down || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reports
          path: |
            e2e/target/surefire-reports/
            e2e/target/services/*.log
            browser-login-artifacts/
