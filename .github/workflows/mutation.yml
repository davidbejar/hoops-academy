name: mutation

# WP37 (docs/quality/mutation.md): mutation testing with PIT on demand and once a month, never on push or pull
# request. Each module fails below its baseline (mutationThreshold in its `mutation` profile); the HTML + XML reports
# are kept as artifacts either way.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [common-quarkus, core-service, game-service, athlete-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Mutation testing (${{ matrix.module }})
        run: just mutation ${{ matrix.module }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-reports-${{ matrix.module }}
          path: '*/${{ matrix.module }}/target/pit-reports'
          if-no-files-found: warn
