name: setup-chart-tools
description: >-
  kubeconform and gitleaks for deploy/helm/tests/run.sh, downloaded from their releases and checked against the
  SHA-256 of the release's own checksum file. Helm is set up by azure/setup-helm in the caller.
runs:
  using: composite
  steps:
    - name: kubeconform v0.8.0 and gitleaks v8.30.1
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -sSLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
        curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        printf '%s\n' \
          '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform-linux-amd64.tar.gz' \
          '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' \
          | sha256sum -c -
        sudo tar -xzf kubeconform-linux-amd64.tar.gz -C /usr/local/bin kubeconform
        sudo tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
