name: setup-pinned-chrome
description: >-
  Chrome for Testing and its chromedriver at one pinned version, installed as the only `google-chrome` of the runner
  (headless flags in a wrapper). The browser smoke of ci.yml and the login round trip of e2e.yml use it; bump the
  version here only.
outputs:
  chrome-path:
    description: The pinned Chrome binary (not the wrapper at /usr/bin/google-chrome).
    value: ${{ steps.chrome.outputs.chrome-path }}
  chromedriver-path:
    description: The chromedriver matching the pinned Chrome.
    value: ${{ steps.chrome.outputs.chromedriver-path }}
runs:
  using: composite
  steps:
    - id: chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      with:
        chrome-version: 157.0.8103.38
        install-chromedriver: true
    # chromedriver finds the runner's own Chrome (/opt/google/chrome, another major) before the action's, so remove
    # it and make `google-chrome` a wrapper around the pinned build with the flags a headless runner needs.
    - name: Make the pinned Chrome the only google-chrome
      shell: bash
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: |
        sudo rm -rf /opt/google/chrome /usr/bin/google-chrome   # the latter is a symlink into the former
        printf '#!/bin/sh\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "$CHROME_PATH" | sudo tee /usr/bin/google-chrome >/dev/null
        sudo chmod +x /usr/bin/google-chrome
        google-chrome --version
