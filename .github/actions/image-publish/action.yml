name: image-publish
description: >-
  What every image job of images.yml does after the build and its start check: Trivy scan (fails on a fixable
  HIGH/CRITICAL), CycloneDX SBOMs validated and kept as the artifact `sbom-<name>` (90 days), and on main with a
  registry configured the push to the registry plus the SBOMs as OCI referrers (ADR-0043). Run actions/checkout
  first: scripts/sbom.sh is in the checkout. The image is built and podman-local (localhost/...); the caller's job
  needs `packages: write` for the push.
inputs:
  name:
    description: Image name in the registry and in the SBOM file names, e.g. core-service or web.
    required: true
  image:
    description: The local image reference to scan and push, e.g. localhost/hoops/core-service:<sha>.
    required: true
  maven-sbom:
    description: "'true' for the service images: also the SBOM of the Maven build (the image build's cached stage)."
    default: 'false'
  push:
    description: "'true' to push (the caller decides: main, and a registry is configured)."
    default: 'false'
  registry:
    description: Registry and repository prefix of the push, e.g. ghcr.io/<owner>/<repo>.
    default: ''
  registry-username:
    description: Registry login; set with registry-password, or neither (then github-token to ghcr.io as the actor).
    default: ''
  registry-password:
    description: Registry password; see registry-username.
    default: ''
  github-token:
    description: The job's GITHUB_TOKEN, used when no registry login is configured.
    default: ''
runs:
  using: composite
  steps:
    - name: Trivy scan (fail on fixable HIGH/CRITICAL)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        podman save -o image.tar "$IMAGE"
        docker run --rm -v "$PWD:/w" aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --input /w/image.tar \
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
    - name: SBOM of the Maven build (the image build's cached stage)
      if: ${{ inputs.maven-sbom == 'true' }}
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: scripts/sbom.sh maven "$NAME" sbom
    - name: SBOM (CycloneDX of the image, validated)
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        IMAGE: ${{ inputs.image }}
      run: scripts/sbom.sh generate "$NAME" "$IMAGE" sbom
    - name: Keep the SBOMs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-${{ inputs.name }}
        path: sbom/*.cdx.json
        if-no-files-found: error
        retention-days: 90
    - name: Push
      if: ${{ inputs.push == 'true' }}
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ACTOR: ${{ github.actor }}
        NAME: ${{ inputs.name }}
        IMAGE: ${{ inputs.image }}
        SHA: ${{ github.sha }}
        REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
      run: |
        set -euo pipefail
        registry=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]'); registry="${registry%/}"
        if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then user="$REGISTRY_USERNAME"; pass="$REGISTRY_PASSWORD"
        elif [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then user="$ACTOR"; pass="$GITHUB_TOKEN"
        else echo "::error::set both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither (GITHUB_TOKEN -> ghcr.io)"; exit 1; fi
        echo "$pass" | podman login -u "$user" --password-stdin "${registry%%/*}"
        podman tag "$IMAGE" "$registry/$NAME:$SHA"
        podman push --digestfile digest.txt "$registry/$NAME:$SHA"
        # the SBOMs as OCI referrers of the pushed digest (ghcr.io: ORAS falls back to the referrers tag schema)
        scripts/sbom.sh attach "$registry/$NAME@$(cat digest.txt)" sbom "$REGISTRY_AUTH_FILE"
