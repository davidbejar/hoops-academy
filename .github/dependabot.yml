# Dependabot version updates (decision of 2026-11-06). Weekly, grouped per ecosystem so the review load stays at a few
# PRs a week; `ci` and `e2e` run on every PR. Not covered here: the container base images (deploy/containers), the
# chart's image tags and the Envoy Gateway / kind pins in deploy/kind/up.sh; the weekly workflow
# .github/workflows/bump-pins.yml (scripts/bump-pins.sh, docs/runbooks/release.md section 6) bumps those.
# The generated Dart packages under apps/web/packages are not listed: `just gen-api` owns them.
# Cooldown (SD-07 of the 2026-11 review): a release is proposed only once it is 7 days old, so a hijacked fresh release
# has time to be noticed and pulled first. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Quarkus platform (BOM + plugin) on its own: a major or minor bump usually needs code changes.
      quarkus:
        patterns: ["io.quarkus*", "io.quarkus.platform:*"]
      maven-minor-patch:
        exclude-patterns: ["io.quarkus*", "io.quarkus.platform:*"]
        update-types: ["minor", "patch"]
    ignore:
      # WP43: swagger-request-validator 3.0.0 (strict validator, ADR-0027) is compiled against networknt 2.x / Jackson 2;
      # 3.x keeps the class names but takes Jackson 3 trees (NoSuchMethodError). Revisit when it moves to networknt 3.x.
      - dependency-name: "com.networknt:json-schema-validator"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(web)"
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]

  # pdf-service (Rust, ADR-0052): the workspace's Cargo.lock. The toolchain (rust-toolchain.toml) and the image bases of
  # deploy/containers/pdf.Containerfile are bumped by hand with it (ADR-0052 "Pins").
  - package-ecosystem: cargo
    directory: /services/pdf-service
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(pdf)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Actions are pinned to full commit SHAs with the version as a comment (WP50); Dependabot updates both together.
  - package-ecosystem: github-actions
    # the workflows, and the composite actions under .github/actions/ (they pin third-party actions too)
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # finance-service (Go, ADR-0055): go.mod / go.sum, govulncheck included (a tool dependency). The toolchain line and
  # the image bases of deploy/containers/finance.Containerfile are bumped by hand together (ADR-0055 "Pins").
  - package-ecosystem: gomod
    directory: /services/finance-service
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(finance)"
    groups:
      gomod-minor-patch:
        update-types: ["minor", "patch"]

  # Documentation site (mkdocs.yml, ADR-0057): Zensical with its transitive pins
  # (config/docs/requirements.txt, docs/runbooks/docs-site.md). The `docs-site` job of `ci` proves a bump.
  - package-ecosystem: pip
    directory: /config/docs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docs)"
    groups:
      docs-site:
        patterns: ["*"]
