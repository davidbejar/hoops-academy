include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by scripts/gen-api.sh — never edited by hand.
    - packages/**
    - lib/l10n/gen/**
    - build/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    unawaited_futures: true
    avoid_print: true
    # dart format puts a one-line `if (x) return y;` on two lines; this lint then flags it.
    curly_braces_in_flow_control_structures: false
