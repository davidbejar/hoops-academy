# PMD findings accepted by the maintainability gate (WP113, ADR-0053, docs/quality/pmd.md).
# Format: <fully.qualified.Class>=<Rule>[,<Rule>...], one class per line, the reason in the comment above it.
# An entry covers the whole class for that rule, so keep it to the class that needs it; never add a rule globally.
# Reviewed with the other baselines (spotbugs-exclude.xml, the SARIF acceptances) each round.

# A flat exhaustive switch from wire type to event, one arm per event type (cognitive complexity stays low);
# cyclomatic complexity counts each arm. Splitting the switch would scatter the one mapping. Under mutation testing.
com.hoopsacademy.game.adapters.json.MatchEventJson=CyclomaticComplexity
com.hoopsacademy.game.adapters.in.messaging.RosterEventMapper=CyclomaticComplexity
com.hoopsacademy.athlete.adapters.in.messaging.CoreEventMapper=CyclomaticComplexity

# Match.restore rehydrates the aggregate from its row: one parameter per persisted column (17), called only by
# JpaMatchRepository. A parameter object would just repeat the entity.
com.hoopsacademy.game.domain.Match=ExcessiveParameterList

# CDI constructor of the player-creation use case: 12 injected collaborators (access, approvals, login, provisioning).
# Splitting the use case is follow-up work, not a gate fix; the class may not take a 13th.
com.hoopsacademy.core.application.approvals.CreatePlayer=ExcessiveParameterList
