# ============================================================================
# core-service — tenancy, identity & membership, platform endpoints (WP3)
# Secrets come from the environment (see .env.example); nothing secret is committed.
# Library defaults (multitenant=DISCRIMINATOR, stringtype=unspecified, X-Tenant-Id) come from common-quarkus.
# ============================================================================
quarkus.application.name=core-service
quarkus.http.port=8081
quarkus.http.test-port=0

# ---- default datasource: tenant data as the NON-owner role core_app (RLS always applies) -------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${CORE_DB_URL:jdbc:postgresql://localhost:5432/hoops}
quarkus.datasource.username=${CORE_APP_USER:core_app}
quarkus.datasource.password=${CORE_APP_PASSWORD}

# ---- "platform" datasource: super-admin operations as core_platform (tenant registry, usage, billing only) --
quarkus.datasource.platform.db-kind=postgresql
quarkus.datasource.platform.devservices.enabled=false
quarkus.datasource.platform.jdbc.url=${CORE_DB_URL:jdbc:postgresql://localhost:5432/hoops}
quarkus.datasource.platform.username=${CORE_PLATFORM_USER:core_platform}
quarkus.datasource.platform.password=${CORE_PLATFORM_PASSWORD}
quarkus.datasource.platform.jdbc.max-size=5

# ---- Flyway runs as the schema owner core_migrator (never as the app role) ---------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=core,billing
quarkus.flyway.create-schemas=false
quarkus.flyway.username=${CORE_MIGRATOR_USER:core_migrator}
quarkus.flyway.password=${CORE_MIGRATOR_PASSWORD}

# ---- Hibernate: two persistence units, one per datasource --------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.packages=com.hoopsacademy.core.adapters.out.persistence
quarkus.hibernate-orm."platform".datasource=platform
quarkus.hibernate-orm."platform".packages=com.hoopsacademy.core.adapters.out.platform
quarkus.hibernate-orm."platform".schema-management.strategy=none

# ---- OIDC: validate Keycloak access tokens (realm academy); roles from realm_access/roles -------------------
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8080/auth/realms/academy}
quarkus.oidc.client-id=core-service
quarkus.oidc.credentials.secret=${CORE_SERVICE_CLIENT_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Only access tokens minted for this service (the realm's audience mapper, ADR-0034): another service's token is a 401
quarkus.oidc.token.audience=core-service
quarkus.keycloak.devservices.enabled=false

# ---- OIDC client: client-credentials tokens for /internal calls to game/athlete ----------------------------
quarkus.oidc-client.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8080/auth/realms/academy}
quarkus.oidc-client.client-id=core-service
quarkus.oidc-client.credentials.secret=${CORE_SERVICE_CLIENT_SECRET}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false

# ---- Keycloak Admin API (user provisioning only, ADR-0005) — service account of client core-service --------
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL:http://localhost:8080/auth}
quarkus.keycloak.admin-client.realm=academy
quarkus.keycloak.admin-client.client-id=core-service
quarkus.keycloak.admin-client.client-secret=${CORE_SERVICE_CLIENT_SECRET}
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
hoops.keycloak.realm=academy

# ---- usage aggregation (/platform/tenants/{id}/usage) -------------------------------------------------------
quarkus.rest-client.game-usage.url=${GAME_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.game-usage.connect-timeout=1000
quarkus.rest-client.game-usage.read-timeout=2000
quarkus.rest-client.athlete-usage.url=${ATHLETE_SERVICE_URL:http://localhost:8083}
quarkus.rest-client.athlete-usage.connect-timeout=1000
quarkus.rest-client.athlete-usage.read-timeout=2000

# ---- domain settings ----------------------------------------------------------------------------------------
hoops.tenant.withdrawn-retention=P365D
hoops.authz.cache-ttl=PT10S
# eligibility sweep over all ACTIVE tenants (idempotent): hourly, so each tenant is evaluated soon after its own
# local midnight (BIRTHDAY rule). Set to "off" to disable the trigger.
hoops.core.eligibility-cron=${CORE_ELIGIBILITY_CRON:0 15 * * * ?}

# nightly usage snapshot of every ACTIVE tenant (one row per tenant and UTC day, idempotent upsert)
hoops.core.usage-snapshot-cron=${CORE_USAGE_SNAPSHOT_CRON:0 30 2 * * ?}

# onboarding crash-window repair (WP17): tenants registered > grace ago (within look-back) without settings are removed
hoops.core.onboarding-repair-cron=${CORE_ONBOARDING_REPAIR_CRON:0 */10 * * * ?}
hoops.core.onboarding-repair.grace=PT15M
hoops.core.onboarding-repair.look-back=P7D

# temporary passwords (ADR-0028): an unused one expires after the TTL and its login is disabled until a new one is
# issued. No cron: the sweep runs in the background when a temporary password is issued or an invitation is accepted
# at the first sign-in (cluster lock core.temporary_password_sweep).
hoops.temporary-password.ttl=P3D
hoops.temporary-password.sweep-on-events=true

# ---- events (WP67, ADR-0036): the outbox publisher sends the roster events to Redpanda ---------------------------
# Every replica polls (row locks, no cluster lock); "off" disables the publisher (the outbox still fills up).
hoops.outbox.poll-interval=${CORE_OUTBOX_POLL_INTERVAL:1s}
hoops.outbox.batch-size=${CORE_OUTBOX_BATCH_SIZE:100}
# How long a send waits for the broker's acknowledgement; after that the run stops and the batch is sent again later.
hoops.outbox.send-timeout=${CORE_OUTBOX_SEND_TIMEOUT:PT10S}
# Broker: compose (host mode) by default; the chart sets the in-cluster address and SASL/SCRAM (ADR-0036 §8). Dev mode
# and tests use Dev Services Redpanda (the pinned image, common-quarkus), which needs bootstrap.servers unset.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl.mechanism=SCRAM-SHA-256
kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:core-service}" password="${KAFKA_SASL_PASSWORD:}";
mp.messaging.outgoing.core-events.connector=smallrye-kafka
# every record names its own topic (OutgoingKafkaRecordMetadata); this one is only the channel's default
mp.messaging.outgoing.core-events.topic=core.person
mp.messaging.outgoing.core-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.core-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.core-events.acks=all
mp.messaging.outgoing.core-events.enable.idempotence=true
mp.messaging.outgoing.core-events.linger.ms=0
mp.messaging.outgoing.core-events.request.timeout.ms=5000
mp.messaging.outgoing.core-events.delivery.timeout.ms=8000
mp.messaging.outgoing.core-events.max.block.ms=5000
# A broker outage must not take core out of service: the connector's readiness check is off, OutboxPublisherHealthCheck
# reports the publisher as UP with state DEGRADED instead.
mp.messaging.outgoing.core-events.health-enabled=false
# Dev Services create the topics like compose does (one partition each; infra/compose/redpanda-topics.sh).
quarkus.kafka.devservices.topic-partitions."core.person"=1
quarkus.kafka.devservices.topic-partitions."core.player"=1
quarkus.kafka.devservices.topic-partitions."core.team"=1
quarkus.kafka.devservices.topic-partitions."core.team-player"=1
quarkus.kafka.devservices.topic-partitions."core.team-staff"=1
quarkus.kafka.devservices.topic-partitions."core.guardian-link"=1
quarkus.kafka.devservices.topic-partitions."core.tenant"=1

# ---- JSON: absent optional members are omitted (fields that are required+nullable opt in explicitly) ------
quarkus.jackson.serialization-inclusion=non_null

# ---- operations ---------------------------------------------------------------------------------------------
# common-quarkus' CoreReachabilityCheck reports core's reachability for game/athlete; core would only probe itself.
hoops.core.reachability-check.enabled=false
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-health.root-path=/q/health
# 2M body limit, security headers, CORS allow-list (hoops.cors.origins), metrics, OTel and JSON logs: common-quarkus
# defaults (META-INF/microprofile-config.properties); larger bodies get a 413 Problem (REQUEST_TOO_LARGE).

# ============================================================================
# %test — Postgres via PostgresRlsResource (default DS + Flyway), Keycloak/OIDC via WireMockResource.
# ============================================================================
%test.quarkus.datasource.platform.jdbc.url=${quarkus.datasource.jdbc.url}
%test.quarkus.datasource.platform.username=core_platform
%test.quarkus.datasource.platform.password=core_platform-test-password
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.auth-server-url=http://localhost:1/realms/test
%test.quarkus.oidc.credentials.secret=test-only-secret
%test.quarkus.oidc-client.discovery-enabled=false
%test.quarkus.oidc-client.token-path=/protocol/openid-connect/token
%test.quarkus.oidc-client.credentials.secret=test-only-secret
%test.quarkus.keycloak.admin-client.client-secret=test-only-secret
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
%test.quarkus.log.category."com.hoopsacademy".level=DEBUG
# tests call the job / sweep directly
%test.hoops.core.eligibility-cron=off
%test.hoops.core.usage-snapshot-cron=off
%test.hoops.core.onboarding-repair-cron=off
%test.hoops.temporary-password.sweep-on-events=false
# tests call OutboxPublisherJob.run() directly; a paused broker fails a send within seconds
%test.hoops.outbox.poll-interval=off
%test.hoops.outbox.send-timeout=PT5S
%test.mp.messaging.outgoing.core-events.request.timeout.ms=1000
%test.mp.messaging.outgoing.core-events.delivery.timeout.ms=3000
%test.mp.messaging.outgoing.core-events.max.block.ms=2000
%test.hoops.security.require-sub=false
