quarkus.application.name=game-service
quarkus.http.port=8082

# ---- database: game_app at runtime (non-owner, RLS applies), game_migrator for Flyway ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=game_app
quarkus.datasource.password=${GAME_APP_PASSWORD}
quarkus.datasource.jdbc.url=${GAME_DB_URL:jdbc:postgresql://localhost:5432/hoops}
quarkus.flyway.schemas=game
quarkus.flyway.create-schemas=false
quarkus.flyway.username=game_migrator
quarkus.flyway.password=${GAME_MIGRATOR_PASSWORD}
%prod.quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.database.default-schema=game
# multitenant=DISCRIMINATOR, stringtype=unspecified and hoops.tenancy.header come from common-quarkus defaults

# ---- authentication (Keycloak realm academy; tenant roles come from core via RosterPort) ----
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/academy
quarkus.oidc.client-id=game-service
quarkus.oidc.credentials.secret=${GAME_SERVICE_CLIENT_SECRET}
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Only access tokens minted for this service (the realm's audience mapper, ADR-0034): another service's token is a 401
quarkus.oidc.token.audience=game-service

# ---- service-to-service: client credentials token for core /internal/** ----
quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/academy
quarkus.oidc-client.client-id=game-service
quarkus.oidc-client.credentials.secret=${GAME_SERVICE_CLIENT_SECRET}
quarkus.oidc-client.early-tokens-acquisition=false

# ---- core-service REST client (RosterPort adapter) ----
# core-service /internal client: common-quarkus' CoreInternalClient (quarkus.rest-client.core.*, 2 s timeouts) and
# CoreRosterClient cache (hoops.core.cache-ttl, 30 s) come from the library defaults.
hoops.core.url=http://localhost:8081

# ---- roster source (WP68, ADR-0037): rest = core /internal (default), replica = the local replica fed by core's events
# One switch for RosterPort and the tenant filter's authorisation context; the consumer feeds the replica in both modes.
hoops.roster.source=${GAME_ROSTER_SOURCE:rest}

# ---- events (WP68, ADR-0036/0037): the consumer that feeds the roster replica from core's roster topics ------------
# One channel over the seven topics, one consumer group (a single `rpk group seek` replays everything); offsets are
# committed after processing (at least once); a failure that retries cannot fix fails the channel (liveness DOWN, the
# pod restarts from the committed offset); readiness never depends on the broker. GAME_ROSTER_CONSUMER_ENABLED=false
# switches the consumer off.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl.mechanism=SCRAM-SHA-256
kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:game-service}" password="${KAFKA_SASL_PASSWORD:}";
mp.messaging.incoming.core-roster.connector=smallrye-kafka
mp.messaging.incoming.core-roster.enabled=${GAME_ROSTER_CONSUMER_ENABLED:true}
mp.messaging.incoming.core-roster.topics=core.person,core.player,core.team,core.team-player,core.team-staff,core.guardian-link,core.tenant
mp.messaging.incoming.core-roster.group.id=game-service.roster
mp.messaging.incoming.core-roster.auto.offset.reset=earliest
mp.messaging.incoming.core-roster.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.core-roster.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.core-roster.failure-strategy=fail
mp.messaging.incoming.core-roster.health-readiness-enabled=false
# The connector pauses the partitions while the blocking processing has no demand; with the default poll timeout (1 s)
# each pause costs up to a second, which added 1 to 4 s of lag per burst on compose. 100 ms keeps it below a second.
mp.messaging.incoming.core-roster.poll-timeout=100
mp.messaging.incoming.core-roster.fetch.max.wait.ms=100
# attempts of one event before the channel fails (a database blip), with 1 s, 2 s, ... between them
hoops.roster.replica.apply-attempts=3
# Replica housekeeping (WP82, ADR-0037 amendment): a daily job (one pod at a time) deletes the applied event ids older
# than applied-events (never below the topics' 7-day tombstone retention: the service refuses to start) in batches of
# batch-size per tenant, and the parked records an operator marked inspected (parked_event.inspected_at) longer than
# parked-events ago; uninspected ones stay. cron "off" disables the job.
hoops.roster.replica.retention.cron=0 40 3 * * ?
hoops.roster.replica.retention.applied-events=P7D
hoops.roster.replica.retention.parked-events=P30D
hoops.roster.replica.retention.batch-size=1000
quarkus.kafka.devservices.topic-partitions."core.person"=1
quarkus.kafka.devservices.topic-partitions."core.player"=1
quarkus.kafka.devservices.topic-partitions."core.team"=1
quarkus.kafka.devservices.topic-partitions."core.team-player"=1
quarkus.kafka.devservices.topic-partitions."core.team-staff"=1
quarkus.kafka.devservices.topic-partitions."core.guardian-link"=1
quarkus.kafka.devservices.topic-partitions."core.tenant"=1

# ---- statistics: overtime periods (period > periodCount) last this many minutes ----
hoops.game.overtime-minutes=5

# ---- operations: /q/health (live, ready incl. datasource + informational core reachability), /q/metrics ----
quarkus.smallrye-health.root-path=/q/health
hoops.core.health-timeout=PT1S
hoops.core.health-cache-ttl=PT10S
%test.hoops.core.health-cache-ttl=PT0S

# ---- tests: Postgres from PostgresRlsResource, core + token endpoint from WireMock, auth via @TenantUser ----
# random HTTP port: parallel service test runs on one machine must not collide on 8081
%test.quarkus.http.test-port=0
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc-client.discovery-enabled=false
%test.quarkus.oidc-client.token-path=/protocol/openid-connect/token
%test.quarkus.oidc.credentials.secret=test-only-secret
%test.quarkus.oidc-client.credentials.secret=test-only-secret
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
%test.hoops.security.require-sub=false
# the consumer runs only in the tests that publish records; their broker is RosterBrokerResource (it turns the consumer
# on), started through ContainerStarts: Kafka Dev Services would start one per Quarkus boot without it (WP82)
%test.mp.messaging.incoming.core-roster.enabled=false
%test.quarkus.kafka.devservices.enabled=false
%test.hoops.roster.replica.retention.cron=off

# OpenTelemetry (WP86, ADR-0046), build-time keys: the log handler is compiled in (it exports only when the SDK is on,
# QUARKUS_OTEL_SDK_DISABLED=false from the chart) and root spans are sampled at quarkus.otel.traces.sampler.arg (runtime,
# default 1.0; the chart sets global.observability.tracesSampleRatio), children follow their parent.
quarkus.otel.logs.enabled=true
quarkus.otel.traces.sampler=parentbased_traceidratio
