# Copied from quarkus-junit's own junit-platform.properties (only the first file on the classpath is read)
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.testclass.order.default=io.quarkus.test.junit.util.QuarkusTestProfileAwareClassOrderer
# jqwik keeps its failure database under target/, not in the module root
jqwik.database=target/.jqwik-database
