[package]
name = "pdf-adapters"
description = "HTTP in (axum), JWT, Problem+JSON, the krilla renderer out, telemetry and the pdf-service binary (ADR-0052)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pdf-service"
path = "src/main.rs"

[dependencies]
pdf-domain.workspace = true
pdf-application.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }
skrifa = { version = "0.42.1", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter", "registry", "ansi"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }

[dev-dependencies]
rsa = "0.10.0"
serde_norway = "0.9.42"
jsonschema = { version = "0.61.2", default-features = false }
lopdf = { version = "0.47.0", default-features = false }
toml = "1.2.1"
http-body-util = "0.1.5"
base64 = "0.23"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "registry"] }

[lints]
workspace = true
