# Dependency audit of pdf-service (ADR-0052), run by `just test-rust` and CI: `cargo deny check`.
#   advisories  RustSec advisory database: any vulnerability or unsound crate fails; unmaintained / yanked too
#   licenses    only the permissive licences below (the repository is AGPL-3.0-only; the crates are private)
#   bans        no wildcard versions; duplicates are reported, not failed (the crypto and font stacks overlap)
#   sources     crates.io only, no git dependencies
# An exception needs a reason and an expiry date in its comment, like the Java suppressions (ADR-0045).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
