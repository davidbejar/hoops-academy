# ---- athlete-service ----
quarkus.application.name=athlete-service
quarkus.http.port=8083

# ---- database: the app connects as the NON-owner athlete_app role, Flyway migrates as athlete_migrator ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${ATHLETE_DB_URL:jdbc:postgresql://localhost:5432/hoops}
quarkus.datasource.username=athlete_app
quarkus.datasource.password=${ATHLETE_APP_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=athlete
quarkus.flyway.create-schemas=false
quarkus.flyway.username=athlete_migrator
quarkus.flyway.password=${ATHLETE_MIGRATOR_PASSWORD}
quarkus.hibernate-orm.schema-management.strategy=none
# multitenant=DISCRIMINATOR, stringtype=unspecified and hoops.tenancy.header come from the common-quarkus defaults

# ---- authentication (Keycloak realm academy; tenant roles are NOT in the token, see ADR-0005) ----
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/academy
quarkus.oidc.client-id=athlete-service
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Only access tokens minted for this service (the realm's audience mapper, ADR-0034): another service's token is a 401
quarkus.oidc.token.audience=athlete-service

# ---- service-to-service: client credentials of the athlete-service client (role `service`) ----
quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/academy
quarkus.oidc-client.client-id=athlete-service
quarkus.oidc-client.credentials.secret=${ATHLETE_SERVICE_CLIENT_SECRET}
quarkus.oidc-client.early-tokens-acquisition=false

# ---- core-service (RosterPort adapter), ADR-0008: 2 s timeout, 30 s cache (see CoreRosterAdapter) ----
# common-quarkus' CoreInternalClient (quarkus.rest-client.core.*, 2 s timeouts) and CoreRosterClient cache
# (hoops.core.cache-ttl, 30 s) come from the library defaults; only the base URL is set here.
hoops.core.url=http://localhost:8081

# ---- roster source (WP69, ADR-0037): core's /internal REST API (default) or the local replica fed by core's events ----
# rest = RosterPort and the tenant filter's membership come from core (cached 30 s); replica = from the athlete.*_ref
# tables. The consumer below fills the replica in both modes (in the shadow while REST answers); source=replica with the
# consumer off fails at startup.
hoops.roster.source=${ATHLETE_ROSTER_SOURCE:rest}
hoops.roster.consumer.enabled=${ATHLETE_ROSTER_CONSUMER_ENABLED:true}
# Broker (ADR-0036 section 8): compose host mode by default; the chart sets the in-cluster address and SASL/SCRAM. Dev
# mode uses Dev Services Redpanda (the pinned image, common-quarkus), which needs bootstrap.servers unset; tests use
# RosterBrokerResource (same image).
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl.mechanism=SCRAM-SHA-256
kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:athlete-service}" password="${KAFKA_SASL_PASSWORD:}";
# One consumer for the seven compacted roster topics (one partition each, so every topic is read in outbox order).
mp.messaging.incoming.core-roster.connector=smallrye-kafka
mp.messaging.incoming.core-roster.enabled=${hoops.roster.consumer.enabled}
mp.messaging.incoming.core-roster.topics=core.person,core.player,core.team,core.team-player,core.team-staff,core.guardian-link,core.tenant
mp.messaging.incoming.core-roster.group.id=athlete-service.roster
mp.messaging.incoming.core-roster.auto.offset.reset=earliest
mp.messaging.incoming.core-roster.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.core-roster.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# A broker outage must not take athlete out of service (the replica keeps answering, it only gets older).
mp.messaging.incoming.core-roster.health-readiness-enabled=false
# A record that cannot be applied after hoops.roster.replica.max-attempts (backoff from first-backoff, doubling) fails the
# channel: liveness DOWN, the pod restarts from the last committed offset. Contract violations are parked, not retried.
hoops.roster.replica.max-attempts=${ATHLETE_ROSTER_REPLICA_MAX_ATTEMPTS:5}
hoops.roster.replica.first-backoff=PT0.5S
# Dev Services create the topics like compose does (one partition each; infra/compose/redpanda-topics.sh).
quarkus.kafka.devservices.topic-partitions."core.person"=1
quarkus.kafka.devservices.topic-partitions."core.player"=1
quarkus.kafka.devservices.topic-partitions."core.team"=1
quarkus.kafka.devservices.topic-partitions."core.team-player"=1
quarkus.kafka.devservices.topic-partitions."core.team-staff"=1
quarkus.kafka.devservices.topic-partitions."core.guardian-link"=1
quarkus.kafka.devservices.topic-partitions."core.tenant"=1

# ---- training ----
# Fallback tenant time zone while core's /internal/authz does not expose one (see module README, contract gap).
hoops.athlete.default-timezone=Europe/Madrid
hoops.athlete.horizon-weeks=8
# Nightly materialisation (02:15 server time); `off` disables the job.
hoops.athlete.materialise.cron=0 15 2 * * ?

# ---- operations: /q/health (live, ready incl. datasource + informational core reachability), /q/metrics ----
quarkus.smallrye-health.root-path=/q/health
hoops.core.health-timeout=PT1S
hoops.core.health-cache-ttl=PT10S
%test.hoops.core.health-cache-ttl=PT0S

# ---- tests ----
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc-client.discovery-enabled=false
%test.quarkus.oidc-client.token-path=/token
%test.quarkus.oidc-client.credentials.secret=test-only-secret
%test.hoops.athlete.materialise.cron=off
# the consumer runs only in the tests that publish records (ReplicaProfile); their broker is RosterBrokerResource,
# started through ContainerStarts: Kafka Dev Services would start one per Quarkus boot without it (WP82)
%test.hoops.roster.consumer.enabled=false
%test.quarkus.kafka.devservices.enabled=false
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
%test.hoops.security.require-sub=false

# OpenTelemetry (WP86, ADR-0046), build-time keys: the log handler is compiled in (it exports only when the SDK is on,
# QUARKUS_OTEL_SDK_DISABLED=false from the chart) and root spans are sampled at quarkus.otel.traces.sampler.arg (runtime,
# default 1.0; the chart sets global.observability.tracesSampleRatio), children follow their parent.
quarkus.otel.logs.enabled=true
quarkus.otel.traces.sampler=parentbased_traceidratio
