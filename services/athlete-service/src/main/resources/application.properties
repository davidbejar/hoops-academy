# ---- athlete-service ----
quarkus.application.name=athlete-service
quarkus.http.port=8083

# ---- database: the app connects as the NON-owner athlete_app role, Flyway migrates as athlete_migrator ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${ATHLETE_DB_URL:jdbc:postgresql://localhost:5432/hoops}
quarkus.datasource.username=athlete_app
quarkus.datasource.password=${ATHLETE_APP_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=athlete
quarkus.flyway.create-schemas=false
quarkus.flyway.username=athlete_migrator
quarkus.flyway.password=${ATHLETE_MIGRATOR_PASSWORD}
quarkus.hibernate-orm.schema-management.strategy=none
# multitenant=DISCRIMINATOR, stringtype=unspecified and hoops.tenancy.header come from the common-quarkus defaults

# ---- authentication (Keycloak realm academy; tenant roles are NOT in the token, see ADR-0005) ----
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/academy
quarkus.oidc.client-id=athlete-service
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Only access tokens minted for this service (the realm's audience mapper, ADR-0034): another service's token is a 401
quarkus.oidc.token.audience=athlete-service

# ---- service-to-service: client credentials of the athlete-service client (role `service`) ----
quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/academy
quarkus.oidc-client.client-id=athlete-service
quarkus.oidc-client.credentials.secret=${ATHLETE_SERVICE_CLIENT_SECRET}
quarkus.oidc-client.early-tokens-acquisition=false

# ---- core-service (RosterPort adapter), ADR-0008: 2 s timeout, 30 s cache (see CoreRosterAdapter) ----
# common-quarkus' CoreInternalClient (quarkus.rest-client.core.*, 2 s timeouts) and CoreRosterClient cache
# (hoops.core.cache-ttl, 30 s) come from the library defaults; only the base URL is set here.
hoops.core.url=http://localhost:8081

# ---- training ----
# Fallback tenant time zone while core's /internal/authz does not expose one (see module README, contract gap).
hoops.athlete.default-timezone=Europe/Madrid
hoops.athlete.horizon-weeks=8
# Nightly materialisation (02:15 server time); `off` disables the job.
hoops.athlete.materialise.cron=0 15 2 * * ?

# ---- operations: /q/health (live, ready incl. datasource + informational core reachability), /q/metrics ----
quarkus.smallrye-health.root-path=/q/health
hoops.core.health-timeout=PT1S
hoops.core.health-cache-ttl=PT10S
%test.hoops.core.health-cache-ttl=PT0S

# ---- tests ----
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc-client.discovery-enabled=false
%test.quarkus.oidc-client.token-path=/token
%test.quarkus.oidc-client.credentials.secret=test-only-secret
%test.hoops.athlete.materialise.cron=off
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
%test.hoops.security.require-sub=false
