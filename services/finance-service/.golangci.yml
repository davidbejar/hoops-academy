# golangci-lint v2 configuration of finance-service (ADR-0055): the counterpart of SpotBugs and the PMD / CPD gate of
# the Java services and of Clippy in pdf-service. Run by scripts/check.sh (just test-go) and CI's job `go`.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # complexity
    - cyclop
    - gocognit
    - nestif
    - funlen
    # duplication
    - dupl
    # error handling
    - errorlint
    - nilerr
    - wrapcheck
    # database, HTTP and context use
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    # security
    - gosec
    # clarity
    - revive
    - gocritic
    - misspell
    - unparam
    - exhaustive
    - forbidigo
    - nolintlint
  settings:
    cyclop:
      max-complexity: 12
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    funlen:
      lines: 80
      statements: 50
    dupl:
      threshold: 100
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: write through log/slog (JSON on stdout), never to stdout directly
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      # errors of the module's own layers are already meaningful; wrap only what crosses into a library
      ignore-package-globs:
        - hoopsacademy.local/finance/*
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
        - name: unexported-return
          disabled: true
  exclusions:
    generated: lax
    rules:
      # table-driven tests repeat their shape on purpose; fixtures hold fake credentials
      - path: _test\.go
        linters: [dupl, funlen, gosec, wrapcheck, gocognit, cyclop]
      - path: internal/testsupport/
        linters: [wrapcheck, gosec, funlen]

formatters:
  enable:
    - gofmt
