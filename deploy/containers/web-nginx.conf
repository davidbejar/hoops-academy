# Served by nginxinc/nginx-unprivileged (non-root, listens on 8080). The Flutter app uses the hash URL strategy,
# so no SPA rewrites are needed; unknown paths fall back to index.html anyway.
# Headers mirror infra/compose/nginx/web-headers.conf + redirect-headers.conf (an add_header inside a location
# drops the inherited ones, so every location repeats its set). CSP hashes: scripts/csp-hashes.py --check.
# The CSP is same-origin only: the web build uses --no-web-resources-cdn (CanvasKit and fonts are bundled).
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-xv+zVrae4l53W/Eu7Lzq5at54VZX4QP4iGfI24sNZ9c='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Defence in depth: the ingress routes /internal, /auth/admin and /auth/realms/master here (deny routes) so they
  # are never proxied to a service or to Keycloak.
  location /internal { default_type text/plain; return 403 "forbidden\n"; }
  location /auth/ { default_type text/plain; return 403 "forbidden\n"; }

  # Service workers, bootstrap and index must be revalidated on every load so updates roll out.
  location ~* ^/(index\.html|sw\.js|flutter_service_worker\.js|flutter_bootstrap\.js|manifest\.json|version\.json)$ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-xv+zVrae4l53W/Eu7Lzq5at54VZX4QP4iGfI24sNZ9c='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
  }

  # OIDC redirect page: own strict CSP (inline script + style by hash).
  location = /redirect.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-MFQIK43OhlpbRPgsX6PNccWesVXaQb6wsOycvoMfljg='; style-src 'self' 'sha256-QyEhmZ89GEuGqza2NYzDjFmAkZw84oaw7yEg6nHcAw8='; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
