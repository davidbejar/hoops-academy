# Served by nginxinc/nginx-unprivileged (non-root, listens on 8080). The Flutter app uses the hash URL strategy,
# so no SPA rewrites are needed; unknown paths fall back to index.html anyway.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Defence in depth: the ingress routes /internal here so it is never proxied to a service.
  location /internal { default_type text/plain; return 403 "forbidden\n"; }

  # Service worker, bootstrap and index must be revalidated on every load so updates roll out.
  location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|manifest\.json|version\.json)$ {
    # add_header in a location replaces the server-level ones, so repeat them.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
