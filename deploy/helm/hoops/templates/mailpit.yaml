{{- if .Values.mailpit.enabled }}
# Local-only SMTP sink (kind): the realm's SMTP host is `mailhog:1025` (compose name), so the Service keeps that name
# and invitation / password-setup e-mails succeed instead of rolling the invite back. UI: kubectl port-forward
# svc/mailhog 8025. Never enable outside local clusters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  labels: {app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: hoops-academy}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: mailhog}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: hoops-academy}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: {{ printf "%s:%s" .Values.mailpit.image.repository .Values.mailpit.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: MP_MAX_MESSAGES, value: "500"}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: ui, containerPort: 8025}
          readinessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  labels: {app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: hoops-academy}
spec:
  selector: {app.kubernetes.io/name: mailhog}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: ui, port: 8025, targetPort: ui}
---
# SMTP only from pods of this namespace (Keycloak); the UI only via port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailhog
  labels: {app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: hoops-academy}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mailhog}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {port: smtp, protocol: TCP}
        - {port: ui, protocol: TCP}
{{- end }}
