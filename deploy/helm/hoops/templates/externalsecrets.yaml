{{- /*
Secrets from the External Secrets Operator (WP65, ADR-0012 amendment), behind externalSecrets.enabled (default false: the
Secrets are created before the install, on kind by deploy/kind/secrets.sh). One ExternalSecret per Secret the chart
references, producing the same Secret name, type and keys, so no workload changes: ESO reads the values from the
ClusterSecretStore/SecretStore `storeRef` (the platform's secret manager) and writes the Secret; the chart itself still
renders no Secret and no value, only remote key/property names.
target: creationPolicy Owner (the Secret belongs to its ExternalSecret and goes with it), deletionPolicy Retain (a value
deleted at the source leaves the last Secret in place instead of breaking its consumers). template: mergePolicy Merge
keeps the fetched keys and adds the entry's fixed `literals`; an entry with a `template` (the Redis REDIS_AUTH Secret)
gets only the template's keys (Replace), the fetched values being its variables.
*/ -}}
{{- $es := .Values.externalSecrets -}}
{{- if $es.enabled }}
{{- if not $es.storeRef.name }}{{ fail "externalSecrets.storeRef.name is required when externalSecrets.enabled" }}{{ end }}
{{- $labels := dict "app.kubernetes.io/part-of" "hoops-academy" "app.kubernetes.io/component" "secrets" }}
{{- $items := list }}
{{- range $es.secrets }}
{{- $items = append $items . }}
{{- end }}
{{- with $es.rateLimitRedis }}
{{- if .enabled }}
{{- $acl := $.Values.rateLimit.redis.acl }}
{{- if $.Values.rateLimit.redis.enabled }}
{{- /* Password of the Redis ACL user (in-chart ratelimit-redis only). */}}
{{- $items = append $items (dict "name" $acl.passwordSecret.name "data" (dict $acl.passwordSecret.key .property)) }}
{{- end }}
{{- /* REDIS_AUTH (<user>:<password>) of Envoy Gateway's rate limit pods, in their namespace (they read no other). */}}
{{- $auth := printf "%s:{{ .password }}" $acl.user }}
{{- $items = append $items (dict "name" .authSecret.name "namespace" $.Values.rateLimit.redis.clientNamespace "data" (dict "password" .property) "template" (dict .authSecret.key $auth)) }}
{{- end }}
{{- end }}
{{- with $es.events }}
{{- if and .enabled $.Values.events.enabled }}
{{- /* The event broker's logins (WP66, ADR-0036): the superuser and one per events user, basic-auth with username = user. */}}
{{- $props := .properties }}
{{- range prepend $.Values.events.users $.Values.events.superuser }}
{{- $prop := index $props .name | default "" }}
{{- if not $prop }}{{ fail (printf "externalSecrets.events.properties has no entry for the events user %s" .name) }}{{ end }}
{{- $items = append $items (dict "name" .passwordSecret "type" "kubernetes.io/basic-auth" "literals" (dict "username" .name) "data" (dict "password" $prop)) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  {{- with .namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: {kind: {{ $es.storeRef.kind }}, name: {{ $es.storeRef.name }}}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: {{ .type | default "Opaque" }}
      metadata:
        labels:
          {{- toYaml $labels | nindent 10 }}
      {{- if .template }}
      mergePolicy: Replace
      data:
        {{- range $k, $v := .template }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- else }}
      mergePolicy: Merge
      {{- with .literals }}
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
  data:
    {{- $remoteKey := .remoteKey | default $es.remoteKey }}
    {{- range $secretKey, $ref := .data }}
    - secretKey: {{ $secretKey }}
      {{- if kindIs "string" $ref }}
      remoteRef: {key: {{ $remoteKey }}, property: {{ $ref }}}
      {{- else }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
