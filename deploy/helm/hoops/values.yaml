# Hoops Academy umbrella defaults. Environment overlays: values-kind.yaml (committed), values-local.yaml (git-ignored).
# No secret values here: every credential is referenced by Secret name (see ADR-0012).

# Public base URL as the browser sees it (services' CORS allow-list). Keep equal to keycloak.publicUrl.
global:
  publicUrl: http://localhost:8090
  # Pull secrets applied to every service/web pod, e.g. [{name: ghcr-pull}] for private ghcr.io packages
  # (kubectl create secret docker-registry ghcr-pull ... ; the Secret itself is created outside the chart, ADR-0012).
  imagePullSecrets: []
  # Gateway every HTTPRoute of the subcharts attaches to (ADR-0031). namespace: empty = the release namespace.
  # requestTimeout applies to every route rule (Envoy's default is 15 s; ingress-nginx used 60 s proxy timeouts).
  gateway:
    name: hoops
    namespace: ""
    requestTimeout: 60s
  # Mirror of events.enabled for the service subcharts (WP71): a subchart sees only its own values and `global`, so the
  # services' Kafka client hangs off this copy. Always set both (the render fails when they differ).
  events:
    enabled: false

# ---------------------------------------------------------------------------------------------------------------
# Edge (WP36, ADR-0031): Gateway API Gateway implemented by Envoy Gateway (pinned version: deploy/kind/up.sh).
gateway:
  enabled: true
  # GatewayClass of the cluster's Envoy Gateway installation. Normally provided by the cluster (platform team); set
  # gatewayClass.create to render it with this chart (kind does).
  className: envoy-gateway
  gatewayClass:
    create: false
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
  hostname: ""                  # listener hostname; empty = any host
  tls:
    enabled: false              # HTTPS listener on :443 (terminates TLS)
    certificateRefs: []         # [{name: <Secret of type kubernetes.io/tls>}], created outside the chart (ADR-0012)
    # Sent on the HTTPS listener only (ingress-nginx's default on TLS hosts); "" disables (localhost).
    hsts: "max-age=31536000; includeSubDomains"
  clientIPDetection:
    # > 0 behind a load balancer / CDN that appends X-Forwarded-For: rate limits then count the real client IP.
    numTrustedHops: 0
  # Per-Gateway Envoy settings (EnvoyProxy via Gateway.spec.infrastructure.parametersRef). Off: Envoy Gateway defaults
  # (a LoadBalancer Service with a generated name, default proxy resources).
  envoyProxy:
    enabled: false
    serviceName: ""             # fixed Service name in Envoy Gateway's namespace (port-forward target)
    serviceType: LoadBalancer   # LoadBalancer | NodePort | ClusterIP
    nodePorts: {http: 0, https: 0}
    replicas: 1
    resources: {}

# Global rate limits (WP40, ADR-0033): the BackendTrafficPolicies of the token endpoint, the login form and
# events:batch are global, so every Envoy replica shares one counter per client IP. Envoy Gateway's rate limit service
# keeps those counters in Redis; Envoy Gateway itself (installed by the cluster operator, not by this chart) must be
# installed with config.envoyGateway.rateLimit.backend {type: Redis, redis.url: <host:port>} (docs/runbooks/deploy.md).
rateLimit:
  redis:
    # true: this chart runs a small in-memory Redis `ratelimit-redis` (kind). false: an external Redis, whose address
    # is `url` (host:port, what the Envoy Gateway install must point at; the chart only reports it in NOTES).
    enabled: false
    url: ""
    image: {repository: docker.io/library/redis, tag: 8.10.3-alpine, digest: ""}
    runAsUser: 999              # user `redis` of the alpine image
    runAsGroup: 1000
    maxMemory: 24mb             # counters are tiny (one key per client IP, route and minute); LRU beyond that
    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
    # The only clients admitted by the NetworkPolicy: Envoy Gateway's rate limit pods.
    clientNamespace: envoy-gateway-system
    clientPodLabels: {app.kubernetes.io/name: envoy-ratelimit}
    # Redis ACL (WP46, ADR-0033 amendment): the `default` user is off; the only user, `user`, may run just the commands
    # envoyproxy/ratelimit issues (PING, INCRBY, EXPIRE) on the keys of this release's rate limit domains. Its
    # password comes from the Secret `passwordSecret` (created before the install, ADR-0012; kind: deploy/kind/secrets.sh)
    # and is stored in the ACL file only as a SHA-256 hash. Envoy Gateway's rate limit pods log in with REDIS_AUTH =
    # `<user>:<password>` from a Secret in their namespace (docs/runbooks/release.md section 4).
    acl:
      user: ratelimit
      passwordSecret: {name: hoops-ratelimit-redis, key: password}
      # Key pattern of the user. Empty: `<release namespace>/<global.gateway.name>/*`, because the rate limit service's
      # keys start with its domain, which Envoy Gateway sets to the listener name `<namespace>/<gateway>/<listener>`.
      # Set it when the Envoy Gateway install adds a CACHE_KEY_PREFIX to the rate limit service.
      keyPattern: ""

# ---------------------------------------------------------------------------------------------------------------
# Event broker (WP66, ADR-0036): one Redpanda node (StatefulSet `redpanda`, headless Service, 1 persistent volume) for the
# v2 events (ADR-0008: core's outbox -> topics -> replicas in game and athlete, WP67-WP69). Off by default; on in
# values-kind.yaml. Clients: bootstrap redpanda.<namespace>.svc.cluster.local:9092, SASL_PLAINTEXT, SCRAM-SHA-256, one
# user per service (its name = the service's app.kubernetes.io/name label, which the NetworkPolicy admits).
# The services (WP71): with events.enabled each one gets that client (KAFKA_BOOTSTRAP_SERVERS, KAFKA_SECURITY_PROTOCOL,
# KAFKA_SASL_USERNAME = its name, KAFKA_SASL_PASSWORD from Secret hoops-redpanda-<name>, which must be its events.users
# entry); without it core's publisher and the game/athlete consumers are off (<service>.events.offEnv). Switch it together
# with global.events.enabled (the copy the subcharts see).
events:
  enabled: false
  redpanda:
    # Same pin as infra/compose/compose.yaml and the Quarkus Dev Services (libs/common-quarkus); run.sh checks it.
    image:
      repository: docker.io/redpandadata/redpanda
      tag: v26.2.6
      digest: sha256:8b1076e0d61bfceb66594dc01536427ce0b529f8ead35fdab9763ab6085891ce
    runAsUser: 101              # user `redpanda` of the image
    runAsGroup: 101
    smp: 1                      # Seastar shards (cores); one is plenty for seven one-partition topics
    memory: 1G                  # Seastar memory (--memory); keep the container limit about 50 % above it
    logLevel: info
    # true relaxes Redpanda's production checks (memory per core, fsync) for small shared nodes: kind only.
    developerMode: false
    extraArgs: []
    resources: {requests: {cpu: 200m, memory: 1Gi}, limits: {memory: 1536Mi}}
    storage: {size: 5Gi, storageClassName: ""}
    # Cluster properties (scalars): written to .bootstrap.yaml and set again by the bootstrap Job on every install/upgrade.
    clusterConfig:
      kafka_enable_authorization: true   # ACLs enforced (without it any authenticated user may do anything)
      admin_api_require_auth: true       # admin API: superuser basic auth (status endpoints stay open for probes)
      auto_create_topics_enabled: false  # topics only from the bootstrap Job
      enable_metrics_reporter: false     # no usage reports to Redpanda (egress is closed anyway)
      default_topic_replications: 1
  # Superuser for the bootstrap Job and operators (rpk); created by Redpanda at bootstrap. Secret: key `password`.
  superuser: {name: admin, passwordSecret: hoops-redpanda-admin}
  # SCRAM users with prefixed ACLs: produce = write+describe on topics, consume = read+describe on topics, groups =
  # read+describe on consumer groups. Secrets: kubernetes.io/basic-auth with username = name (ADR-0012).
  users:
    - {name: core-service,    passwordSecret: hoops-redpanda-core-service,    produce: [core.]}
    - {name: game-service,    passwordSecret: hoops-redpanda-game-service,    consume: [core.], groups: [game-service.]}
    - {name: athlete-service, passwordSecret: hoops-redpanda-athlete-service, consume: [core.], groups: [athlete-service.]}
  # Topics `<producer>.<aggregate>` (WP19 brief), keyed by `<tenant id>:<aggregate id>`. Compacted: the latest event per
  # key stays, so a replica is rebuilt by replaying from the start; tombstones (deletes) stay 7 days. Same list and settings
  # as infra/compose/redpanda-topics.sh (run.sh checks it).
  topics:
    partitions: 1
    config:
      cleanup.policy: compact
      retention.ms: "-1"
      delete.retention.ms: "604800000"
    names: [core.person, core.player, core.team, core.team-player, core.team-staff, core.guardian-link, core.tenant]

# ---------------------------------------------------------------------------------------------------------------
# Secrets from the External Secrets Operator (WP65, ADR-0012 amendment). false (default): every Secret below exists
# before the install (kind: deploy/kind/secrets.sh from .env). true: the chart renders one ExternalSecret per Secret
# (external-secrets.io/v1, ESO >= 1.0; kind pins the version in deploy/kind/up.sh) and ESO writes the Secrets from
# `storeRef`, with the same names, types and keys, so no workload changes. The ClusterSecretStore/SecretStore (the
# platform's secret manager and ESO's access to it) belongs to the cluster, not to this chart. The chart only names
# remote keys and properties, never values. Not covered: the Gateway's TLS certificate (gateway.tls.certificateRefs,
# usually cert-manager; add an entry with type kubernetes.io/tls and keys tls.crt/tls.key to source it from the store).
externalSecrets:
  enabled: false
  storeRef: {kind: ClusterSecretStore, name: hoops}
  # How often ESO re-reads the source; a rotated value reaches the Secret within this interval (rotate-secrets.md).
  refreshInterval: 1h
  # Remote secret every `data` value below is a property of (one JSON document with one property per value, e.g. an
  # AWS/GCP/Azure secret or a Vault KV entry; the property names are the .env keys). Per entry `remoteKey` overrides it;
  # a `data` value may also be a full remoteRef map ({key, property, version, ...}) for one-value-per-secret stores.
  remoteKey: hoops
  # name: Secret (and ExternalSecret) name; type: Secret type (default Opaque); data: Secret key -> remote property;
  # literals: fixed, non-secret keys added to the fetched ones. CNPG needs kubernetes.io/basic-auth with
  # username = role name (ADR-0012).
  secrets:
    - {name: hoops-db-core-migrator,    type: kubernetes.io/basic-auth, literals: {username: core_migrator},    data: {password: CORE_MIGRATOR_PASSWORD}}
    - {name: hoops-db-core-app,         type: kubernetes.io/basic-auth, literals: {username: core_app},         data: {password: CORE_APP_PASSWORD}}
    - {name: hoops-db-core-platform,    type: kubernetes.io/basic-auth, literals: {username: core_platform},    data: {password: CORE_PLATFORM_PASSWORD}}
    - {name: hoops-db-game-migrator,    type: kubernetes.io/basic-auth, literals: {username: game_migrator},    data: {password: GAME_MIGRATOR_PASSWORD}}
    - {name: hoops-db-game-app,         type: kubernetes.io/basic-auth, literals: {username: game_app},         data: {password: GAME_APP_PASSWORD}}
    - {name: hoops-db-athlete-migrator, type: kubernetes.io/basic-auth, literals: {username: athlete_migrator}, data: {password: ATHLETE_MIGRATOR_PASSWORD}}
    - {name: hoops-db-athlete-app,      type: kubernetes.io/basic-auth, literals: {username: athlete_app},      data: {password: ATHLETE_APP_PASSWORD}}
    - {name: keycloak-db-app,           type: kubernetes.io/basic-auth, literals: {username: keycloak},         data: {password: KC_DB_PASSWORD}}
    - {name: keycloak-admin,             data: {username: KEYCLOAK_ADMIN, password: KEYCLOAK_ADMIN_PASSWORD}}
    - {name: hoops-oidc-core-service,    data: {client-secret: CORE_SERVICE_CLIENT_SECRET}}
    - {name: hoops-oidc-game-service,    data: {client-secret: GAME_SERVICE_CLIENT_SECRET}}
    - {name: hoops-oidc-athlete-service, data: {client-secret: ATHLETE_SERVICE_CLIENT_SECRET}}
  # The rate limit Redis login (WP46) from one remote property: rateLimit.redis.acl.passwordSecret (in-chart Redis only)
  # and, in rateLimit.redis.clientNamespace (Envoy Gateway's namespace), authSecret with
  # `<rateLimit.redis.acl.user>:<password>` (REDIS_AUTH of the envoy-ratelimit pods).
  rateLimitRedis:
    enabled: true
    property: RATELIMIT_REDIS_PASSWORD
    authSecret: {name: envoy-ratelimit-redis-auth, key: auth}
  # The event broker's logins (WP66), only with events.enabled: one kubernetes.io/basic-auth Secret per events user and the
  # superuser (username = the user's name), password from the property named here per user.
  events:
    enabled: true
    properties:
      admin: REDPANDA_ADMIN_PASSWORD
      core-service: REDPANDA_CORE_SERVICE_PASSWORD
      game-service: REDPANDA_GAME_SERVICE_PASSWORD
      athlete-service: REDPANDA_ATHLETE_SERVICE_PASSWORD

databases:
  enabled: true

keycloak:
  enabled: true
  publicUrl: http://localhost:8090

# ---------------------------------------------------------------------------------------------------------------
core:
  enabled: true
  fullnameOverride: core-service
  image: {repository: localhost/hoops/core-service, tag: dev}
  port: 8081
  route:
    paths: [/api/core, /platform]
    health: {enabled: true, prefix: /api/core}
  env:
    CORE_DB_URL: jdbc:postgresql://hoops-db-rw:5432/hoops
    # Browser origin allowed by the services' CORS filter (same-origin through the gateway needs none; keep it
    # equal to the public URL). OpenTelemetry stays off until an OTLP collector exists: set
    # QUARKUS_OTEL_SDK_DISABLED: "false" + QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT in an overlay.
    HOOPS_CORS_ORIGINS: '{{ .Values.global.publicUrl }}'
    QUARKUS_OTEL_SDK_DISABLED: "true"
    OIDC_AUTH_SERVER_URL: http://keycloak:8080/auth/realms/academy
    KEYCLOAK_URL: http://keycloak:8080/auth
    GAME_SERVICE_URL: http://game-service:8082
    ATHLETE_SERVICE_URL: http://athlete-service:8083
  # Without the event broker (events.enabled off) the outbox publisher stops (the outbox still fills; WP67).
  events:
    offEnv: {CORE_OUTBOX_POLL_INTERVAL: "off"}
  secretEnv:
    - {name: CORE_APP_PASSWORD,          secretName: hoops-db-core-app,       key: password}
    - {name: CORE_PLATFORM_PASSWORD,     secretName: hoops-db-core-platform,  key: password}
    - {name: CORE_MIGRATOR_PASSWORD,     secretName: hoops-db-core-migrator,  key: password}
    - {name: CORE_SERVICE_CLIENT_SECRET, secretName: hoops-oidc-core-service, key: client-secret}

game:
  enabled: true
  fullnameOverride: game-service
  image: {repository: localhost/hoops/game-service, tag: dev}
  port: 8082
  route:
    paths: [/api/game]
    health: {enabled: true, prefix: /api/game}
    # Offline devices flush their outbox in bursts; 120/min per IP (global: one counter per calendar minute for all
    # Envoy replicas, ADR-0033) covers a reconnect storm of a bench, but not a flood; 20/s caps the burst around a minute
    # boundary (WP46; a bench flushes its outbox sequentially, one batch of up to 500 events per request). The colon path is matched on the
    # raw path without rewrite; the percent-encoded form (%3A, which Envoy does not decode) is limited too.
    rateLimits:
      - {name: events-batch, path: "/api/game/matches/[^/]+/events(:|%3[Aa])batch", rpm: 120, rps: 20}
  env:
    GAME_DB_URL: jdbc:postgresql://hoops-db-rw:5432/hoops
    # Browser origin allowed by the services' CORS filter (same-origin through the gateway needs none; keep it
    # equal to the public URL). OpenTelemetry stays off until an OTLP collector exists: set
    # QUARKUS_OTEL_SDK_DISABLED: "false" + QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT in an overlay.
    HOOPS_CORS_ORIGINS: '{{ .Values.global.publicUrl }}'
    QUARKUS_OTEL_SDK_DISABLED: "true"
    KEYCLOAK_URL: http://keycloak:8080/auth
    HOOPS_CORE_URL: http://core-service:8081
    GAME_ROSTER_SOURCE: '{{ .Values.rosterSource }}'
  # Where the roster and the authorisation context come from (ADR-0037, WP68): rest = core's /internal API, replica = the
  # local replica fed by core's events (needs events.enabled). The default flips only per ADR-0037 "When rest flips".
  rosterSource: rest
  # Without the event broker the replica consumer is off (no broker warnings in the log).
  events:
    offEnv: {GAME_ROSTER_CONSUMER_ENABLED: "false"}
  secretEnv:
    - {name: GAME_APP_PASSWORD,          secretName: hoops-db-game-app,       key: password}
    - {name: GAME_MIGRATOR_PASSWORD,     secretName: hoops-db-game-migrator,  key: password}
    - {name: GAME_SERVICE_CLIENT_SECRET, secretName: hoops-oidc-game-service, key: client-secret}

athlete:
  enabled: true
  fullnameOverride: athlete-service
  image: {repository: localhost/hoops/athlete-service, tag: dev}
  port: 8083
  route:
    paths: [/api/athlete]
    health: {enabled: true, prefix: /api/athlete}
  env:
    ATHLETE_DB_URL: jdbc:postgresql://hoops-db-rw:5432/hoops
    # Browser origin allowed by the services' CORS filter (same-origin through the gateway needs none; keep it
    # equal to the public URL). OpenTelemetry stays off until an OTLP collector exists: set
    # QUARKUS_OTEL_SDK_DISABLED: "false" + QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT in an overlay.
    HOOPS_CORS_ORIGINS: '{{ .Values.global.publicUrl }}'
    QUARKUS_OTEL_SDK_DISABLED: "true"
    KEYCLOAK_URL: http://keycloak:8080/auth
    HOOPS_CORE_URL: http://core-service:8081
    ATHLETE_ROSTER_SOURCE: '{{ .Values.rosterSource }}'
  # Where the roster and the authorisation context come from (ADR-0037, WP69): rest = core's /internal API, replica = the
  # local replica fed by core's events (needs events.enabled). The default flips only per ADR-0037 "When rest flips".
  rosterSource: rest
  # Without the event broker the replica consumer is off (no broker warnings in the log).
  events:
    offEnv: {ATHLETE_ROSTER_CONSUMER_ENABLED: "false"}
  secretEnv:
    - {name: ATHLETE_APP_PASSWORD,          secretName: hoops-db-athlete-app,       key: password}
    - {name: ATHLETE_MIGRATOR_PASSWORD,     secretName: hoops-db-athlete-migrator,  key: password}
    - {name: ATHLETE_SERVICE_CLIENT_SECRET, secretName: hoops-oidc-athlete-service, key: client-secret}

web:
  enabled: true

# Local SMTP sink named `mailhog` (the realm's SMTP host). Enabled in values-kind.yaml only.
mailpit:
  enabled: false
  image: {repository: docker.io/axllent/mailpit, tag: v1.32.0}
