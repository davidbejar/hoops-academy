# Hoops Academy umbrella defaults. Environment overlays: values-kind.yaml (committed), values-local.yaml (git-ignored).
# No secret values here: every credential is referenced by Secret name (see ADR-0012).

# Public base URL as the browser sees it (services' CORS allow-list). Keep equal to keycloak.publicUrl.
global:
  publicUrl: http://localhost:8090
  # Pull secrets applied to every service/web pod, e.g. [{name: ghcr-pull}] for private ghcr.io packages
  # (kubectl create secret docker-registry ghcr-pull ... ; the Secret itself is created outside the chart, ADR-0012).
  imagePullSecrets: []
  # Gateway every HTTPRoute of the subcharts attaches to (ADR-0031). namespace: empty = the release namespace.
  # requestTimeout applies to every route rule (Envoy's default is 15 s; ingress-nginx used 60 s proxy timeouts).
  gateway:
    name: hoops
    namespace: ""
    requestTimeout: 60s

# ---------------------------------------------------------------------------------------------------------------
# Edge (WP36, ADR-0031): Gateway API Gateway implemented by Envoy Gateway (pinned version: deploy/kind/up.sh).
gateway:
  enabled: true
  # GatewayClass of the cluster's Envoy Gateway installation. Normally provided by the cluster (platform team); set
  # gatewayClass.create to render it with this chart (kind does).
  className: envoy-gateway
  gatewayClass:
    create: false
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
  hostname: ""                  # listener hostname; empty = any host
  tls:
    enabled: false              # HTTPS listener on :443 (terminates TLS)
    certificateRefs: []         # [{name: <Secret of type kubernetes.io/tls>}], created outside the chart (ADR-0012)
    # Sent on the HTTPS listener only (ingress-nginx's default on TLS hosts); "" disables (localhost).
    hsts: "max-age=31536000; includeSubDomains"
  clientIPDetection:
    # > 0 behind a load balancer / CDN that appends X-Forwarded-For: rate limits then count the real client IP.
    numTrustedHops: 0
  # Per-Gateway Envoy settings (EnvoyProxy via Gateway.spec.infrastructure.parametersRef). Off: Envoy Gateway defaults
  # (a LoadBalancer Service with a generated name, default proxy resources).
  envoyProxy:
    enabled: false
    serviceName: ""             # fixed Service name in Envoy Gateway's namespace (port-forward target)
    serviceType: LoadBalancer   # LoadBalancer | NodePort | ClusterIP
    nodePorts: {http: 0, https: 0}
    replicas: 1
    resources: {}

databases:
  enabled: true

keycloak:
  enabled: true
  publicUrl: http://localhost:8090

# ---------------------------------------------------------------------------------------------------------------
core:
  enabled: true
  fullnameOverride: core-service
  image: {repository: localhost/hoops/core-service, tag: dev}
  port: 8081
  route:
    paths: [/api/core, /platform]
    health: {enabled: true, prefix: /api/core}
  env:
    CORE_DB_URL: jdbc:postgresql://hoops-db-rw:5432/hoops
    # Browser origin allowed by the services' CORS filter (same-origin through the gateway needs none; keep it
    # equal to the public URL). OpenTelemetry stays off until an OTLP collector exists: set
    # QUARKUS_OTEL_SDK_DISABLED: "false" + QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT in an overlay.
    HOOPS_CORS_ORIGINS: '{{ .Values.global.publicUrl }}'
    QUARKUS_OTEL_SDK_DISABLED: "true"
    OIDC_AUTH_SERVER_URL: http://keycloak:8080/auth/realms/academy
    KEYCLOAK_URL: http://keycloak:8080/auth
    GAME_SERVICE_URL: http://game-service:8082
    ATHLETE_SERVICE_URL: http://athlete-service:8083
  secretEnv:
    - {name: CORE_APP_PASSWORD,          secretName: hoops-db-core-app,       key: password}
    - {name: CORE_PLATFORM_PASSWORD,     secretName: hoops-db-core-platform,  key: password}
    - {name: CORE_MIGRATOR_PASSWORD,     secretName: hoops-db-core-migrator,  key: password}
    - {name: CORE_SERVICE_CLIENT_SECRET, secretName: hoops-oidc-core-service, key: client-secret}

game:
  enabled: true
  fullnameOverride: game-service
  image: {repository: localhost/hoops/game-service, tag: dev}
  port: 8082
  route:
    paths: [/api/game]
    health: {enabled: true, prefix: /api/game}
    # Offline devices flush their outbox in bursts; 120/min per IP (Envoy: a bucket of 120 refilled every minute)
    # covers a reconnect storm of a bench, but not a flood. The colon path is matched on the raw path without rewrite;
    # the percent-encoded form (%3A, which Envoy does not decode) is limited too.
    rateLimits:
      - {name: events-batch, path: "/api/game/matches/[^/]+/events(:|%3[Aa])batch", rpm: 120}
  env:
    GAME_DB_URL: jdbc:postgresql://hoops-db-rw:5432/hoops
    # Browser origin allowed by the services' CORS filter (same-origin through the gateway needs none; keep it
    # equal to the public URL). OpenTelemetry stays off until an OTLP collector exists: set
    # QUARKUS_OTEL_SDK_DISABLED: "false" + QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT in an overlay.
    HOOPS_CORS_ORIGINS: '{{ .Values.global.publicUrl }}'
    QUARKUS_OTEL_SDK_DISABLED: "true"
    KEYCLOAK_URL: http://keycloak:8080/auth
    HOOPS_CORE_URL: http://core-service:8081
  secretEnv:
    - {name: GAME_APP_PASSWORD,          secretName: hoops-db-game-app,       key: password}
    - {name: GAME_MIGRATOR_PASSWORD,     secretName: hoops-db-game-migrator,  key: password}
    - {name: GAME_SERVICE_CLIENT_SECRET, secretName: hoops-oidc-game-service, key: client-secret}

athlete:
  enabled: true
  fullnameOverride: athlete-service
  image: {repository: localhost/hoops/athlete-service, tag: dev}
  port: 8083
  route:
    paths: [/api/athlete]
    health: {enabled: true, prefix: /api/athlete}
  env:
    ATHLETE_DB_URL: jdbc:postgresql://hoops-db-rw:5432/hoops
    # Browser origin allowed by the services' CORS filter (same-origin through the gateway needs none; keep it
    # equal to the public URL). OpenTelemetry stays off until an OTLP collector exists: set
    # QUARKUS_OTEL_SDK_DISABLED: "false" + QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT in an overlay.
    HOOPS_CORS_ORIGINS: '{{ .Values.global.publicUrl }}'
    QUARKUS_OTEL_SDK_DISABLED: "true"
    KEYCLOAK_URL: http://keycloak:8080/auth
    HOOPS_CORE_URL: http://core-service:8081
  secretEnv:
    - {name: ATHLETE_APP_PASSWORD,          secretName: hoops-db-athlete-app,       key: password}
    - {name: ATHLETE_MIGRATOR_PASSWORD,     secretName: hoops-db-athlete-migrator,  key: password}
    - {name: ATHLETE_SERVICE_CLIENT_SECRET, secretName: hoops-oidc-athlete-service, key: client-secret}

web:
  enabled: true

# Local SMTP sink named `mailhog` (the realm's SMTP host). Enabled in values-kind.yaml only.
mailpit:
  enabled: false
  image: {repository: docker.io/axllent/mailpit, tag: v1.32.0}
