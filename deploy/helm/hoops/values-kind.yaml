# kind (deploy/kind): Envoy Gateway; its Service is a NodePort (30080/30443) that kind maps to host ports 8090 (http)
# and 8453 (https, self-signed certificate created by deploy/kind/up.sh as Secret hoops-gateway-tls).
# Keep requests small: the Podman machine is 2 CPU / 8 GiB and also runs the compose stack.
global:
  publicUrl: http://localhost:8090
gateway:
  gatewayClass: {create: true}
  tls:
    enabled: true
    certificateRefs: [{name: hoops-gateway-tls}]
    hsts: ""                    # never pin HSTS on localhost (it would cover every localhost port)
  envoyProxy:
    enabled: true
    serviceName: hoops-gateway
    serviceType: NodePort
    nodePorts: {http: 30080, https: 30443}
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
keycloak:
  publicUrl: http://localhost:8090
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
core:
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 448Mi}}
game:
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 448Mi}}
athlete:
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 448Mi}}
databases:
  hoopsDb:
    storage: {size: 2Gi}
# Invitation / password-setup e-mails need an SMTP server (core rolls an invite back when the e-mail fails).
mailpit:
  enabled: true
