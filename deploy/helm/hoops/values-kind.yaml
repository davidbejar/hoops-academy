# kind (deploy/kind): Envoy Gateway; its Service is a NodePort (30080/30443) that kind maps to host ports 8090 (http)
# and 8453 (https, self-signed certificate created by deploy/kind/up.sh as Secret hoops-gateway-tls).
# Keep requests small: the Podman machine is 2 CPU / 8 GiB and also runs the compose stack.
global:
  publicUrl: http://localhost:8090
  events: {enabled: true}       # = events.enabled below (the services' Kafka client, WP71)
  reloader: {enabled: true}     # pods roll when a Secret they read changes (Reloader from up.sh, WP87)
  observability: {enabled: true, tracesSampleRatio: "1.0", environment: kind}   # traces + logs to otel-collector (WP86)
gateway:
  gatewayClass: {create: true}
  tls:
    enabled: true
    certificateRefs: [{name: hoops-gateway-tls}]
    hsts: ""                    # never pin HSTS on localhost (it would cover every localhost port)
  envoyProxy:
    enabled: true
    serviceName: hoops-gateway
    serviceType: NodePort
    nodePorts: {http: 30080, https: 30443}
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
# Event broker (WP66, ADR-0036): small Redpanda in developer mode (relaxed memory/fsync checks for the shared 2-CPU VM).
# The services connect to it (WP71): core publishes, game and athlete feed their replicas and read the roster from them
# (roster source replica since decision 66, WP100; --set <game|athlete>.rosterSource=rest rolls one service back).
events:
  enabled: true
  redpanda:
    memory: 512M
    developerMode: true
    resources: {requests: {cpu: 50m, memory: 512Mi}, limits: {memory: 768Mi}}
    storage: {size: 1Gi}
# OpenTelemetry (WP86, ADR-0046): the collector prints every span (trace id) and log record in its log; Jaeger keeps the
# traces in memory (kubectl -n hoops port-forward svc/jaeger 16686, docs/runbooks/observability.md).
observability:
  collector:
    debugVerbosity: normal
  jaeger: {enabled: true}
# Counter store of the global rate limits; deploy/kind/up.sh points Envoy Gateway at ratelimit-redis.hoops:6379.
rateLimit:
  redis: {enabled: true}
keycloak:
  publicUrl: http://localhost:8090
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
core:
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 448Mi}}
game:
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 448Mi}}
athlete:
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 448Mi}}
databases:
  hoopsDb:
    storage: {size: 2Gi}
# Invitation / password-setup e-mails (Keycloak) and core's academy-request decisions (WP90) go to this SMTP sink.
mailpit:
  enabled: true
# deploy/kind/up.sh --eso (WP65) enables externalSecrets against its ClusterSecretStore `hoops`; refresh quickly so a
# rotation at the source shows within a minute (docs/runbooks/rotate-secrets.md).
externalSecrets:
  refreshInterval: 1m
