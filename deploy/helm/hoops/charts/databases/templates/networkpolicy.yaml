{{- if .Values.networkPolicy.enabled }}
# Postgres instances: reachable from pods of this namespace and from the CNPG operator (status port 8000 + 5432).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: databases
  labels:
    {{- include "databases.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: cnpg.io/cluster, operator: Exists}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.operatorNamespace }}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}
{{- end }}
