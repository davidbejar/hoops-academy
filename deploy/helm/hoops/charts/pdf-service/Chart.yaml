apiVersion: v2
name: pdf-service
description: Hoops Academy pdf-service (Rust, ADR-0052) - stateless renderer of printable sheets, internal only (no route).
type: application
version: 0.2.0
appVersion: "1.0.0"
# Shared helpers and templates (ADR-0068). Inside the umbrella the copy under its charts/ serves; rendered alone, run
