{{- if .Values.networkPolicy.enabled }}
# Decision 89: only core and game (by app.kubernetes.io/name, this namespace) reach pdf-service; no gateway, no other pod but
# the chart's collector, which scrapes /q/metrics (WP120).
# Egress: DNS, Keycloak's port (signing keys) and, with the chart's collector, its OTLP HTTP port; nothing else (an
# external collector: networkPolicy.egress.extra). The kubelet's probes are not subject to policies.
{{ include "hoops-lib.networkPolicy" (dict "ctx" . "from" (include "pdf-service.ingressFrom" .) "targets" (list .Values.networkPolicy.egress.keycloak)) }}
{{- end }}
