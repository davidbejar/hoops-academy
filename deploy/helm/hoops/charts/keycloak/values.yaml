fullnameOverride: keycloak
image:
  repository: quay.io/keycloak/keycloak
  tag: "26.8.1"
  pullPolicy: IfNotPresent
# Public base URL as the browser sees it (no trailing slash). Issuer = <publicUrl>/auth/realms/academy.
publicUrl: http://localhost:8090
# Realm JSON redirect URIs / web origins are written for the compose proxy; they are rewritten to publicUrl.
realmSourceUrl: http://localhost:8080
# The realm also allows the Flutter dev server (compose only). Unless allowDevServer, it is rewritten to publicUrl.
devServerUrl: http://localhost:5173
allowDevServer: false
db:
  host: keycloak-db-rw
  port: 5432
  database: keycloak
  # CNPG basic-auth Secret with keys username/password (created by deploy/kind/up.sh).
  existingSecret: keycloak-db-app
admin:
  existingSecret: keycloak-admin          # keys: username, password
# Confidential client secrets substituted into the realm JSON at import (${..._CLIENT_SECRET}).
clientSecrets:
  - {env: CORE_SERVICE_CLIENT_SECRET,    secretName: hoops-oidc-core-service,    key: client-secret}
  - {env: GAME_SERVICE_CLIENT_SECRET,    secretName: hoops-oidc-game-service,    key: client-secret}
  - {env: ATHLETE_SERVICE_CLIENT_SECRET, secretName: hoops-oidc-athlete-service, key: client-secret}
# Gateway API routes (ADR-0031) attached to the umbrella's Gateway (global.gateway.name, default "hoops").
route:
  enabled: true
  hostnames: []
  path: /auth
  # Brute-force / credential-stuffing brake at the edge (Keycloak's brute-force detection is the second layer):
  # the token endpoint and the login form POSTs get their own route with an Envoy Gateway global rate limit of rpm
  # requests per calendar minute per client IP, shared by all Envoy replicas (ADR-0033). Rejections are 429.
  rateLimit:
    enabled: true
    rpm: 60
    paths:
      - /auth/realms/academy/protocol/openid-connect/token
      - /auth/realms/academy/login-actions/authenticate
# The admin console / Admin REST API and the master realm are NOT exposed through the gateway: those paths are
# routed to the web nginx, which answers 403 (same pattern as /internal). Use kubectl port-forward, or set this to
# true in a git-ignored values-local.yaml (e.g. for e2e runs that call the Admin API through the gateway).
exposeAdminConsole: false
adminDenyPaths: [/auth/admin, /auth/realms/master]
denyBackend: {service: web, port: 8080}   # Service name + port number (Gateway API backendRef)
readiness:
  initialDelaySeconds: 60
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 1Gi}
extraJavaOpts: "-XX:MaxRAMPercentage=70.0"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 0
  fsGroup: 0
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  # `start` (non-optimized) re-augments into /opt/keycloak/lib at boot, so the root FS must be writable.
  # Follow-up: a pre-built (`kc.sh build`) image + `start --optimized` allows readOnlyRootFilesystem: true.
  readOnlyRootFilesystem: false
  capabilities: {drop: [ALL]}
networkPolicy:
  enabled: true
  # Namespace of the Envoy proxy pods (Envoy Gateway's controller namespace).
  gatewayNamespace: envoy-gateway-system
