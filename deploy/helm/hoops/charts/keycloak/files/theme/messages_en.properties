# Hoops Academy login theme (ADR-0022), messages that differ from keycloak.v2. ASCII only (non-ASCII letters as unicode escapes).
# accountDisabledMessage: the temporary password sweep (ADR-0028) is the only thing that disables a login, and the
# theme cannot tell other disabled accounts apart, so every disabled login sees this text.
accountDisabledMessage=Your temporary password has expired. Ask your academy administrator for a new one.
# invalidPasswordBlacklistedMessage: the realm's passwordBlacklist policy (ADR-0038), shown when a chosen password is on the list.
invalidPasswordBlacklistedMessage=This password is too common and easy to guess. Choose another one.
