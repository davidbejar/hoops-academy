# Hoops Academy login theme (ADR-0022): Keycloak's keycloak.v2 login pages, restyled to look like the app.
# CSS and one small script (no template overrides) so Keycloak upgrades keep working; follows the look chosen in the
# app, or the browser's dark mode when none was chosen.
# Mounted at /opt/keycloak/themes/hoops (compose volume; Helm ConfigMap, copy kept in sync by scripts/sync-chart-files.sh).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/hoops.css
# The look chosen in the app (light / dark), sent with the sign-in request; without it the browser's dark mode applies.
scripts=js/hoops-theme.js
darkMode=true
locales=es,en,id
