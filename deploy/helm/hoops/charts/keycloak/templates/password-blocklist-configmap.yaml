{{- /* Realm password blocklist (ADR-0038). files/hoops-password-blocklist.txt is a copy of
       infra/keycloak/password-blocklist/hoops-password-blocklist.txt (single source of truth, built by
       scripts/password-blocklist.sh), kept in sync by scripts/sync-chart-files.sh (drift checked by the chart tests).
       About 140 KB: well below the 1 MiB ConfigMap limit. */ -}}
{{- $list := .Files.Get "files/hoops-password-blocklist.txt" -}}
{{- if not $list }}{{ fail "files/hoops-password-blocklist.txt missing (run scripts/sync-chart-files.sh)" }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-password-blocklist
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  hoops-password-blocklist.txt: |
    {{- $list | nindent 4 }}
