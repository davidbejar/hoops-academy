{{- $fullname := include "keycloak.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keycloak.labels" . | nindent 8 }}
      annotations:
        checksum/realm: {{ include (print $.Template.BasePath "/realm-configmap.yaml") . | sha256sum }}
        checksum/theme: {{ include (print $.Template.BasePath "/theme-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: keycloak
          image: {{ printf "%s:%s" .Values.image.repository (toString .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Production mode. Realm import is skipped when the realm already exists (IGNORE_EXISTING).
          args: ["start", "--import-realm"]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL_HOST, value: {{ .Values.db.host | quote }}}
            - {name: KC_DB_URL_PORT, value: {{ .Values.db.port | quote }}}
            - {name: KC_DB_URL_DATABASE, value: {{ .Values.db.database | quote }}}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.db.existingSecret }}, key: username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.db.existingSecret }}, key: password}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.admin.existingSecret }}, key: username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.admin.existingSecret }}, key: password}}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HTTP_RELATIVE_PATH, value: /auth}
            # Frontend URL (issuer) is fixed to the public URL; back-channel (pods -> http://keycloak:8080/auth)
            # uses the request URL so services can fetch JWKS/tokens in-cluster while issuers stay consistent.
            - name: KC_HOSTNAME
              value: {{ printf "%s/auth" .Values.publicUrl | quote }}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "false"}
            - {name: KC_CACHE, value: local}
            - name: JAVA_OPTS_APPEND
              value: {{ .Values.extraJavaOpts | quote }}
            {{- range .Values.clientSecrets }}
            - name: {{ .env }}
              valueFrom: {secretKeyRef: {name: {{ .secretName }}, key: {{ .key }}}}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /auth/health/started, port: management}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /auth/health/ready, port: management}
            initialDelaySeconds: {{ .Values.readiness.initialDelaySeconds }}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /auth/health/live, port: management}
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: theme, mountPath: /opt/keycloak/themes/hoops/login, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: realm
          configMap:
            name: {{ $fullname }}-realm
        # Login theme `hoops` (realm loginTheme), ADR-0022
        - name: theme
          configMap:
            name: {{ $fullname }}-theme
            items:
              - {key: theme.properties, path: theme.properties}
              - {key: hoops.css, path: resources/css/hoops.css}
              - {key: basketball.svg, path: resources/img/basketball.svg}
              - {key: messages_en.properties, path: messages/messages_en.properties}
              - {key: messages_es.properties, path: messages/messages_es.properties}
              - {key: messages_id.properties, path: messages/messages_id.properties}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    # Keycloak responses carry large cookies/headers.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port: {name: http}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.rateLimit.enabled }}
---
# Rate-limited auth endpoints (regex paths; ingress-nginx limits are per Ingress object, per client IP).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-ratelimited
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/limit-rpm: {{ .Values.ingress.rateLimit.rpm | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.rateLimit.burstMultiplier | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range .Values.ingress.rateLimit.paths }}
          - path: {{ . }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullname }}
                port: {name: http}
          {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled (not .Values.exposeAdminConsole) }}
---
# Admin console, Admin REST API and master realm -> the web nginx's 403 location (never proxied to Keycloak).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-admin-deny
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range .Values.adminDenyPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.denyBackend.service }}
                port: {name: {{ $.Values.denyBackend.port }}}
          {{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# The management port (9000, health) is reachable only by the kubelet (probes are not subject to policies).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - podSelector: {}
      ports:
        - {port: http, protocol: TCP}
{{- end }}
