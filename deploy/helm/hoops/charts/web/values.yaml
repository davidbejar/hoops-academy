fullnameOverride: web
image:
  repository: localhost/hoops/web
  tag: dev
  pullPolicy: IfNotPresent
# Pull secrets for a private registry, e.g. [{name: ghcr-pull}]. Falls back to global.imagePullSecrets.
imagePullSecrets: []
replicaCount: 1
port: 8080
# Gateway API route (ADR-0031) attached to the umbrella's Gateway (global.gateway.name, default "hoops").
route:
  enabled: true
  hostnames: []
  # `/` serves the SPA. `/internal` is routed here explicitly and answered with 403 by nginx (portable: no
  # implementation-specific direct response, and the longer prefix beats the catch-all).
  paths: [/]
  denyPaths: [/internal]
resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 64Mi}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
networkPolicy:
  enabled: true
  # Namespace of the Envoy proxy pods (Envoy Gateway's controller namespace).
  gatewayNamespace: envoy-gateway-system
