{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
{{- $targets := list $egress.database $egress.keycloak }}
{{- if include "hoops-lib.eventsEnabled" . }}{{ $targets = append $targets $egress.broker }}{{ end }}
# finance-service is reached only through the gateway (the Envoy proxies in Envoy Gateway's namespace); no pod of this
# namespace calls it (the chart's collector scrapes /q/metrics, WP120). Egress: DNS, Postgres, Keycloak's port (signing keys), Redpanda's Kafka port (with events) and the
# collector's OTLP HTTP port (with the chart's collector); nothing else. The kubelet's probes are not subject to policies.
{{ include "hoops-lib.networkPolicy" (dict "ctx" . "from" (include "finance-service.ingressFrom" .) "targets" $targets) }}
{{- end }}
