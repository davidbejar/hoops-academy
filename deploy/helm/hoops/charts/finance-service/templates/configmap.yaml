{{- /*
Environment of the pod (ADR-0055). Kafka client (WP71 pattern) with global.events.enabled, else the consumer off.
OpenTelemetry (ADR-0046) from global.observability: OTLP HTTP/protobuf (4318) to the umbrella's collector or
global.observability.otlpEndpoint with the gRPC port swapped for 4318; resource attributes without a tenant. env
overrides everything.
*/}}
{{- $env := dict "FINANCE_HTTP_PORT" (toString .Values.port) "FINANCE_DB_URL" .Values.database.url "OIDC_AUTH_SERVER_URL" .Values.oidc.authServerUrl "OIDC_AUDIENCE" .Values.oidc.audience "HOOPS_CORS_ORIGINS" (tpl .Values.corsOrigins .) }}
{{- with .Values.oidc.issuer }}{{ $_ := set $env "OIDC_ISSUER" . }}{{ end }}
{{- if include "hoops-lib.eventsEnabled" . }}
{{- include "hoops-lib.kafkaClientEnv" (dict "env" $env "ctx" . "user" .Values.events.user) }}
{{- else }}
{{- $_ := set $env "FINANCE_ROSTER_CONSUMER_ENABLED" "false" }}
{{- end }}
{{- include "hoops-lib.otlpHttpEnv" (dict "env" $env "ctx" . "serviceNamespace" true) }}
{{- range $k, $v := .Values.env }}
{{- $_ := set $env $k (tpl (toString $v) $) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hoops-lib.fullname" . }}-env
  labels:
    {{- include "hoops-lib.labels" . | nindent 4 }}
data:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
