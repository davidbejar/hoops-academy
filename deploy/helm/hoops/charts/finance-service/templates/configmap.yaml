{{- /*
Environment of the pod (ADR-0055). Kafka client (WP71 pattern) with global.events.enabled, else the consumer off.
OpenTelemetry (ADR-0046) from global.observability: OTLP HTTP/protobuf (4318) to the umbrella's collector or
global.observability.otlpEndpoint with the gRPC port swapped for 4318; resource attributes without a tenant. env
overrides everything.
*/}}
{{- $env := dict "FINANCE_HTTP_PORT" (toString .Values.port) "FINANCE_DB_URL" .Values.database.url "OIDC_AUTH_SERVER_URL" .Values.oidc.authServerUrl "OIDC_AUDIENCE" .Values.oidc.audience "HOOPS_CORS_ORIGINS" (tpl .Values.corsOrigins .) }}
{{- with .Values.oidc.issuer }}{{ $_ := set $env "OIDC_ISSUER" . }}{{ end }}
{{- if include "finance-service.eventsEnabled" . }}
{{- $_ := set $env "KAFKA_BOOTSTRAP_SERVERS" (printf "redpanda.%s.svc.cluster.local:9092" .Release.Namespace) }}
{{- $_ := set $env "KAFKA_SECURITY_PROTOCOL" "SASL_PLAINTEXT" }}
{{- $_ := set $env "KAFKA_SASL_USERNAME" .Values.events.user }}
{{- else }}
{{- $_ := set $env "FINANCE_ROSTER_CONSUMER_ENABLED" "false" }}
{{- end }}
{{- $obs := dig "observability" dict (.Values.global | default dict) }}
{{- if $obs.enabled }}
{{- $endpoint := printf "http://otel-collector.%s.svc.cluster.local:4318" .Release.Namespace }}
{{- with $obs.otlpEndpoint }}{{ $endpoint = replace ":4317" ":4318" . }}{{ end }}
{{- $_ := set $env "OTEL_SDK_DISABLED" "false" }}
{{- $_ := set $env "OTEL_EXPORTER_OTLP_ENDPOINT" $endpoint }}
{{- $_ := set $env "OTEL_TRACES_SAMPLER_ARG" (toString ($obs.tracesSampleRatio | default "0.1")) }}
{{- $_ := set $env "OTEL_RESOURCE_ATTRIBUTES" (printf "service.namespace=hoops-academy,deployment.environment.name=%s,k8s.namespace.name=%s" ($obs.environment | default .Release.Namespace) .Release.Namespace) }}
{{- else }}
{{- $_ := set $env "OTEL_SDK_DISABLED" "true" }}
{{- end }}
{{- range $k, $v := .Values.env }}
{{- $_ := set $env $k (tpl (toString $v) $) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finance-service.fullname" . }}-env
  labels:
    {{- include "finance-service.labels" . | nindent 4 }}
data:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
