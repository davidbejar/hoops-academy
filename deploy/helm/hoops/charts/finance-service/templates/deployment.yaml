{{- $fullname := include "finance-service.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "finance-service.labels" . | nindent 4 }}
  {{- if dig "reloader" "enabled" false (.Values.global | default dict) }}
  annotations:
    # Stakater Reloader (WP87, ADR-0012): roll the pods when a Secret they read changes (ESO refresh, secrets.sh).
    secret.reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "finance-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "finance-service.labels" . | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        prometheus.io/port: {{ .Values.port | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with (default (.Values.global | default dict).imagePullSecrets .Values.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $fullname }}
          image: {{ include "finance-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-env
          # Secrets created before the install (ADR-0012): the database roles' and, with events, the broker user's.
          env:
            - name: FINANCE_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.database.appSecret }}, key: password}}
            - name: FINANCE_MIGRATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.database.migratorSecret }}, key: password}}
            {{- if include "finance-service.eventsEnabled" . }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.events.passwordSecret }}, key: password}}
            {{- end }}
          {{- with .Values.probes }}
          startupProbe:
            httpGet: {path: {{ .startup.path }}, port: http}
            periodSeconds: {{ .startup.periodSeconds }}
            failureThreshold: {{ .startup.failureThreshold }}
            timeoutSeconds: {{ .startup.timeoutSeconds }}
          livenessProbe:
            httpGet: {path: {{ .liveness.path }}, port: http}
            periodSeconds: {{ .liveness.periodSeconds }}
            failureThreshold: {{ .liveness.failureThreshold }}
            timeoutSeconds: {{ .liveness.timeoutSeconds }}
          readinessProbe:
            httpGet: {path: {{ .readiness.path }}, port: http}
            periodSeconds: {{ .readiness.periodSeconds }}
            failureThreshold: {{ .readiness.failureThreshold }}
            timeoutSeconds: {{ .readiness.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
