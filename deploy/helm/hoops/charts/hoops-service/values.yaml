# Defaults for one Quarkus service. The umbrella chart (deploy/helm/hoops) sets per-service values.
fullnameOverride: ""           # resource name and in-cluster DNS name, e.g. core-service
image:
  repository: localhost/hoops/service
  tag: dev
  pullPolicy: IfNotPresent
# Pull secrets for a private registry, e.g. [{name: ghcr-pull}]. Falls back to global.imagePullSecrets.
imagePullSecrets: []
replicaCount: 1
port: 8080

# Non-secret configuration -> ConfigMap -> envFrom. The chart adds the OpenTelemetry keys (QUARKUS_OTEL_*, from
# global.observability, WP86) before env, so env may override them.
env: {}
# Secret values injected as env vars: [{name: ENV_VAR, secretName: <existing Secret>, key: <key>, optional: false}].
# optional: true (WP100) lets the pod start without that Secret or key (the variable is then unset).
# Secrets are created outside the chart (deploy/kind/up.sh, Tilt, or External Secrets Operator, see ADR-0012).
secretEnv: []
# Optional: an existing Secret whose keys all become env vars (envFrom).
existingSecret: ""

# Event broker client (WP71, ADR-0036), switched by global.events.enabled (the umbrella's mirror of events.enabled). On:
# KAFKA_BOOTSTRAP_SERVERS=redpanda.<namespace>.svc.cluster.local:9092, KAFKA_SECURITY_PROTOCOL=SASL_PLAINTEXT,
# KAFKA_SASL_USERNAME=<fullname> and KAFKA_SASL_PASSWORD from Secret hoops-redpanda-<fullname> (key password); env and
# secretEnv may not set KAFKA_* then. Off: offEnv (e.g. the switches that stop a publisher or consumer), which env overrides.
events:
  offEnv: {}

# Gateway API routes (ADR-0031) attached to the umbrella's Gateway (global.gateway.name, default "hoops").
route:
  enabled: true
  hostnames: []                 # empty = the Gateway listener's hostname (any host on kind)
  paths: []                     # path prefixes routed to this service, one HTTPRoute each, e.g. [/api/game]
  # Exposes <prefix>/q/health[/live|ready|started] -> /q/health... (exact matches + full-path rewrite). Off by default.
  health:
    enabled: false
    prefix: ""
  # Rate-limited paths, each its own HTTPRoute + Envoy Gateway BackendTrafficPolicy (global limit per client IP,
  # ADR-0033): [{name, path (RE2 regex on the raw path), rpm, rps}]. At most rpm requests per calendar minute and, when
  # rps is set, at most rps per second (burst cap, WP46), counted by Envoy Gateway's rate limit service in Redis for all
  # Envoy replicas together.
  rateLimits: []

# Prometheus scrape annotations on the pod (/q/metrics on the service port; never routed by the gateway).
metrics:
  enabled: true
  path: /q/metrics

probes:
  # http = SmallRye Health endpoints (needs quarkus-smallrye-health); tcp = port check only (fallback).
  mode: http
  startup:   {path: /q/health/started, periodSeconds: 5, failureThreshold: 60, timeoutSeconds: 3}
  liveness:  {path: /q/health/live,    periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
  readiness: {path: /q/health/ready,   periodSeconds: 5,  failureThreshold: 3, timeoutSeconds: 3}

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185
  runAsGroup: 0
  fsGroup: 0
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

networkPolicy:
  enabled: true
  # Namespace of the Envoy proxy pods (Envoy Gateway's controller namespace; not the Gateway's namespace).
  gatewayNamespace: envoy-gateway-system

pdb:
  enabled: false
  minAvailable: 1

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
