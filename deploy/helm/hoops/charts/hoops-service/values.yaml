# Defaults for one Quarkus service. The umbrella chart (deploy/helm/hoops) sets per-service values.
fullnameOverride: ""           # resource name and in-cluster DNS name, e.g. core-service
image:
  repository: localhost/hoops/service
  tag: dev
  pullPolicy: IfNotPresent
# Pull secrets for a private registry, e.g. [{name: ghcr-pull}]. Falls back to global.imagePullSecrets.
imagePullSecrets: []
replicaCount: 1
port: 8080

# Non-secret configuration -> ConfigMap -> envFrom.
env: {}
# Secret values injected as env vars: [{name: ENV_VAR, secretName: <existing Secret>, key: <key>}].
# Secrets are created outside the chart (deploy/kind/up.sh, Tilt, or External Secrets Operator, see ADR-0012).
secretEnv: []
# Optional: an existing Secret whose keys all become env vars (envFrom).
existingSecret: ""

# Gateway API routes (ADR-0031) attached to the umbrella's Gateway (global.gateway.name, default "hoops").
route:
  enabled: true
  hostnames: []                 # empty = the Gateway listener's hostname (any host on kind)
  paths: []                     # path prefixes routed to this service, one HTTPRoute each, e.g. [/api/game]
  # Exposes <prefix>/q/health[/live|ready|started] -> /q/health... (exact matches + full-path rewrite). Off by default.
  health:
    enabled: false
    prefix: ""
  # Rate-limited paths, each its own HTTPRoute + Envoy Gateway BackendTrafficPolicy (local limit per client IP):
  # [{name, path (RE2 regex on the raw path), rpm}]. Envoy's bucket holds rpm tokens and refills every minute.
  rateLimits: []

# Prometheus scrape annotations on the pod (/q/metrics on the service port; never routed by the gateway).
metrics:
  enabled: true
  path: /q/metrics

probes:
  # http = SmallRye Health endpoints (needs quarkus-smallrye-health); tcp = port check only (fallback).
  mode: http
  startup:   {path: /q/health/started, periodSeconds: 5, failureThreshold: 60, timeoutSeconds: 3}
  liveness:  {path: /q/health/live,    periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
  readiness: {path: /q/health/ready,   periodSeconds: 5,  failureThreshold: 3, timeoutSeconds: 3}

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185
  runAsGroup: 0
  fsGroup: 0
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

networkPolicy:
  enabled: true
  # Namespace of the Envoy proxy pods (Envoy Gateway's controller namespace; not the Gateway's namespace).
  gatewayNamespace: envoy-gateway-system

pdb:
  enabled: false
  minAvailable: 1

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
