{{- if .Values.networkPolicy.enabled }}
# Only the Envoy Gateway proxies and pods of this namespace may reach the service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hoops-service.fullname" . }}
  labels:
    {{- include "hoops-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hoops-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP
{{- end }}
