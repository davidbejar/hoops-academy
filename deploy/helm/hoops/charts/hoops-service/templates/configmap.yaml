apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hoops-service.fullname" . }}-env
  labels:
    {{- include "hoops-service.labels" . | nindent 4 }}
data:
  QUARKUS_HTTP_PORT: {{ .Values.port | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ tpl (toString $v) $ | quote }}
  {{- end }}
