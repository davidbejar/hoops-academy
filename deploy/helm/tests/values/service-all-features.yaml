# Exercises every optional feature of the reusable hoops-service chart.
fullnameOverride: demo-service
image: {repository: localhost/hoops/demo-service, tag: "1.2.3"}
port: 8099
replicaCount: 2
env:
  DEMO_URL: http://example.invalid
secretEnv:
  - {name: DEMO_PASSWORD, secretName: demo-db, key: password}
  - {name: DEMO_OPTIONAL, secretName: demo-optional, key: token, optional: true}   # WP100: may be absent
existingSecret: demo-extra
route:
  hostnames: [hoops.example.test]
  paths: [/api/demo, /platform]
  health: {enabled: true, prefix: /api/demo}
  rateLimits:
    - {name: batch, path: "/api/demo/items/[^/]+/things(:|%3[Aa])batch", rpm: 120, rps: 20}
    - {name: plain, path: /api/demo/slow, rpm: 10}
pdb: {enabled: true, minAvailable: 1}
hpa: {enabled: true, minReplicas: 2, maxReplicas: 4}
metrics: {enabled: true, path: /q/metrics}
# Event broker client (WP71): on through the umbrella's mirror global.events.enabled; offEnv applies only when off.
global: {events: {enabled: true}, reloader: {enabled: true}, observability: {enabled: true, tracesSampleRatio: "0.25"}}   # reloader: WP87, observability: WP86
events: {offEnv: {DEMO_EVENTS: "off"}}
