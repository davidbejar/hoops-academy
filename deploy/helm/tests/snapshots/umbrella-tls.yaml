# Source: hoops/charts/keycloak/templates/keycloak.yaml
# Gateway API route (ADR-0031). Keycloak's large cookies/headers fit Envoy's default 60 KiB header limits (ingress-nginx
# needed proxy-buffer-size 128k for its 4k default).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: identity
    app.kubernetes.io/version: "26.8.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: keycloak-0.6.0
spec:
  parentRefs:
    - name: hoops
  rules:
    - matches:
        - path: {type: PathPrefix, value: "/auth"}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set: [{name: X-Forwarded-Host, value: "hoops.example.test"}]
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"}
              - {name: Cross-Origin-Opener-Policy, value: same-origin}
              - {name: Cross-Origin-Resource-Policy, value: same-origin}
      backendRefs:
        - {name: keycloak, port: 8080}
      timeouts: {request: 60s}
