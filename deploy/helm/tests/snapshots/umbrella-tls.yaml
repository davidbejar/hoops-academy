# Source: hoops/charts/athlete/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: athlete-service
  labels:
    app.kubernetes.io/name: athlete-service
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: athlete-0.9.0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: athlete-service
      app.kubernetes.io/instance: hoops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: athlete-service
        app.kubernetes.io/instance: hoops
        app.kubernetes.io/part-of: hoops-academy
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: athlete-0.9.0
      annotations:
        checksum/env: 7024e23f4675fee1a82ce732d485685c61a87e2420b41859a731ff34154a1a1b
        prometheus.io/scrape: "true"
        prometheus.io/path: "/q/metrics"
        prometheus.io/port: "8083"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: athlete-service
          image: "localhost/hoops/athlete-service:dev"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: athlete-service-env
          env:
            - name: ATHLETE_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hoops-db-athlete-app
                  key: password
            - name: ATHLETE_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hoops-db-athlete-migrator
                  key: password
            - name: ATHLETE_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hoops-oidc-athlete-service
                  key: client-secret
          startupProbe:
            httpGet: {path: /q/health/started, port: http}
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /q/health/live, port: http}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /q/health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
