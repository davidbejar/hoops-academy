# Source: hoops/templates/gateway.yaml
# Client-side settings of the http listener (one policy per listener: a policy for a listener replaces one for
# the whole Gateway instead of merging). Client-supplied X-Forwarded-Host/-Port are dropped (ingress-nginx overwrote
# them; Keycloak trusts X-Forwarded-* headers).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: hoops-http
  labels: {app.kubernetes.io/part-of: hoops-academy, app.kubernetes.io/managed-by: Helm}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: hoops, sectionName: http}
  headers:
    earlyRequestHeaders:
      remove: [X-Forwarded-Host, X-Forwarded-Port]
  # Behind a load balancer: the client IP (rate limits, logs) is taken from X-Forwarded-For, trusting 1 hop(s).
  clientIPDetection:
    xForwardedFor: {numTrustedHops: 1}
---
# Source: hoops/templates/gateway.yaml
# Client-side settings of the https listener (one policy per listener: a policy for a listener replaces one for
# the whole Gateway instead of merging). Client-supplied X-Forwarded-Host/-Port are dropped (ingress-nginx overwrote
# them; Keycloak trusts X-Forwarded-* headers).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: hoops-https
  labels: {app.kubernetes.io/part-of: hoops-academy, app.kubernetes.io/managed-by: Helm}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: hoops, sectionName: https}
  headers:
    earlyRequestHeaders:
      remove: [X-Forwarded-Host, X-Forwarded-Port]
    lateResponseHeaders:
      set:
        - {name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains"}
  # Behind a load balancer: the client IP (rate limits, logs) is taken from X-Forwarded-For, trusting 1 hop(s).
  clientIPDetection:
    xForwardedFor: {numTrustedHops: 1}
