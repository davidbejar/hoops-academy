apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: identity
    app.kubernetes.io/version: "26.8.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: keycloak-0.6.0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: hoops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: hoops
        app.kubernetes.io/part-of: hoops-academy
        app.kubernetes.io/component: identity
        app.kubernetes.io/version: "26.8.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: keycloak-0.6.0
      annotations:
        checksum/realm: 38be36f16d450921f2f30c384b26173a87c4f6d22daa639809d03d0f566a048a
        checksum/theme: 234dbb1152427dd6841b0afcf2214e385023c0b143c0acdee14a3f56236bf97b
        checksum/blocklist: 378b87a315d049e319c435567e532dc036cc495d87ebc51adbd3d3b14403cd81
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak:26.8.2"
          imagePullPolicy: IfNotPresent
          # Production mode. Realm import is skipped when the realm already exists (IGNORE_EXISTING).
          args: ["start", "--import-realm"]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL_HOST, value: "keycloak-db-rw"}
            - {name: KC_DB_URL_PORT, value: "5432"}
            - {name: KC_DB_URL_DATABASE, value: "keycloak"}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-db-app, key: username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db-app, key: password}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: password}}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HTTP_RELATIVE_PATH, value: /auth}
            # Frontend URL (issuer) is fixed to the public URL; back-channel (pods -> http://keycloak:8080/auth)
            # uses the request URL so services can fetch JWKS/tokens in-cluster while issuers stay consistent.
            - name: KC_HOSTNAME
              value: "https://hoops.example.test/auth"
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "false"}
            - {name: KC_CACHE, value: local}
            # Password blocklist (ADR-0038): Keycloak keeps it in a Bloom filter; at its default false-positive rate
            # of 1e-4 one temporary password in 10,000 would be refused although it is on no list.
            - {name: KC_SPI_PASSWORD_POLICY__PASSWORD_BLACKLIST__FALSE_POSITIVE_PROBABILITY, value: "1e-12"}
            # Security events (ADR-0043): successful logins at INFO (Keycloak's default DEBUG drops them)
            - {name: KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL, value: info}
            - name: JAVA_OPTS_APPEND
              value: "-XX:MaxRAMPercentage=70.0"
            - name: CORE_SERVICE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: hoops-oidc-core-service, key: client-secret}}
            - name: GAME_SERVICE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: hoops-oidc-game-service, key: client-secret}}
            - name: ATHLETE_SERVICE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: hoops-oidc-athlete-service, key: client-secret}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /auth/health/started, port: management}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /auth/health/ready, port: management}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /auth/health/live, port: management}
            periodSeconds: 15
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: theme, mountPath: /opt/keycloak/themes/hoops/login, readOnly: true}
            # realm passwordPolicy passwordBlacklist(hoops-password-blocklist.txt), ADR-0038
            - {name: password-blocklist, mountPath: /opt/keycloak/data/password-blacklists, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        # Login theme `hoops` (realm loginTheme), ADR-0022
        - name: theme
          configMap:
            name: keycloak-theme
            items:
              - {key: theme.properties, path: theme.properties}
              - {key: hoops.css, path: resources/css/hoops.css}
              - {key: hoops-theme.js, path: resources/js/hoops-theme.js}
              - {key: basketball.svg, path: resources/img/basketball.svg}
              - {key: messages_en.properties, path: messages/messages_en.properties}
              - {key: messages_es.properties, path: messages/messages_es.properties}
              - {key: messages_id.properties, path: messages/messages_id.properties}
        - name: password-blocklist
          configMap:
            name: keycloak-password-blocklist
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
