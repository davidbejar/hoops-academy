# Jaeger v2 all-in-one with its in-memory store (cloud): traces only, lost on restart, capped at maxTraces.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  labels:
    app.kubernetes.io/component: trace-store
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: hoops-academy
data:
  config.yaml: |
    extensions:
      jaeger_storage:
        backends:
          memstore:
            memory: {max_traces: 5000}
      jaeger_query:
        storage: {traces: memstore}
        http: {endpoint: "0.0.0.0:16686"}
        grpc: {endpoint: "127.0.0.1:16685"}
      healthcheckv2:
        use_v2: true
        http: {endpoint: "0.0.0.0:13133"}
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: "0.0.0.0:4317"}
    processors:
      batch: {}
    exporters:
      jaeger_storage_exporter: {trace_storage: memstore}
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      telemetry:
        logs: {level: info}
        metrics: {level: none}
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [jaeger_storage_exporter]}
