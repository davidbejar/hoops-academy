data:
  basketball.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><!-- Material Icons "sports_basketball" (Apache-2.0), the app's logo icon --><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM5.23 7.75C6.1 8.62 6.7 9.74 6.91 11H4.07c.17-1.24.6-2.31 1.16-3.25zM4.07 13h2.84c-.21 1.26-.81 2.38-1.68 3.25-.56-.94-.99-2.01-1.16-3.25zM11 19.93c-1.73-.22-3.29-1-4.49-2.14 1.3-1.24 2.19-2.91 2.42-4.79H11v6.93zM11 11H8.93C8.69 9.12 7.81 7.44 6.5 6.2c1.2-1.13 2.76-1.92 4.5-2.13V11zm8.93 0h-2.84c.21-1.26.81-2.38 1.68-3.25.56.94.99 2.01 1.16 3.25zM13 4.07c1.73.22 3.29.99 4.5 2.13-1.31 1.24-2.19 2.92-2.43 4.8H13V4.07zm0 15.86V13h2.07c.24 1.88 1.12 3.55 2.42 4.79-1.2 1.15-2.76 1.92-4.49 2.14zm5.77-3.68c-.87-.86-1.46-1.99-1.68-3.25h2.84c-.17 1.24-.6 2.31-1.16 3.25z"/></svg>
    
  hoops.css: |
    /*
     * Hoops Academy login theme: makes Keycloak's keycloak.v2 pages look like the Flutter app.
     * Colours are the app's Material 3 scheme from its seed colour #E8590C (apps/web/lib/app/theme.dart,
     * ColorScheme.fromSeed), light and dark. Loaded after keycloak.v2's styles.css (theme.properties).
     */
    :root {
      --hoops-primary: #8e4d31;
      --hoops-on-primary: #ffffff;
      --hoops-primary-hover: #71361c;
      --hoops-surface: #fff8f6;
      --hoops-card: #fceae4;
      --hoops-field: #fff8f6;
      --hoops-on-surface: #231a16;
      --hoops-on-surface-variant: #53433e;
      --hoops-outline: #85736d;
      --hoops-font: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    
      --keycloak-bg-logo-url: none;
      --keycloak-card-top-color: var(--hoops-primary);
    }
    
    /* keycloak.v2 adds this class to <html> when the browser prefers dark (darkMode=true), like the app. */
    html.pf-v5-theme-dark {
      --hoops-primary: #ffb598;
      --hoops-on-primary: #552008;
      --hoops-primary-hover: #ffdbce;
      --hoops-surface: #1a110e;
      --hoops-card: #271e1a;
      --hoops-field: #322824;
      --hoops-on-surface: #f1dfd9;
      --hoops-on-surface-variant: #d8c2ba;
      --hoops-outline: #a08d86;
    }
    
    :root,
    html.pf-v5-theme-dark {
      --pf-v5-global--FontFamily--text: var(--hoops-font);
      --pf-v5-global--FontFamily--heading: var(--hoops-font);
      --pf-v5-global--primary-color--100: var(--hoops-primary);
      --pf-v5-global--primary-color--200: var(--hoops-primary-hover);
      --pf-v5-global--link--Color: var(--hoops-primary);
      --pf-v5-global--link--Color--hover: var(--hoops-primary-hover);
      --pf-v5-global--Color--100: var(--hoops-on-surface);
      --pf-v5-global--Color--200: var(--hoops-on-surface-variant);
      --pf-v5-global--BackgroundColor--100: var(--hoops-card);
      --pf-v5-global--BorderColor--100: var(--hoops-outline);
    }
    
    /* PatternFly sets the button variables on .pf-v5-c-button itself (dark: `:where(.pf-v5-theme-dark) .pf-v5-c-button`),
       so they are overridden there, not on :root; this sheet loads last and :where() adds no specificity. */
    .pf-v5-c-button {
      --pf-v5-c-button--m-primary--BackgroundColor: var(--hoops-primary);
      --pf-v5-c-button--m-primary--hover--BackgroundColor: var(--hoops-primary-hover);
      --pf-v5-c-button--m-primary--focus--BackgroundColor: var(--hoops-primary-hover);
      --pf-v5-c-button--m-primary--active--BackgroundColor: var(--hoops-primary-hover);
      --pf-v5-c-button--m-primary--Color: var(--hoops-on-primary);
      --pf-v5-c-button--m-primary--hover--Color: var(--hoops-on-primary);
      --pf-v5-c-button--m-primary--focus--Color: var(--hoops-on-primary);
      --pf-v5-c-button--m-primary--active--Color: var(--hoops-on-primary);
      --pf-v5-c-button--BorderRadius: 12px;
    }
    
    html.login-pf,
    .login-pf body,
    .pf-v5-c-login {
      background: var(--hoops-surface);
      color: var(--hoops-on-surface);
    }
    
    .pf-v5-c-login__main {
      background-color: var(--hoops-card);
      border-radius: 20px;
      overflow: hidden;
    }
    
    /* Brand: the app's basketball icon over "Hoops Academy" (realm displayName), not the Keycloak logo text. */
    #kc-header-wrapper {
      color: var(--hoops-on-surface) !important;
      text-transform: none;
      letter-spacing: normal;
      font-size: 1.75rem;
      font-weight: 400;
    }
    
    #kc-header-wrapper::before {
      content: "";
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      background-color: var(--hoops-primary);
      -webkit-mask: url("../img/basketball.svg") center / contain no-repeat;
      mask: url("../img/basketball.svg") center / contain no-repeat;
    }
    
    /* Comfortable tap targets on a phone (the app's 48 px minimum). */
    .pf-v5-c-button.pf-m-primary {
      min-height: 48px;
    }
    
    /* Fields: the app's surface tones and a primary focus line instead of PatternFly's grey and blue. */
    .pf-v5-c-form-control {
      --pf-v5-c-form-control--BackgroundColor: var(--hoops-field);
      --pf-v5-c-form-control--hover--after--BorderBottomColor: var(--hoops-primary);
      --pf-v5-c-form-control--focus--after--BorderBottomColor: var(--hoops-primary);
      border-radius: 8px;
    }
    
    .login-pf :focus-visible {
      outline-color: var(--hoops-primary);
    }
    
    /* Mobile first: the card fills a phone screen edge to edge. */
    @media (max-width: 575px) {
      .pf-v5-c-login__main {
        border-radius: 0;
      }
    }
    
  theme.properties: |
    # Hoops Academy login theme (ADR-0022): Keycloak's keycloak.v2 login pages, restyled to look like the app.
    # CSS only (no template overrides) so Keycloak upgrades keep working; follows the browser's dark mode like the app.
    # Mounted at /opt/keycloak/themes/hoops (compose volume; Helm ConfigMap, copy kept in sync by scripts/sync-chart-files.sh).
    parent=keycloak.v2
    import=common/keycloak
    
    styles=css/styles.css css/hoops.css
    darkMode=true
    locales=es,en,id
    

