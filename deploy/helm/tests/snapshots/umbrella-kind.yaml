# Source: hoops/charts/keycloak/templates/keycloak.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: identity
    app.kubernetes.io/version: "26.8.1"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: keycloak-0.1.0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: hoops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: hoops
        app.kubernetes.io/part-of: hoops-academy
        app.kubernetes.io/component: identity
        app.kubernetes.io/version: "26.8.1"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: keycloak-0.1.0
      annotations:
        checksum/realm: 3d712da4073315f02043cab3f35237099c040c5550ded7acb1cf7cb79c08a37c
        checksum/theme: d75dda9e05580bf4ccba2210d3a3830b5b0fc8965d3b674e7569f75929425551
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak:26.8.1"
          imagePullPolicy: IfNotPresent
          # Production mode. Realm import is skipped when the realm already exists (IGNORE_EXISTING).
          args: ["start", "--import-realm"]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL_HOST, value: "keycloak-db-rw"}
            - {name: KC_DB_URL_PORT, value: "5432"}
            - {name: KC_DB_URL_DATABASE, value: "keycloak"}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-db-app, key: username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db-app, key: password}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: password}}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HTTP_RELATIVE_PATH, value: /auth}
            # Frontend URL (issuer) is fixed to the public URL; back-channel (pods -> http://keycloak:8080/auth)
            # uses the request URL so services can fetch JWKS/tokens in-cluster while issuers stay consistent.
            - name: KC_HOSTNAME
              value: "http://localhost:8090/auth"
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "false"}
            - {name: KC_CACHE, value: local}
            - name: JAVA_OPTS_APPEND
              value: "-XX:MaxRAMPercentage=70.0"
            - name: CORE_SERVICE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: hoops-oidc-core-service, key: client-secret}}
            - name: GAME_SERVICE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: hoops-oidc-game-service, key: client-secret}}
            - name: ATHLETE_SERVICE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: hoops-oidc-athlete-service, key: client-secret}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /auth/health/started, port: management}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /auth/health/ready, port: management}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /auth/health/live, port: management}
            periodSeconds: 15
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: theme, mountPath: /opt/keycloak/themes/hoops/login, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        # Login theme `hoops` (realm loginTheme), ADR-0022
        - name: theme
          configMap:
            name: keycloak-theme
            items:
              - {key: theme.properties, path: theme.properties}
              - {key: hoops.css, path: resources/css/hoops.css}
              - {key: basketball.svg, path: resources/img/basketball.svg}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}

