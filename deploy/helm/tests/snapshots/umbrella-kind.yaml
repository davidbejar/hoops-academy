# Source: hoops/charts/game/templates/ingress.yaml
# Rate-limited path (ingress-nginx per-IP limit; a separate Ingress because limits apply per Ingress object).
# The regex path is matched against the request URI; no rewrite, so the colon of ":batch" reaches the service as-is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-service-events-batch
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: game-0.1.0
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/limit-rpm: "120"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  rules:
    -
      http:
        paths:
          - path: /api/game/matches/[^/]+/events:batch
            pathType: ImplementationSpecific
            backend:
              service:
                name: game-service
                port: {name: http}

