# Redis (one-minute window shared by every Envoy replica). Over the limit: 429. Unreachable Redis: fail open (ADR-0033).
# Plus a burst cap of 2 requests per second per client IP, so the fixed minute windows cannot pass 2 x 10 in a
# few seconds around a minute boundary (WP46, ADR-0033 amendment).
