apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: identity
    app.kubernetes.io/version: "26.8.1"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: keycloak-0.6.0
data:
  realm-academy.json: |
    {
      "realm": "academy",
      "displayName": "Hoops Academy",
      "loginTheme": "hoops",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "registrationEmailAsUsername": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "verifyEmail": false,
      "accessTokenLifespan": 300,
      "revokeRefreshToken": true,
      "refreshTokenMaxReuse": 0,
      "ssoSessionIdleTimeout": 14400,
      "ssoSessionMaxLifespan": 43200,
      "bruteForceProtected": true,
      "failureFactor": 5,
      "maxFailureWaitSeconds": 900,
      "waitIncrementSeconds": 60,
      "permanentLockout": false,
      "maxDeltaTimeSeconds": 43200,
      "eventsEnabled": true,
      "eventsExpiration": 2592000,
      "eventsListeners": [
        "jboss-logging"
      ],
      "enabledEventTypes": [
        "LOGIN",
        "LOGIN_ERROR",
        "LOGOUT",
        "LOGOUT_ERROR",
        "CODE_TO_TOKEN",
        "CODE_TO_TOKEN_ERROR",
        "REFRESH_TOKEN_ERROR",
        "CLIENT_LOGIN",
        "CLIENT_LOGIN_ERROR",
        "INTROSPECT_TOKEN_ERROR",
        "UPDATE_PASSWORD",
        "UPDATE_PASSWORD_ERROR",
        "UPDATE_CREDENTIAL",
        "UPDATE_CREDENTIAL_ERROR",
        "REMOVE_CREDENTIAL",
        "REMOVE_CREDENTIAL_ERROR",
        "UPDATE_TOTP",
        "UPDATE_TOTP_ERROR",
        "REMOVE_TOTP",
        "REMOVE_TOTP_ERROR",
        "RESET_PASSWORD",
        "RESET_PASSWORD_ERROR",
        "SEND_RESET_PASSWORD",
        "SEND_RESET_PASSWORD_ERROR",
        "UPDATE_EMAIL",
        "UPDATE_EMAIL_ERROR",
        "EXECUTE_ACTIONS",
        "EXECUTE_ACTIONS_ERROR",
        "EXECUTE_ACTION_TOKEN",
        "EXECUTE_ACTION_TOKEN_ERROR",
        "USER_DISABLED_BY_TEMPORARY_LOCKOUT",
        "USER_DISABLED_BY_PERMANENT_LOCKOUT"
      ],
      "adminEventsEnabled": true,
      "adminEventsDetailsEnabled": false,
      "attributes": {
        "adminEventsExpiration": "2592000"
      },
      "passwordPolicy": "length(12) and maxLength(128) and notUsername and notEmail and passwordBlacklist(hoops-password-blocklist.txt)",
      "otpPolicyType": "totp",
      "otpPolicyAlgorithm": "HmacSHA1",
      "otpPolicyDigits": 6,
      "otpPolicyPeriod": 30,
      "otpPolicyLookAheadWindow": 1,
      "otpPolicyCodeReusable": false,
      "browserSecurityHeaders": {
        "contentSecurityPolicy": "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self' http://localhost:8090; base-uri 'self'; object-src 'none';",
        "contentSecurityPolicyReportOnly": "",
        "xFrameOptions": "SAMEORIGIN",
        "xContentTypeOptions": "nosniff",
        "referrerPolicy": "no-referrer",
        "strictTransportSecurity": "max-age=31536000; includeSubDomains",
        "xRobotsTag": "none"
      },
      "internationalizationEnabled": true,
      "supportedLocales": [
        "en",
        "es",
        "id"
      ],
      "defaultLocale": "en",
      "smtpServer": {
        "host": "mailhog",
        "port": "1025",
        "from": "no-reply@hoops-academy.com",
        "fromDisplayName": "Hoops Academy",
        "auth": "false",
        "ssl": "false",
        "starttls": "false"
      },
      "roles": {
        "realm": [
          {
            "name": "super_admin",
            "description": "Platform administrator (all tenants, platform endpoints)"
          },
          {
            "name": "service",
            "description": "Service-to-service calls to /internal endpoints"
          }
        ]
      },
      "clients": [
        {
          "clientId": "web",
          "name": "Hoops Academy web",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "rootUrl": "http://localhost:8090",
          "baseUrl": "/",
          "redirectUris": [
            "http://localhost:8090/*",
            "http://localhost:8090/*"
          ],
          "webOrigins": [
            "http://localhost:8090",
            "http://localhost:8090"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "http://localhost:8090/*##http://localhost:8090/*"
          },
          "defaultClientScopes": [
            "basic",
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email"
          ],
          "optionalClientScopes": [
            "offline_access"
          ],
          "protocolMappers": [
            {
              "name": "audience core-service",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "core-service",
                "access.token.claim": "true",
