# Source: hoops/charts/core/templates/httproute.yaml
# Envoy Gateway global rate limit: 10 requests per minute per client IP, counted by the rate limit service in
# Redis (one-minute window shared by every Envoy replica). Over the limit: 429. Unreachable Redis: fail open (ADR-0033).
# Plus a burst cap of 2 requests per second per client IP, so the fixed minute windows cannot pass 2 x 10 in a
# few seconds around a minute boundary (WP46, ADR-0033 amendment).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: core-service-academy-requests
  labels:
    app.kubernetes.io/name: core-service
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: core-0.9.0
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: core-service-academy-requests}
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "0.0.0.0/0"}
          limit: {requests: 10, unit: Minute}
        # The always-true path selector keeps this rule's descriptor apart from the per-minute rule's: Envoy Gateway
        # v1.9 and v1.10 build sourceCIDR descriptors without the rule index, so two rules with equal selectors share one
        # counter (counted twice per request, with the first rule's limit) and the per-second limit is lost.
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "0.0.0.0/0"}
            - path: {type: PathPrefix, value: /}
          limit: {requests: 2, unit: Second}
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "::/0"}
          limit: {requests: 10, unit: Minute}
        # The always-true path selector keeps this rule's descriptor apart from the per-minute rule's: Envoy Gateway
        # v1.9 and v1.10 build sourceCIDR descriptors without the rule index, so two rules with equal selectors share one
        # counter (counted twice per request, with the first rule's limit) and the per-second limit is lost.
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "::/0"}
            - path: {type: PathPrefix, value: /}
          limit: {requests: 2, unit: Second}

