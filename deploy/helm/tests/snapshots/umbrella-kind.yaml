# Gateway API route (ADR-0031): the SPA at / and the deny paths (/internal) answered 403 by this nginx. A longer path
# prefix wins over /, so /internal never reaches a service; NetworkPolicies are the second layer.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: web-0.2.0
spec:
  parentRefs:
    - name: hoops
  rules:
    - matches:
        - path: {type: PathPrefix, value: "/"}
      backendRefs:
        - {name: web, port: 8080}
      timeouts: {request: 60s}
    - matches:
        - path: {type: PathPrefix, value: "/internal"}
      backendRefs:
        - {name: web, port: 8080}
      timeouts: {request: 60s}
