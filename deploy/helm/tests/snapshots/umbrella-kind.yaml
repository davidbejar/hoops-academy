    secret.reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: ratelimit-redis}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rate-limit-store
        app.kubernetes.io/name: ratelimit-redis
        app.kubernetes.io/part-of: hoops-academy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Writes /acl/users.acl: `default` off with no password and no permissions; ACL_USER on with the hashed password,
        # only its keys, only +ping +incrby +expire. Redis reads the file once at start: restart the Deployment after
        # rotating the password (docs/runbooks/rotate-secrets.md).
        - name: acl
          image: "docker.io/library/redis:8.10.3-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              : "${ACL_PASSWORD:?Secret hoops-ratelimit-redis has an empty password}"
              hash=$(printf '%s' "$ACL_PASSWORD" | sha256sum | cut -d' ' -f1)
              printf 'user default off resetpass resetkeys resetchannels -@all\n' > /acl/users.acl
              printf 'user %s on #%s resetkeys ~%s resetchannels -@all +ping +incrby +expire\n' "$ACL_USER" "$hash" "$ACL_KEYS" >> /acl/users.acl
          env:
            - name: ACL_USER
              value: "ratelimit"
            - name: ACL_KEYS
              value: "hoops/hoops/*"
            - name: ACL_PASSWORD
              valueFrom:
                secretKeyRef: {name: hoops-ratelimit-redis, key: password}
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: acl, mountPath: /acl}
      containers:
        - name: redis
          image: "docker.io/library/redis:8.10.3-alpine"
          imagePullPolicy: IfNotPresent
          # In-memory only (no RDB/AOF), bounded memory with LRU eviction, CONFIG disabled so a client cannot
          # reconfigure the server (e.g. turn persistence on or change the bind address), users from the ACL file.
          args:
            - redis-server
            - --aclfile
            - /acl/users.acl
            - --save
            - ""
            - --appendonly
            - "no"
            - --protected-mode
            - "no"
            - --maxmemory
            - "24mb"
            - --maxmemory-policy
            - allkeys-lru
            - --rename-command
            - CONFIG
            - ""
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 20
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: acl, mountPath: /acl, readOnly: true}
