# Local-only SMTP sink (kind): the realm's SMTP host is `mailhog:1025` (compose name), so the Service keeps that name
# and invitation / password-setup e-mails succeed instead of rolling the invite back. UI: kubectl port-forward
# svc/mailhog 8025. Never enable outside local clusters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  labels: {app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: hoops-academy}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: mailhog}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: hoops-academy}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: "docker.io/axllent/mailpit:v1.34.0"
          imagePullPolicy: IfNotPresent
          env:
            - {name: MP_MAX_MESSAGES, value: "500"}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: ui, containerPort: 8025}
          readinessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: smtp}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

