# Source: hoops/templates/observability.yaml
# Grafana LGTM all-in-one (dev only): Grafana 3000, the image's own collector on 4317 in front of Loki, Tempo (span metrics
# into Prometheus) and Prometheus, all on loopback inside the pod. Everything lives in emptyDirs: a restart empties it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/component: telemetry-backend
    app.kubernetes.io/name: lgtm
    app.kubernetes.io/part-of: hoops-academy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}    # never two of these at once on a small node
  selector:
    matchLabels: {app.kubernetes.io/name: lgtm}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: telemetry-backend
        app.kubernetes.io/name: lgtm
        app.kubernetes.io/part-of: hoops-academy
      annotations:
        checksum/config: 2974c99e71056e069852e81f881b92ff1150fa6bee3b2b0ea8c1a4df2dcd6ca5
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lgtm
          image: "docker.io/grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5"
          imagePullPolicy: IfNotPresent
          env:
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_USERS_VIEWERS_CAN_EDIT, value: "true"}
            - {name: LOKI_EXTRA_ARGS, value: "-compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=24h"}
            - {name: PROMETHEUS_EXTRA_ARGS, value: "--storage.tsdb.retention.time=24h"}
            - {name: TEMPO_EXTRA_ARGS, value: "-backend-worker.compaction.block-retention=24h -backend-scheduler.provider.work.compaction.block-retention=24h"}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: grafana, containerPort: 3000}
          # The image's own check: every component answers its ready endpoint (and run-all.sh wrote /tmp/ready).
          startupProbe:
            exec: {command: [/otel-lgtm/docker/healthcheck.sh]}
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 120   # 10 min: Grafana alone took 216 s on a loaded 2-CPU VM
          readinessProbe:
            exec: {command: [/otel-lgtm/docker/healthcheck.sh]}
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [/otel-lgtm/docker/healthcheck.sh]}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            limits:
              memory: 1280Mi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: tempo, mountPath: /var/tempo}
            - {name: dashboards, mountPath: /otel-lgtm/hoops-dashboards, readOnly: true}
            - {name: dashboard-provider, mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards, readOnly: true}
      volumes:
        - {name: data, emptyDir: {sizeLimit: 2Gi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: tempo, emptyDir: {sizeLimit: 1Gi}}     # Tempo's live store and scheduler work files
        - {name: dashboards, configMap: {name: lgtm-dashboards}}
        - {name: dashboard-provider, configMap: {name: lgtm-dashboard-provider}}

