# Source: hoops/templates/redpanda.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/component: event-broker
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: hoops-academy
  annotations:
    # Stakater Reloader (WP87, ADR-0012): roll the pods when a Secret they read changes (ESO refresh, secrets.sh).
    secret.reloader.stakater.com/auto: "true"
spec:
  serviceName: redpanda
  replicas: 1
  revisionHistoryLimit: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: redpanda}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: event-broker
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: hoops-academy
      annotations:
        # Node configuration and bootstrap properties change -> restart (they are read at start).
        checksum/config: "77cc7e1b2df6e318"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redpanda
          image: "docker.io/redpandadata/redpanda:v26.3.1@sha256:260532f70fd840bf2159106bd4ef900f199c1f5ca2a23cb362642320513b90f5"
          imagePullPolicy: IfNotPresent
          # The redpanda binary itself (not `rpk redpanda start`, which rewrites redpanda.yaml): one shard, a fixed
          # Seastar memory below the container limit, overprovisioned (no CPU pinning on a shared node).
          command: [/usr/bin/redpanda]
          args:
            - --redpanda-cfg
            - /etc/redpanda/redpanda.yaml
            - --smp
            - "1"
            - --memory
            - "512M"
            - --reserve-memory
            - 0M
            - --overprovisioned
            - --default-log-level=info
          env:
            - name: HOME
              value: /tmp
            # The superuser, created by Redpanda when the cluster bootstraps (empty volume). Rotation: docs/runbooks/events.md.
            - name: RP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: hoops-redpanda-admin, key: password}
            - name: RP_BOOTSTRAP_USER
              value: "admin:$(RP_ADMIN_PASSWORD):SCRAM-SHA-256"
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: admin, containerPort: 9644}
            - {name: rpc, containerPort: 33145}
          # /v1/status/ready answers without a login (admin_api_require_auth exempts the status endpoints).
          startupProbe:
            httpGet: {path: /v1/status/ready, port: admin}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /v1/status/ready, port: admin}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
            - {name: config, mountPath: /etc/redpanda, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: redpanda-config}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/component: event-broker
          app.kubernetes.io/name: redpanda
          app.kubernetes.io/part-of: hoops-academy
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}

