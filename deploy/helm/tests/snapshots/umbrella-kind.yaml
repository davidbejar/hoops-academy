# Source: hoops/templates/redpanda.yaml
# Runs after every install/upgrade (Helm waits for it with --wait; Tilt applies it like any Job and it waits for the
# broker itself). Idempotent; a failed run is retried (backoffLimit) and the previous Job is replaced on the next upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-bootstrap
  labels:
    app.kubernetes.io/component: event-broker
    app.kubernetes.io/name: redpanda-bootstrap
    app.kubernetes.io/part-of: hoops-academy
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/component: event-broker
        app.kubernetes.io/name: redpanda-bootstrap
        app.kubernetes.io/part-of: hoops-academy
      annotations:
        checksum/config: "2a83801f62f89452"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "docker.io/redpandadata/redpanda:v26.3.1@sha256:260532f70fd840bf2159106bd4ef900f199c1f5ca2a23cb362642320513b90f5"
          imagePullPolicy: IfNotPresent
          command: [bash, /bootstrap/bootstrap.sh]
          env:
            - {name: CONFIG_DIR, value: /bootstrap}
            - {name: PARTITIONS, value: "1"}
            # rpk's login and addresses (the superuser; curl reuses them for the admin API)
            - {name: RPK_BROKERS, value: "redpanda-0.redpanda.hoops.svc.cluster.local:9092"}
            - {name: RPK_ADMIN_HOSTS, value: "redpanda-0.redpanda.hoops.svc.cluster.local:9644"}
            - {name: RPK_SASL_MECHANISM, value: SCRAM-SHA-256}
            - {name: RPK_USER, value: "admin"}
            - name: RPK_PASS
              valueFrom:
                secretKeyRef: {name: hoops-redpanda-admin, key: password}
            - name: USER_PASSWORD_0
              valueFrom:
                secretKeyRef: {name: hoops-redpanda-core-service, key: password}
            - name: USER_PASSWORD_1
              valueFrom:
                secretKeyRef: {name: hoops-redpanda-game-service, key: password}
            - name: USER_PASSWORD_2
              valueFrom:
                secretKeyRef: {name: hoops-redpanda-athlete-service, key: password}
            - name: USER_PASSWORD_3
              valueFrom:
                secretKeyRef: {name: hoops-redpanda-finance-service, key: password}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: bootstrap, configMap: {name: redpanda-bootstrap}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}

