            - sourceCIDR: {type: Distinct, value: "0.0.0.0/0"}
            - path: {type: PathPrefix, value: /}
          limit: {requests: 2, unit: Second}
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "::/0"}
          limit: {requests: 10, unit: Minute}
        # The always-true path selector keeps this rule's descriptor apart from the per-minute rule's: Envoy Gateway
        # v1.9 and v1.10 build sourceCIDR descriptors without the rule index, so two rules with equal selectors share one
        # counter (counted twice per request, with the first rule's limit) and the per-second limit is lost.
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "::/0"}
            - path: {type: PathPrefix, value: /}
          limit: {requests: 2, unit: Second}

