---
# Source: hoops/templates/observability.yaml
# OTLP in from the services (by name label) and, gRPC only, from the Envoy proxies of Envoy Gateway's namespace (edge spans);
# out to DNS, Jaeger and the environment's backend rules (observability.collector.networkPolicy.extraEgress) only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/component: telemetry-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: hoops-academy
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - core-service
                  - game-service
                  - athlete-service
      ports:
        - {port: otlp-grpc, protocol: TCP}
        - {port: otlp-http, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              # the proxies of this release's Gateway (Tilt rewrites the app.kubernetes.io manager label, even in selectors)
              app.kubernetes.io/component: proxy
              gateway.envoyproxy.io/owning-gateway-name: hoops
              gateway.envoyproxy.io/owning-gateway-namespace: hoops
      ports:
        - {port: otlp-grpc, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: jaeger}
      ports:
        - {port: 4317, protocol: TCP}

