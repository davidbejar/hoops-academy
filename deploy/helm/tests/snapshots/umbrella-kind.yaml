# Source: hoops/templates/redpanda.yaml
# Kafka (9092) only from the event users' pods (app.kubernetes.io/name = user name = the service's name) and the bootstrap
# Job; the admin API (9644) only from the Job. Egress: DNS only (the broker resolves its advertised name), no internet
# (the metrics reporter is off as well).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/component: event-broker
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: hoops-academy
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redpanda}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - core-service
                  - game-service
                  - athlete-service
                  - redpanda-bootstrap
      ports:
        - {port: kafka, protocol: TCP}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: redpanda-bootstrap}
      ports:
        - {port: admin, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}

