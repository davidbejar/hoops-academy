spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: athlete-service
      app.kubernetes.io/instance: hoops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: athlete-service
        app.kubernetes.io/instance: hoops
        app.kubernetes.io/part-of: hoops-academy
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: athlete-0.1.0
      annotations:
        checksum/env: 8f1a5f702c3886a6c00592f6ebd7f3e49d54e1233e56a1c2ae98944f6ea301c5
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: athlete-service
          image: "localhost/hoops/athlete-service:dev"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
