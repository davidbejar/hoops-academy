# Source: hoops/charts/databases/templates/networkpolicy.yaml
# Postgres instances: reachable from pods of this namespace and from the CNPG operator (status port 8000 + 5432).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: databases
  labels:
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: databases-0.1.0
spec:
  podSelector:
    matchExpressions:
      - {key: cnpg.io/cluster, operator: Exists}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}

---
# Source: hoops/charts/finance/templates/networkpolicy.yaml
# finance-service is reached only through the gateway (the Envoy proxies in Envoy Gateway's namespace); no pod of this
# namespace calls it (the chart's collector scrapes /q/metrics, WP120). Egress: DNS, Postgres, Keycloak's port (signing keys), Redpanda's Kafka port (with events) and the
# collector's OTLP HTTP port (with the chart's collector); nothing else. The kubelet's probes are not subject to policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-service
  labels:
    app.kubernetes.io/name: finance-service
    app.kubernetes.io/instance: hoops
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: finance-0.2.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finance-service
      app.kubernetes.io/instance: hoops
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - {port: http, protocol: TCP}
    # the umbrella's collector scrapes /q/metrics (WP120); it holds no token, so the API stays closed to it
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - {port: http, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: hoops-db
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - {port: 8080, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
      ports:
        - {port: 9092, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - {port: 4318, protocol: TCP}

