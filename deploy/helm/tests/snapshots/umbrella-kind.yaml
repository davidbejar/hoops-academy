# Source: hoops/templates/gateway.yaml
# Envoy proxy deployment and Service of this Gateway only (Gateway.spec.infrastructure.parametersRef).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: hoops
  labels: {app.kubernetes.io/part-of: hoops-academy, app.kubernetes.io/managed-by: Helm}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: hoops-gateway
        type: NodePort
        # Fixed node ports so a kind extraPortMapping can reach them (Service ports are keyed by port).
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - {port: 80, nodePort: 30080}
                - {port: 443, nodePort: 30443}
      envoyDeployment:
        replicas: 1
        container:
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
  # Edge spans (WP86, ADR-0046): Envoy starts the trace (W3C traceparent to the services, whose parent-based sampler follows
  # it) at the same ratio as the services and sends its spans to the chart's collector. By DNS name (host/port), not
  # backendRefs: with backendRefs Envoy Gateway sets the Gateway Accepted=False ("no ready endpoints") while the collector
  # is down (kind proof); by name the edge keeps its status and Envoy just drops the spans.
  telemetry:
    tracing:
      samplingFraction: {numerator: 10000, denominator: 10000}
      provider:
        type: OpenTelemetry
        host: otel-collector.hoops.svc.cluster.local
        port: 4317

