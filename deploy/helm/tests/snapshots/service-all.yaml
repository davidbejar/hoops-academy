# Source: hoops-service/templates/networkpolicy.yaml
# Only the ingress controller and pods of this namespace may reach the service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-service
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-service
      app.kubernetes.io/instance: svc
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP

