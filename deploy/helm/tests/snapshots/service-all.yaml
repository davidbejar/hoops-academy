# Source: hoops-service/templates/httproute.yaml
# Rate-limited path: RE2 regex matched against the request path as sent (no rewrite, no decoding of %3A), so the
# colon of ":batch" reaches the service unchanged. Its own route, because a BackendTrafficPolicy applies per route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-service-batch
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.6.0
spec:
  parentRefs:
    - name: hoops
  hostnames:
    - "hoops.example.test"
  rules:
    - matches:
        - path: {type: RegularExpression, value: "/api/demo/items/[^/]+/things(:|%3[Aa])batch"}
      backendRefs:
        - {name: demo-service, port: 8099}
      timeouts: {request: 60s}

