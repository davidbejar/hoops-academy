# Source: hoops-service/templates/httproute.yaml
# Envoy Gateway global rate limit: 120 requests per minute per client IP, counted by the rate limit service in
# Redis (one-minute window shared by every Envoy replica). Over the limit: 429. Unreachable Redis: fail open (ADR-0033).
# Plus a burst cap of 20 requests per second per client IP, so the fixed minute windows cannot pass 2 x 120 in a
# few seconds around a minute boundary (WP46, ADR-0033 amendment).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: demo-service-batch
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.6.0
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: demo-service-batch}
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "0.0.0.0/0"}
          limit: {requests: 120, unit: Minute}
        # The always-true path selector keeps this rule's descriptor apart from the per-minute rule's: Envoy Gateway
        # v1.9 builds sourceCIDR descriptors without the rule index, so two rules with equal selectors share one
        # counter (counted twice per request, with the first rule's limit) and the per-second limit is lost.
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "0.0.0.0/0"}
            - path: {type: PathPrefix, value: /}
          limit: {requests: 20, unit: Second}
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "::/0"}
          limit: {requests: 120, unit: Minute}
        # The always-true path selector keeps this rule's descriptor apart from the per-minute rule's: Envoy Gateway
        # v1.9 builds sourceCIDR descriptors without the rule index, so two rules with equal selectors share one
        # counter (counted twice per request, with the first rule's limit) and the per-second limit is lost.
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "::/0"}
            - path: {type: PathPrefix, value: /}
          limit: {requests: 20, unit: Second}

