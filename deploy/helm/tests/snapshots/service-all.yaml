---
# Source: hoops-service/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-service
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.1.0
spec:
  ingressClassName: nginx
  rules:
    -
      host: "hoops.example.test"
      http:
        paths:
          - path: /api/demo
            pathType: Prefix
            backend:
              service:
                name: demo-service
                port: {name: http}
          - path: /platform
            pathType: Prefix
            backend:
              service:
                name: demo-service
                port: {name: http}

---
# Source: hoops-service/templates/ingress.yaml
# Health only: <prefix>/q/health/** is rewritten to /q/health/** (nothing else under /q is exposed).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-service-health
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.1.0
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /q/health$1
spec:
  ingressClassName: nginx
  rules:
    -
      host: "hoops.example.test"
      http:
        paths:
          - path: /api/demo/q/health(/(?:live|ready|started))?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: demo-service
                port: {name: http}
