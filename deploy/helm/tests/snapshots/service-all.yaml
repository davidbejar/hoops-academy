# Source: hoops-service/templates/httproute.yaml
# Health only: <prefix>/q/health[/live|ready|started] (exact paths) -> /q/health...; nothing else under /q is routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-service-health
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.6.0
spec:
  parentRefs:
    - name: hoops
  hostnames:
    - "hoops.example.test"
  rules:
    - matches:
        - path: {type: Exact, value: "/api/demo/q/health"}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: "/q/health"}
      backendRefs:
        - {name: demo-service, port: 8099}
      timeouts: {request: 60s}
    - matches:
        - path: {type: Exact, value: "/api/demo/q/health/live"}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: "/q/health/live"}
      backendRefs:
        - {name: demo-service, port: 8099}
      timeouts: {request: 60s}
    - matches:
        - path: {type: Exact, value: "/api/demo/q/health/ready"}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: "/q/health/ready"}
      backendRefs:
        - {name: demo-service, port: 8099}
      timeouts: {request: 60s}
    - matches:
        - path: {type: Exact, value: "/api/demo/q/health/started"}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: "/q/health/started"}
      backendRefs:
        - {name: demo-service, port: 8099}
      timeouts: {request: 60s}

