metadata:
  name: demo-service-plain
  labels:
    app.kubernetes.io/name: demo-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.6.0
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: demo-service-plain}
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "0.0.0.0/0"}
          limit: {requests: 10, unit: Minute}
        - clientSelectors:
            - sourceCIDR: {type: Distinct, value: "::/0"}
          limit: {requests: 10, unit: Minute}

