# Source: hoops/templates/externalsecrets.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hoops-db-core-migrator
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: hoops-academy
spec:
  refreshInterval: "1m"
  secretStoreRef: {kind: ClusterSecretStore, name: hoops}
  target:
    name: hoops-db-core-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/component: secrets
          app.kubernetes.io/part-of: hoops-academy
          cnpg.io/reload: "true"
      mergePolicy: Merge
      data:
        username: core_migrator
  data:
    - secretKey: password
      remoteRef: {key: hoops, property: CORE_MIGRATOR_PASSWORD}
