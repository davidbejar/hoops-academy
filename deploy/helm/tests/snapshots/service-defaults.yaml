---
# Source: hoops-service/templates/networkpolicy.yaml
# Only the ingress controller and pods of this namespace may reach the service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hoops-service
  labels:
    app.kubernetes.io/name: hoops-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hoops-service
      app.kubernetes.io/instance: svc
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP

---
# Source: hoops-service/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hoops-service-env
  labels:
    app.kubernetes.io/name: hoops-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.1.0
data:
  QUARKUS_HTTP_PORT: "8080"

---
# Source: hoops-service/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: hoops-service
  labels:
    app.kubernetes.io/name: hoops-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.1.0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hoops-service
    app.kubernetes.io/instance: svc
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# Source: hoops-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoops-service
  labels:
    app.kubernetes.io/name: hoops-service
    app.kubernetes.io/instance: svc
    app.kubernetes.io/part-of: hoops-academy
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hoops-service-0.1.0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hoops-service
      app.kubernetes.io/instance: svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hoops-service
        app.kubernetes.io/instance: svc
        app.kubernetes.io/part-of: hoops-academy
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: hoops-service-0.1.0
      annotations:
        checksum/env: 00b5a13fbe604713f14c04895cd21c97df7754d86571d44b03f35b4d644f6081
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hoops-service
          image: "localhost/hoops/service:dev"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hoops-service-env
          startupProbe:
            httpGet: {path: /q/health/started, port: http}
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /q/health/live, port: http}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /q/health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
