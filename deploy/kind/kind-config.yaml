# kind cluster for Hoops Academy (WP16). Created by deploy/kind/up.sh with the Podman provider.
# Host ports 8090/8453 (not 80/443, not 8080 which is the compose stack) map to ingress-nginx on the node.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hoops
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8090
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 8453
        listenAddress: "127.0.0.1"
        protocol: TCP
