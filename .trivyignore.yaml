# Accepted Trivy findings (trivy fs/config --ignorefile .trivyignore.yaml). Each entry: why, and until when.
misconfigurations:
  - id: KSV-0014
    paths:
      - "**/helm/tests/snapshots/umbrella-default.yaml"
      - "**/helm/tests/snapshots/umbrella-kind.yaml"
      - "**/helm/tests/snapshots/umbrella-tls.yaml"
      - "**/helm/tests/snapshots/umbrella-eso.yaml"
      - "**/helm/tests/snapshots/umbrella-cloud.yaml"
    statement: >-
      Keycloak only: `start` (non-optimized) re-augments into /opt/keycloak/lib at boot, so its root FS must be
      writable (WP16). Every other container is read-only, enforced by deploy/helm/tests/run.sh
      ("readOnlyRootFilesystem (all but keycloak)"). Fix: pre-built `kc.sh build` image + `start --optimized`.
    expired_at: 2027-03-31
  - id: KSV-0109
    paths:
      - "**/helm/tests/snapshots/*.yaml"
    statement: >-
      ConfigMap keycloak-password-blocklist holds the public password denylist (WP57, ADR-0038: the 10,000 most common
      passwords, from SecLists), and ConfigMap redpanda-bootstrap the broker bootstrap script (WP66, ADR-0036: it reads
      the passwords from env vars fed by Secrets and never contains one); neither is a secret, the rule fires on the
      word "password" in them. The chart stores every real credential in Secrets (chart test "no Secret rendered" +
      gitleaks on the render; the bootstrap script test "no password on a command line").
    expired_at: 2027-05-01
