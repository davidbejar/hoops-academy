# Hoops Academy local stack. Run via `just up` (reads ../../.env). Services (Quarkus) run on the host in dev
# and are reached by nginx through host.containers.internal.
name: hoops

# Shared blocks (INF-06), merged with `<<:` (YAML merge keys; docker compose and podman-compose both resolve them).
# The hardening of every container that needs no writable root file system and no capability.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
# The environment pdf-service and finance-service share: the realm inside the network (ADR-0071; the issuer comes from
# Keycloak's discovery, http://localhost:8080/auth/realms/academy, KC_HOSTNAME, as in the tokens) and traces and logs to
# the `observability` profile's collector (HOOPS_OTEL_SDK_DISABLED=false just pdf-up / finance-up, WP120).
x-service-env: &service-env
  OIDC_AUTH_SERVER_URL: http://keycloak:8080/auth/realms/academy
  OTEL_SDK_DISABLED: ${HOOPS_OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=compose

services:
  postgres:
    # PostgreSQL 19 (ADR-0073); one version with the chart and the test harnesses (scripts/bump_pins.py). From 18 the
    # image keeps its cluster in /var/lib/postgresql/<major>/docker: the volume sits at /var/lib/postgresql and its
    # name carries the major, so a new major starts on a new volume and the old one stays as it was (the way back).
    image: docker.io/library/postgres:19.0-trixie
    container_name: hoops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: hoops
      CORE_MIGRATOR_PASSWORD: ${CORE_MIGRATOR_PASSWORD:?set in .env}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?set in .env}
      CORE_PLATFORM_PASSWORD: ${CORE_PLATFORM_PASSWORD:?set in .env}
      GAME_MIGRATOR_PASSWORD: ${GAME_MIGRATOR_PASSWORD:?set in .env}
      GAME_APP_PASSWORD: ${GAME_APP_PASSWORD:?set in .env}
      ATHLETE_MIGRATOR_PASSWORD: ${ATHLETE_MIGRATOR_PASSWORD:?set in .env}
      ATHLETE_APP_PASSWORD: ${ATHLETE_APP_PASSWORD:?set in .env}
      FINANCE_MIGRATOR_PASSWORD: ${FINANCE_MIGRATOR_PASSWORD:?set in .env}
      FINANCE_APP_PASSWORD: ${FINANCE_APP_PASSWORD:?set in .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-19:/var/lib/postgresql
      - ../db/init/01_roles_schemas.sql:/docker-entrypoint-initdb.d/01_roles_schemas.sql:ro
      - ../db/init/02_passwords.sh:/docker-entrypoint-initdb.d/02_passwords.sh:ro
      - ./postgres-keycloak-init.sh:/docker-entrypoint-initdb.d/03_keycloak_db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hoops"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: hoops-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Substituted into realm-academy.json at import time (no literal secrets in git).
      CORE_SERVICE_CLIENT_SECRET: ${CORE_SERVICE_CLIENT_SECRET:?set in .env}
      GAME_SERVICE_CLIENT_SECRET: ${GAME_SERVICE_CLIENT_SECRET:?set in .env}
      ATHLETE_SERVICE_CLIENT_SECRET: ${ATHLETE_SERVICE_CLIENT_SECRET:?set in .env}
      # Password blocklist (ADR-0038): Keycloak keeps it in a Bloom filter; at its default false-positive rate of 1e-4
      # one temporary password in 10,000 would be refused although it is on no list.
      KC_SPI_PASSWORD_POLICY__PASSWORD_BLACKLIST__FALSE_POSITIVE_PROBABILITY: "1e-12"
      # Security events (ADR-0043): the realm's jboss-logging listener writes successful logins at INFO (default DEBUG,
      # i.e. not written); failures stay at WARN.
      KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL: info
    volumes:
      - ../keycloak/realm-academy.json:/opt/keycloak/data/import/realm-academy.json:ro
      # realm passwordPolicy passwordBlacklist(hoops-password-blocklist.txt), ADR-0038
      - ../keycloak/password-blocklist:/opt/keycloak/data/password-blacklists:ro
      # Branded login pages (ADR-0022); start-dev does not cache themes, so CSS edits show on reload.
      - ../keycloak/themes/hoops:/opt/keycloak/themes/hoops:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in the image: raw HTTP over bash /dev/tcp against the management port (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  mailhog:
    # v1.0.1 is MailHog's last release (2020); the digest is the one `latest` pointed at (2026-11-24)
    image: docker.io/mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: hoops-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Event broker (WP66, ADR-0036): single Redpanda node in dev-container mode, no auth (local only; kind and the chart
  # use SASL/SCRAM + ACLs). Same image pin as the chart (events.redpanda.image) and the Quarkus Dev Services
  # (libs/common-quarkus); deploy/helm/tests/run.sh fails when they differ. Topics: `just events-topics` (run by `just up`).
  # Kafka API: localhost:19092 for the services in quarkus:dev on the host, redpanda:9092 inside the compose network.
  redpanda:
    image: docker.io/redpandadata/redpanda:v26.3.1@sha256:260532f70fd840bf2159106bd4ef900f199c1f5ca2a23cb362642320513b90f5
    container_name: hoops-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    environment:
      HOME: /tmp
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
      # Cluster properties at bootstrap: no topic auto-creation, no metrics reporter.
      - ./redpanda-bootstrap.yaml:/etc/redpanda/.bootstrap.yaml:ro
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9644/v1/status/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # pdf-service (Rust, ADR-0051 §3, ADR-0052): profile `pdf`, so `just up` neither builds nor starts it; `just pdf-up`
  # builds the image (deploy/containers/pdf.Containerfile, minutes the first time) and starts it on 127.0.0.1:8084.
  # Internal only (decision 89): nginx has no route to it; core and game on the host call PDF_SERVICE_URL
  # (http://localhost:8084, .env) with their client-credentials token. It reads Keycloak's keys inside the network.
  pdf-service:
    profiles: [pdf]
    image: localhost/hoops/pdf-service:dev
    build:
      context: ../../services/pdf-service
      dockerfile: ../../deploy/containers/pdf.Containerfile
    container_name: hoops-pdf-service
    environment:
      <<: *service-env
      PDF_HTTP_PORT: "8084"
    ports:
      - "127.0.0.1:8084:8084"
    <<: *hardened
    mem_limit: 128m
    depends_on:
      keycloak:
        condition: service_healthy
    # distroless: no shell or curl for a healthcheck command; `just pdf-up` waits for the container to run
    restart: unless-stopped

  # finance-service (Go, ADR-0051 §2, ADR-0055): profile `finance`, so `just up` neither builds nor starts it; `just
  # finance-up` brings the roles of an existing database up to date (infra/compose/db-roles.sh), builds the image and starts it on
  # 127.0.0.1:8085. nginx routes /api/finance to host.containers.internal:8085 (this container or `go run` on the host).
  # It reads Keycloak's keys inside the network (issuer by discovery) and core's topics from redpanda:9092 (no auth here).
  finance-service:
    profiles: [finance]
    image: localhost/hoops/finance-service:dev
    build:
      context: ../../services/finance-service
      dockerfile: ../../deploy/containers/finance.Containerfile
    container_name: hoops-finance-service
    environment:
      <<: *service-env
      FINANCE_HTTP_PORT: "8085"
      FINANCE_DB_URL: postgres://postgres:5432/hoops
      FINANCE_MIGRATOR_PASSWORD: ${FINANCE_MIGRATOR_PASSWORD:?set in .env}
      FINANCE_APP_PASSWORD: ${FINANCE_APP_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      HOOPS_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      # loopback by default. nginx reaches the service through the host (host.containers.internal:8085): on Linux
      # a port published on 127.0.0.1 is not reachable that way, so the e2e workflow sets HOOPS_FINANCE_BIND=0.0.0.0
      # on its throw-away runner (run 43814612481: 502 on /api/finance). On macOS the default works.
      - "${HOOPS_FINANCE_BIND:-127.0.0.1}:8085:8085"
    <<: *hardened
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    # distroless: no shell or curl for a healthcheck command; `just finance-up` waits for the container to run
    restart: unless-stopped

  # Observability (WP120, ADR-0046 amendment): profile `observability`, so `just up` starts neither; `just observability-up`
  # starts the chart's OpenTelemetry collector (otel-collector.yaml; same image pin, processors and pipelines as the chart,
  # deploy/helm/tests/run.sh compares them) and one Grafana LGTM container behind it, with the chart's dashboards
  # (deploy/helm/hoops/files/grafana). Grafana: http://localhost:3000, anonymous Viewer (Explore allowed), no login. Dev
  # only: data in tmpfs (gone with the container), 24 h retention for logs, traces and metrics (P-07), the same environment
  # as the chart's lgtm Deployment. Quarkus on the host exports with QUARKUS_OTEL_SDK_DISABLED=false (endpoint
  # localhost:4317 by default); pdf-service / finance-service with HOOPS_OTEL_SDK_DISABLED=false.
  otel-collector:
    profiles: [observability]
    image: docker.io/otel/opentelemetry-collector:0.163.2@sha256:63e5e8eccf4268be02388ba9f2dc36b80b5e47721291293411c0e83152d75bda
    container_name: hoops-otel-collector
    command: [--config=/etc/otelcol/config.yaml]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # the services' /q/metrics on the host ports (as nginx reaches them); Docker (CI) maps the name to the gateway
    extra_hosts:
      - "host.containers.internal:host-gateway"
    <<: *hardened
    mem_limit: 256m
    # distroless: no shell or curl for a healthcheck command
    restart: unless-stopped

  lgtm:
    profiles: [observability]
    image: docker.io/grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    container_name: hoops-lgtm
    user: "10001:10001"
    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      LOKI_EXTRA_ARGS: "-compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=24h"
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=24h"
      TEMPO_EXTRA_ARGS: "-backend-worker.compaction.block-retention=24h -backend-scheduler.provider.work.compaction.block-retention=24h"
    ports:
      - "127.0.0.1:3000:3000"
    # no persistence: everything the components write lives in tmpfs (counted in mem_limit)
    tmpfs:
      - /data:size=512m
      - /tmp
      - /var/tempo
    volumes:
      - ../../deploy/helm/hoops/files/grafana/dashboards:/otel-lgtm/hoops-dashboards:ro
      - ../../deploy/helm/hoops/files/grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
    <<: *hardened
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:1.30-alpine
    container_name: hoops-nginx
    ports:
      - "127.0.0.1:8080:8080"
    # Backends on the host: Podman provides host.containers.internal itself; on Docker (CI) map it to the gateway.
    extra_hosts:
      - "host.containers.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/hoops:ro
      # Keycloak admin console + master realm through the proxy: false (default) blocks them; set
      # HOOPS_EXPOSE_KC_ADMIN=true in .env for local tooling that needs them (e.g. the e2e suite).
      - ./nginx/kc-admin-${HOOPS_EXPOSE_KC_ADMIN:-false}.conf:/etc/nginx/hoops-kc-admin.conf:ro
      - ./web-placeholder:/usr/share/nginx/html:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata-19:
  redpanda-data:
