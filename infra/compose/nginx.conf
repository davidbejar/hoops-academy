worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # ---- rate limiting (per client IP; WP17). Over the limit -> 429. Keycloak's brute-force detection and the
  # services' own validation stay the second layer.
  #   auth:   token endpoint + login form POST of realm academy: 1 req/s sustained, burst 30
  #   events: live-match batches (offline outbox flush): 2 req/s sustained, burst 60
  limit_req_zone $binary_remote_addr zone=auth:10m   rate=60r/m;
  limit_req_zone $binary_remote_addr zone=events:10m rate=120r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  server {
    listen 8080;
    server_name localhost;
    client_max_body_size 10m;

    # API responses get their security headers from the services (common-quarkus); Keycloak sets its own
    # frame/CSP headers. Web app locations include nginx/web-headers.conf.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  8080;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Never reachable from outside: service-to-service endpoints.
    location ^~ /internal/ { return 403; }

    # Keycloak admin console + master realm: blocked unless HOOPS_EXPOSE_KC_ADMIN=true (compose mounts
    # nginx/kc-admin-<value>.conf here).
    include /etc/nginx/hoops-kc-admin.conf;

    location = /auth/realms/academy/protocol/openid-connect/token {
      limit_req zone=auth burst=30 nodelay;
      include /etc/nginx/hoops/keycloak-proxy.conf;
    }
    location = /auth/realms/academy/login-actions/authenticate {
      limit_req zone=auth burst=30 nodelay;
      include /etc/nginx/hoops/keycloak-proxy.conf;
    }
    location /auth/ {
      include /etc/nginx/hoops/keycloak-proxy.conf;
    }

    # Backends run on the host during development. host.containers.internal is resolved at startup via /etc/hosts.
    # proxy_pass without a URI part forwards the raw request URI (OPTIONS preflights and "events:batch" unchanged).
    location /api/core/ {
      proxy_pass http://host.containers.internal:8081;
    }
    # Platform (super_admin) API is served by core-service too; /internal/** stays blocked above.
    location /platform/ {
      proxy_pass http://host.containers.internal:8081;
    }
    # Matched on the normalised URI (also "events%3Abatch"); forwarded byte-for-byte like /api/game/.
    location ~ ^/api/game/matches/[^/]+/events:batch$ {
      limit_req zone=events burst=60 nodelay;
      proxy_pass http://host.containers.internal:8082;
    }
    location /api/game/ {
      proxy_pass http://host.containers.internal:8082;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /api/athlete/ {
      proxy_pass http://host.containers.internal:8083;
    }

    # ---- web app (Flutter PWA) ----
    # Entry points and service workers are revalidated on every load so a new version rolls out.
    location ~ ^/(index\.html|sw\.js|flutter_service_worker\.js|flutter_bootstrap\.js|manifest\.json|version\.json)$ {
      root /usr/share/nginx/html;
      include /etc/nginx/hoops/web-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    location = /redirect.html {
      root /usr/share/nginx/html;
      include /etc/nginx/hoops/redirect-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    location / {
      root /usr/share/nginx/html;
      include /etc/nginx/hoops/web-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
