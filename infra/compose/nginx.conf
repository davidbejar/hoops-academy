worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    server_name localhost;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  8080;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Never reachable from outside: service-to-service endpoints.
    location /internal/ { return 403; }

    location /auth/ {
      proxy_pass http://keycloak:8080;
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
    }

    # Backends run on the host during development. host.containers.internal is resolved at startup via /etc/hosts.
    location /api/core/ {
      proxy_pass http://host.containers.internal:8081;
    }
    location /api/game/ {
      proxy_pass http://host.containers.internal:8082;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /api/athlete/ {
      proxy_pass http://host.containers.internal:8083;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
