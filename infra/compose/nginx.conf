worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;

  # ---- rate limiting (per client IP; WP17). Over the limit -> 429. Keycloak's brute-force detection and the
  # services' own validation stay the second layer.
  #   auth:   token endpoint + login form POST of realm academy: 1 req/s sustained, burst 30
  #   events: live-match batches (offline outbox flush): 2 req/s sustained, burst 60
  limit_req_zone $binary_remote_addr zone=auth:10m   rate=60r/m;
  limit_req_zone $binary_remote_addr zone=events:10m rate=120r/m;
  #   export: the CSV exports (ADR-0048; core's three, finance's two) and the public POST /platform/academy-requests, the gateway's numbers
  #           (ADR-0033 amendment WP100): 10 req/min and 2 req/s per client IP. Both zones apply to each location.
  limit_req_zone $binary_remote_addr zone=export_min:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=export_sec:10m rate=2r/s;
  #   request: only the public POST /platform/academy-requests counts; the super admin's GET of the same path has an
  #            empty key and is not limited (the e2e journey posts twice and lists at once).
  map $request_method $academy_request_key {
    default "";
    POST    $binary_remote_addr;
  }
  limit_req_zone $academy_request_key zone=request_min:10m rate=10r/m;
  limit_req_zone $academy_request_key zone=request_sec:10m rate=2r/s;
  limit_req_status 429;
  limit_req_log_level warn;

  server {
    listen 8080;
    server_name localhost;
    client_max_body_size 10m;

    # API responses get their security headers from the services (common-quarkus); Keycloak sets its own
    # frame/CSP headers. Web app locations include nginx/web-headers.conf.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The public host, never the client's Host header (SD-06: absolute URLs such as Location are built from it). Keep it
    # equal to KC_HOSTNAME in compose.yaml and PUBLIC_BASE_URL in .env.
    proxy_set_header Host              localhost:8080;
    proxy_set_header X-Forwarded-Host  localhost:8080;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  8080;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Never reachable from outside: service-to-service endpoints.
    location ^~ /internal/ { include /etc/nginx/hoops/deny-headers.conf; return 403; }

    # Keycloak admin console + master realm: blocked unless HOOPS_EXPOSE_KC_ADMIN=true (compose mounts
    # nginx/kc-admin-<value>.conf here).
    include /etc/nginx/hoops-kc-admin.conf;

    location = /auth/realms/academy/protocol/openid-connect/token {
      limit_req zone=auth burst=30 nodelay;
      include /etc/nginx/hoops/keycloak-proxy.conf;
    }
    location = /auth/realms/academy/login-actions/authenticate {
      limit_req zone=auth burst=30 nodelay;
      include /etc/nginx/hoops/keycloak-proxy.conf;
    }
    location /auth/ {
      include /etc/nginx/hoops/keycloak-proxy.conf;
    }

    # Rate-limited routes of core-service (WP115). Regex locations win over the prefix locations below; nginx matches
    # the decoded URI, so "%3A" arrives as ":". Burst = the gateway's allowance: 10 in a minute, 2 in a second.
    location ~ ^/api/core/teams/[^/]+/roster:export$ {
      include /etc/nginx/hoops/export-limits.conf;
      proxy_pass http://host.containers.internal:8081;
    }
    location ~ ^/(api/core|platform)/audit-events:export$ {
      include /etc/nginx/hoops/export-limits.conf;
      proxy_pass http://host.containers.internal:8081;
    }
    location = /platform/academy-requests {
      limit_req zone=request_min burst=9 nodelay;
      limit_req zone=request_sec burst=1 nodelay;
      proxy_pass http://host.containers.internal:8081;
    }

    # Backends run on the host during development. host.containers.internal is resolved at startup via /etc/hosts.
    # proxy_pass without a URI part forwards the raw request URI (OPTIONS preflights and "events:batch" unchanged).
    location /api/core/ {
      proxy_pass http://host.containers.internal:8081;
    }
    # Platform (super_admin) API is served by core-service too; /internal/** stays blocked above.
    location /platform/ {
      proxy_pass http://host.containers.internal:8081;
    }
    # Matched on the normalised URI (also "events%3Abatch"); forwarded byte-for-byte like /api/game/.
    location ~ ^/api/game/matches/[^/]+/events:batch$ {
      limit_req zone=events burst=60 nodelay;
      proxy_pass http://host.containers.internal:8082;
    }
    # No Upgrade / Connection forwarding: no service speaks WebSocket, and a client-chosen Upgrade (h2c) could open a
    # tunnel past this proxy's /internal block and rate limits (SD-04).
    location /api/game/ {
      proxy_pass http://host.containers.internal:8082;
    }
    location /api/athlete/ {
      proxy_pass http://host.containers.internal:8083;
    }
    # finance-service (ADR-0055): `just finance-up` (container) or `go run ./cmd/finance-service` on the host, port 8085.
    # Its CSV exports get the export brake (ADR-0048, P-12), colon or %3A form (nginx matches the decoded URI).
    location ~ ^/api/finance/(dues|expenses):export$ {
      include /etc/nginx/hoops/export-limits.conf;
      proxy_pass http://host.containers.internal:8085;
    }
    location /api/finance/ {
      proxy_pass http://host.containers.internal:8085;
    }

    # ---- web app (Flutter PWA) ----
    # Entry points and service workers are revalidated on every load so a new version rolls out.
    location ~ ^/(index\.html|sw\.js|flutter_service_worker\.js|flutter_bootstrap\.js|manifest\.json|version\.json)$ {
      root /usr/share/nginx/html;
      include /etc/nginx/hoops/web-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    location = /redirect.html {
      root /usr/share/nginx/html;
      include /etc/nginx/hoops/redirect-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    location / {
      root /usr/share/nginx/html;
      include /etc/nginx/hoops/web-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
