# limit_req of the CSV exports and the public academy request (WP115, ADR-0033 amendment WP100): per client IP,
# 10 a minute and 2 a second. The burst lets a client use the whole minute allowance at once, as the gateway's counter does.
limit_req zone=export_min burst=9 nodelay;
limit_req zone=export_sec burst=1 nodelay;
