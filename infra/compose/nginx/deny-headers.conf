# Headers for the proxy's own 403 deny responses (/internal, Keycloak admin console, master realm). A `return` inside
# a location still emits add_header ... always; without these the bare 403 page has no CSP / frame headers (ZAP 10038).
# form-action, base-uri and frame-ancestors do not fall back to default-src, so each is set explicitly (ZAP 10055).
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
