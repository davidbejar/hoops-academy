# HOOPS_EXPOSE_KC_ADMIN=false (default): the admin console and the master realm are not reachable through the
# proxy. The Admin REST API of realm `academy` stays reachable: core-service in dev provisions users through
# KEYCLOAK_URL=http://localhost:8080/auth with its academy service-account token (realm-management roles only).
location = /auth/admin { include /etc/nginx/hoops/deny-headers.conf; return 403; }
location ^~ /auth/admin/ { include /etc/nginx/hoops/deny-headers.conf; return 403; }
location ^~ /auth/admin/realms/academy/ { include /etc/nginx/hoops/keycloak-proxy.conf; }
location ^~ /auth/realms/master/ { include /etc/nginx/hoops/deny-headers.conf; return 403; }
