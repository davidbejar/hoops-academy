# Proxy settings for Keycloak locations (large cookies / headers).
proxy_pass http://keycloak:8080;
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
# Headers Keycloak does not set (ZAP 10063, 90004; SD-08). An add_header here drops the server-level ones, so nosniff
# is repeated; Referrer-Policy is Keycloak's own (no-referrer). COOP same-origin is safe: the app signs in by same-page
# redirect (oidc samePage), and Keycloak is same-origin with the app behind this proxy. CORP same-origin does not touch
# CORS requests (discovery, JWKS, token). No COEP: nothing here needs cross-origin isolation.
add_header X-Content-Type-Options nosniff always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
