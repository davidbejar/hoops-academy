# Security headers every page, deny answer and Keycloak location of the proxy sends (INF-05; ZAP 10063, 90004; SD-08).
# Included by web-headers.conf, redirect-headers.conf, deny-headers.conf and keycloak-proxy.conf: an add_header inside a
# location drops every inherited one, so each of those sets the full list, this file being its shared part.
add_header X-Content-Type-Options nosniff always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
