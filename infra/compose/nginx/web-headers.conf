# Headers for the web app (SPA, service worker, OIDC redirect page). Included in every location that serves it,
# because an add_header inside a location drops all inherited ones.
# CSP: TEMPORARY - the current build loads CanvasKit from www.gstatic.com and the Roboto/Noto fallback fonts from
# fonts.gstatic.com (Flutter defaults); drop both hosts once apps/web self-hosts them (canvasKitBaseUrl or
# --no-web-resources-cdn + bundled fonts). The inline service-worker registration of index.html is allowed by hash
# -> scripts/csp-hashes.py --check (redirect.html has its own CSP: redirect-headers.conf). 'wasm-unsafe-eval' = WebAssembly compile
# only (no JS eval). style-src needs 'unsafe-inline' for the <style> elements the Flutter engine injects.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com 'sha256-xv+zVrae4l53W/Eu7Lzq5at54VZX4QP4iGfI24sNZ9c='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
