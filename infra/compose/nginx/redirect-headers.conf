# OIDC redirect page (package:oidc redirect.html): its own strict CSP; inline script + style allowed by hash
# (scripts/csp-hashes.py --check).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-MFQIK43OhlpbRPgsX6PNccWesVXaQb6wsOycvoMfljg='; style-src 'self' 'sha256-QyEhmZ89GEuGqza2NYzDjFmAkZw84oaw7yEg6nHcAw8='; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
