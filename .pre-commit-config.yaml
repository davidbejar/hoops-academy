# Hook repos are pinned by the commit a tag names (AG-12: a hook runs in every agent's shell at every commit; a tag can be
# moved). `# frozen: <tag>` is what `pre-commit autoupdate --freeze` writes; scripts/bump_pins.py moves both together.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e # frozen: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
        # helm golden snapshots must stay byte-identical to `helm template` output (deploy/helm/tests/run.sh)
        exclude: '^deploy/helm/tests/snapshots/'
      - id: trailing-whitespace
        exclude: '(\.md$|^deploy/helm/tests/snapshots/)'
      - id: check-yaml
        args: [--allow-multiple-documents]
        # mkdocs.yml carries a !!python/name tag (Mermaid fences) that safe YAML cannot load; `just docs-build` checks it
        exclude: '(^deploy/helm/.*/templates/|^mkdocs\.yml$)'
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
  # OpenTofu (WP104): formatting of infra/tofu; the full check (validate, tests, scan) is `just tofu-check`
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt -check (infra/tofu)
        entry: tofu -chdir=infra/tofu fmt -check -recursive -diff
        language: system
        files: '^infra/tofu/.*\.(tf|tftest\.hcl|tfvars\.example)$'
        pass_filenames: false
