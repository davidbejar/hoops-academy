repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
        # helm golden snapshots must stay byte-identical to `helm template` output (deploy/helm/tests/run.sh)
        exclude: '^deploy/helm/tests/snapshots/'
      - id: trailing-whitespace
        exclude: '(\.md$|^deploy/helm/tests/snapshots/)'
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '^deploy/helm/.*/templates/'
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
  # OpenTofu (WP104): formatting of infra/tofu; the full check (validate, tests, scan) is `just tofu-check`
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt -check (infra/tofu)
        entry: tofu -chdir=infra/tofu fmt -check -recursive -diff
        language: system
        files: '^infra/tofu/.*\.(tf|tftest\.hcl|tfvars\.example)$'
        pass_filenames: false
